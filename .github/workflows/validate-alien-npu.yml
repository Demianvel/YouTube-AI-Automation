name: Validate Alien NPU Brain

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/alien_npu_brain.py"
      - "app/npu_seo_cortex.py"
      - "app/npu_internal_cortex.py"
      - "app/fast_spiritual_metadata.py"
      - "scripts/npu_brain_learn.py"
      - "scripts/npu_seo_train.py"
      - "scripts/npu_internal_train.py"
      - ".github/workflows/dioshablahoyia-alien-npu.yml"
      - ".github/workflows/dioshablahoyia-growth-engine.yml"
      - ".github/workflows/validate-alien-npu.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile local NPU modules
        run: |
          python -m py_compile \
            app/alien_npu_brain.py \
            app/npu_seo_cortex.py \
            app/npu_internal_cortex.py \
            app/fast_spiritual_metadata.py \
            scripts/npu_brain_learn.py \
            scripts/npu_seo_train.py \
            scripts/npu_internal_train.py

      - name: Validate zero-quota NPU, quality and fail-open behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.alien_npu_brain import build_brain_state, rerank_themes
          from app.fast_spiritual_metadata import THEMES, build_fast_metadata
          from app.npu_internal_cortex import build_internal_profile, rerank_for_quality
          from app.npu_seo_cortex import build_seo_profile, blend_growth_with_seo
          from app.youtube_growth_engine import ranked_theme_indices

          growth = {
              "version": "test-growth",
              "data_quality": {"videos_scored": 42, "analytics_api_available": True, "warnings": []},
              "top_outliers": [
                  {"video_id":"winner", "title":"Paz en la tormenta | Marcos 4:39-40", "content_family":"Marcos 4 y Jesus calma la tormenta", "bible_reference":"Marcos 4:39-40", "growth_score":94, "outlier_ratio":2.8, "engagement":96, "satisfaction":92},
                  {"video_id":"birds", "title":"Dios cuida las aves | Mateo 6:31-34", "content_family":"Mateo 6 y aves", "bible_reference":"Mateo 6:31-34", "growth_score":90, "outlier_ratio":2.1, "engagement":91, "satisfaction":93},
              ],
              "reference_weights": [{"key":"Marcos 4:39-40", "mean_score":94}, {"key":"Mateo 6:31-34", "mean_score":90}],
              "family_weights": [{"key":"Marcos 4 y Jesus calma la tormenta", "mean_score":93}],
              "keyword_weights": [{"key":"tormenta", "mean_score":94}, {"key":"paz", "mean_score":92}, {"key":"aves", "mean_score":88}],
          }
          seo = build_seo_profile(growth, niche_radar={}, market_radar={})
          blended = blend_growth_with_seo(growth, seo)
          brain = build_brain_state(blended, niche_radar={}, market_radar={})

          history = [
              {"channel":"dioshablahoyia","status":"uploaded","video_id":"a","title":"Dios trae paz y esperanza","bible_reference":"Juan 14:27","content_family":"paz y esperanza"},
              {"channel":"dioshablahoyia","status":"uploaded","video_id":"b","title":"Una enseñanza para el corazón","bible_reference":"Salmo 23:1-4","content_family":"consuelo y confianza"},
          ]
          internal = build_internal_profile(history, growth, seo, {})
          assert internal["training_mode"] == "local_only_zero_external_calls"
          assert internal["mission"]["publishing_must_continue"] is True
          assert internal["mission"]["never_sacrifice_quality_for_clickbait"] is True
          assert internal["training_generation"] == 1

          previous = [{"status":"uploaded", "bible_reference":"Salmo 23:1-4", "content_family":"Salmo 23"}]
          baseline = ranked_theme_indices(THEMES, previous, 12345, profile=blended)
          npu_ranked = rerank_themes(THEMES, previous, 12345, baseline, state=brain)
          quality_ranked = rerank_for_quality(THEMES, previous, npu_ranked, state=internal)
          assert len(quality_ranked) == len(THEMES)
          assert all(0 <= score <= 100 for _, score, _ in quality_ranked)

          workflow = Path('.github/workflows/dioshablahoyia-alien-npu.yml').read_text(encoding='utf-8')
          assert 'cron: "17 * * * *"' in workflow
          for forbidden in ('YOUTUBE_TOKEN_', 'google-api-python-client', 'npu_market_radar.py --channel', 'growth_radar.py --channel'):
              assert forbidden not in workflow

          growth_workflow = Path('.github/workflows/dioshablahoyia-growth-engine.yml').read_text(encoding='utf-8')
          assert 'workflow_dispatch:' in growth_workflow
          assert 'schedule:' not in growth_workflow

          base = {"scenes": [{"visual_prompt":"test"} for _ in range(6)]}
          result = build_fast_metadata(base, {"scenes_per_short":6}, [])
          assert result["title"] and result["bible_reference"]
          assert len(result["scenes"]) == 6
          assert result["editorial_tone"].startswith("emotivo_")
          print("ZERO_QUOTA_INTERNAL_NPU_VALIDATION_OK")
          PY
