name: Dios Habla Hoy IA - 10 Shorts diarios

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Canal bloqueado
        required: true
        default: dioshablahoyia
        type: choice
        options:
          - dioshablahoyia
      content_mode:
        description: Formato bloqueado
        required: true
        default: voice
        type: choice
        options:
          - voice
      dry_run:
        description: Compatibilidad; el recuperador canonico controla la publicacion
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "triggers/dioshablahoyia-short-now.txt"

permissions:
  actions: write
  contents: read

concurrency:
  group: dioshablahoyia-legacy-short-forwarder
  cancel-in-progress: true

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Forward legacy request to canonical Algenib publisher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ACTIVE="$(gh run list -R "$GITHUB_REPOSITORY" --workflow dioshablahoyia-algenib-emergency.yml --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length' 2>/dev/null || echo 0)"
          if [ "$ACTIVE" -gt 0 ]; then
            echo "El recuperador canonico ya esta activo; no duplicar."
            exit 0
          fi
          echo "El publicador antiguo Gemini 3.1/HF fue retirado por cuota. Redirigiendo a Algenib 2.5."
          gh workflow run dioshablahoyia-algenib-emergency.yml -R "$GITHUB_REPOSITORY" --ref main
