name: Dios Habla Hoy IA - 10 Shorts diarios

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Canal bloqueado
        required: true
        default: dioshablahoyia
        type: choice
        options:
          - dioshablahoyia
      content_mode:
        description: Formato bloqueado
        required: true
        default: voice
        type: choice
        options:
          - voice
      dry_run:
        description: Generar sin subir a YouTube
        required: true
        default: false
        type: boolean
  push:
    paths:
      - "triggers/dioshablahoyia-short-now.txt"
  schedule:
    - cron: "30 10,13,16,19,22 * * *"
    - cron: "0 0,12,15,18,21 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: dioshablahoyia-short-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .
      TZ: America/Argentina/Buenos_Aires
      CHANNEL: dioshablahoyia
      CONTENT_MODE: voice
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.6-flash
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Algenib
      GEMINI_TTS_MAX_ATTEMPTS: "2"
      SPIRITUAL_MALE_GEMINI_VOICE: Algenib
      SPIRITUAL_VOICE_PROFILE: voz_de_luz_serena_original_v1
      SPIRITUAL_VOICE_BRAND: Voz de Luz
      SPIRITUAL_VOICE_REFERENCE_MODE: fresh_github_reference_bank_no_speaker_clone
      SPIRITUAL_VOICE_LOCKED: "true"
      SPIRITUAL_VOICEOVER_MODE: "true"
      SPIRITUAL_LIPSYNC_ENABLED: "false"
      SPIRITUAL_REQUIRE_PRIMARY_VOICE: "true"
      SPIRITUAL_SHORT_SECONDS: "60"
      SPIRITUAL_SHORT_SCENE_SECONDS: "10"
      SPIRITUAL_SHORT_AI_CLIPS: "0"
      SPIRITUAL_ALLOW_STILL_FALLBACK: "true"
      SPIRITUAL_FAST_RENDER: "true"
      SPIRITUAL_VISUAL_VARIETY_LEVEL: maximum
      SPIRITUAL_EDITORIAL_VARIETY_LEVEL: high
      SPIRITUAL_CTA_OVERLAY: "false"
      SPIRITUAL_REQUIRE_FRESH_VISUAL: "true"
      SPIRITUAL_VISUAL_PHASH_MAX_DISTANCE: "7"
      TTS_PROVIDER: gemini_tts
      TTS_FALLBACK_KOKORO: "false"
      KOKORO_VOICE: em_alex
      KOKORO_SPEED: "0.91"
      GEMINI_VIDEO_ENABLED: "false"
      HF_VIDEO_ENABLED: "false"
      HF_REQUIRE_TEXT_TO_VIDEO: "false"
      HF_VIDEO_STRICT: "false"
      HF_REFERENCE_IMAGE_ENABLED: "true"
      HF_REFERENCE_EDITOR_ENABLED: "true"
      HF_REFERENCE_ZERO_SPACE: black-forest-labs/FLUX.1-Kontext-Dev
      HF_TEXT_ZERO_ENABLED: "true"
      HF_TEXT_ZERO_SPACE: black-forest-labs/FLUX.1-schnell
      HF_REFERENCE_ZERO_SPACE_FIRST: "true"
      HF_ZERO_AUTH_RETRY: "true"
      HF_REMOTE_CIRCUIT_BREAKER: "true"
      HF_INFERENCE_PROVIDER_ENABLED: "true"
      HF_ZERO_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SPIRITUAL_REFERENCE_AVOID_RECENT: "100"
      DIOS_FAST_LOCAL_VISUAL_MODE: "false"
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      MUSIC_PROVIDER: local
      YOUTUBE_TOKEN_DIOSHABLAHOYIA: ${{ secrets.YOUTUBE_TOKEN_DIOSHABLAHOYIA }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_GRAPH_API_VERSION: v25.0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enforce exactly 10 uploaded Shorts per Argentina day
        id: daily_cap
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          target = 10
          zone = ZoneInfo("America/Argentina/Buenos_Aires")
          today = datetime.now(zone).date()
          history = Path("state/history.jsonl")
          uploaded = 0

          if history.exists():
              for raw in history.read_text(encoding="utf-8").splitlines():
                  try:
                      row = json.loads(raw)
                  except Exception:
                      continue
                  if row.get("channel") != "dioshablahoyia" or row.get("status") != "uploaded":
                      continue
                  stamp = str(row.get("created_at") or "").strip()
                  if not stamp:
                      continue
                  try:
                      moment = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
                  except ValueError:
                      continue
                  if moment.tzinfo is None:
                      moment = moment.replace(tzinfo=timezone.utc)
                  if moment.astimezone(zone).date() == today:
                      uploaded += 1

          should_publish = uploaded < target
          print(f"Shorts subidos hoy en Argentina: {uploaded}/{target}")
          if not should_publish:
              print("Objetivo diario ya cumplido: se omite esta ejecucion para no gastar cuota TTS ni publicar un Short extra.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"count={uploaded}\n")
              handle.write(f"should_publish={'true' if should_publish else 'false'}\n")
          PY

      - name: Install lightweight Dios runtime
        if: steps.daily_cap.outputs.should_publish == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1 fonts-dejavu-core git >/dev/null
          python -m pip install -q --upgrade pip
          pip install -q "google-genai>=2.3.0" "google-api-python-client>=2.170.0" "google-auth>=2.40.0" "google-auth-oauthlib>=1.2.2" "Pillow>=11.0.0" "requests>=2.32.0" "numpy<3,>=1.26" "soundfile>=0.13.1" "huggingface_hub<2,>=0.34.4" "gradio_client<3,>=1.11.0"

      - name: Verify fixed voice and fresh bank
        if: steps.daily_cap.outputs.should_publish == 'true'
        run: |
          python scripts/check_ready.py --generation-only
          test -n "$YOUTUBE_TOKEN_DIOSHABLAHOYIA"
          test -n "$HF_ZERO_TOKEN"
          test -n "$HF_TOKEN"
          test "$GEMINI_TTS_VOICE" = "Algenib"
          test "$SPIRITUAL_REQUIRE_PRIMARY_VOICE" = "true"
          test "$SPIRITUAL_VOICE_LOCKED" = "true"
          python -m py_compile scripts/publish_dios_fast.py app/pipeline.py app/facebook_pages.py app/spiritual_reference_generation.py app/spiritual_image.py app/spiritual_tts.py app/spiritual_audio.py app/spiritual_continuity.py app/dios_visual_integrity.py

      - name: Generate fresh Short
        if: steps.daily_cap.outputs.should_publish == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m app.pipeline --channel dioshablahoyia --content-mode voice --dry-run
          else
            python scripts/publish_dios_fast.py
          fi

      - name: Persist anti-duplicate history
        if: success() && steps.daily_cap.outputs.should_publish == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
        shell: bash
        run: |
          LAST_RECORD="$(tail -n 1 state/history.jsonl)"
          test -n "$LAST_RECORD"
          mkdir -p /tmp/dios-short-history
          printf '%s\n' "$LAST_RECORD" > /tmp/dios-short-history/last.jsonl
          git config user.name "youtube-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p state
            touch state/history.jsonl
            RECORD="$(cat /tmp/dios-short-history/last.jsonl)"
            VIDEO_ID="$(printf '%s' "$RECORD" | python -c 'import json,sys; print(json.load(sys.stdin).get("video_id", ""))' 2>/dev/null || true)"
            if [ -n "$VIDEO_ID" ] && grep -Fq "\"video_id\": \"$VIDEO_ID\"" state/history.jsonl; then
              exit 0
            fi
            printf '%s\n' "$RECORD" >> state/history.jsonl
            git add state/history.jsonl
            git commit -m "chore: update Dios Shorts history"
            git push origin HEAD:main && exit 0
          done
          exit 1

      - name: Upload generated artifact
        if: always() && steps.daily_cap.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dioshablahoyia-short-${{ github.run_id }}
          path: output/
          retention-days: 2
          if-no-files-found: warn

      - name: Open issue on strict publishing failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Dios Habla Hoy - fallo un Short programado" --body "No se publico con una voz alternativa ni con visual repetido. Revisar Actions run $GITHUB_RUN_ID."
