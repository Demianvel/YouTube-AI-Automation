name: Dios Habla Hoy IA - 10 Shorts diarios

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Canal bloqueado
        required: true
        default: dioshablahoyia
        type: choice
        options:
          - dioshablahoyia
      content_mode:
        description: Formato bloqueado
        required: true
        default: voice
        type: choice
        options:
          - voice
      dry_run:
        description: Generar sin subir a YouTube
        required: true
        default: false
        type: boolean
  push:
    paths:
      - "triggers/dioshablahoyia-short-now.txt"
  schedule:
    - cron: "30 10,13,16,19,22 * * *"
    - cron: "0 0,12,15,18,21 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: dioshablahoyia-short-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      TZ: America/Argentina/Buenos_Aires
      CHANNEL: dioshablahoyia
      CONTENT_MODE: voice
      SPIRITUAL_LOCAL_MEDIA_ENGINE: "true"
      SPIRITUAL_LOCAL_VOICE_LOCK: "true"
      SPIRITUAL_VOICE_PROFILE: voz_de_luz_local_original_v1
      SPIRITUAL_VOICE_BRAND: Voz de Luz Local
      SPIRITUAL_VOICE_LOCKED: "true"
      SPIRITUAL_VOICEOVER_MODE: "true"
      SPIRITUAL_LIPSYNC_ENABLED: "false"
      SPIRITUAL_REQUIRE_PRIMARY_VOICE: "false"
      SPIRITUAL_SHORT_SECONDS: "60"
      SPIRITUAL_SHORT_SCENE_SECONDS: "10"
      SPIRITUAL_SHORT_AI_CLIPS: "0"
      SPIRITUAL_ALLOW_STILL_FALLBACK: "true"
      SPIRITUAL_FAST_RENDER: "true"
      SPIRITUAL_VISUAL_VARIETY_LEVEL: maximum
      SPIRITUAL_EDITORIAL_VARIETY_LEVEL: high
      SPIRITUAL_CTA_OVERLAY: "false"
      SPIRITUAL_REQUIRE_FRESH_VISUAL: "true"
      SPIRITUAL_VISUAL_PHASH_MAX_DISTANCE: "7"
      TTS_PROVIDER: local
      TTS_FALLBACK_KOKORO: "true"
      GEMINI_API_KEY: ""
      GEMINI_VIDEO_ENABLED: "false"
      HF_VIDEO_ENABLED: "false"
      HF_REQUIRE_TEXT_TO_VIDEO: "false"
      HF_VIDEO_STRICT: "false"
      HF_REFERENCE_IMAGE_ENABLED: "false"
      HF_REFERENCE_EDITOR_ENABLED: "false"
      HF_TEXT_ZERO_ENABLED: "false"
      HF_INFERENCE_PROVIDER_ENABLED: "false"
      HF_ZERO_TOKEN: ""
      HF_TOKEN: ""
      PEXELS_API_KEY: ""
      POLLINATIONS_API_KEY: ""
      MUSIC_PROVIDER: local
      YOUTUBE_TOKEN_DIOSHABLAHOYIA: ${{ secrets.YOUTUBE_TOKEN_DIOSHABLAHOYIA }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_GRAPH_API_VERSION: v25.0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Enforce exactly 10 uploaded Shorts per Argentina day
        id: daily_cap
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          target = 10
          zone = ZoneInfo("America/Argentina/Buenos_Aires")
          today = datetime.now(zone).date()
          history = Path("state/history.jsonl")
          uploaded = 0

          if history.exists():
              for raw in history.read_text(encoding="utf-8").splitlines():
                  try:
                      row = json.loads(raw)
                  except Exception:
                      continue
                  if row.get("channel") != "dioshablahoyia" or row.get("status") != "uploaded":
                      continue
                  stamp = str(row.get("created_at") or "").strip()
                  if not stamp:
                      continue
                  try:
                      moment = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
                  except ValueError:
                      continue
                  if moment.tzinfo is None:
                      moment = moment.replace(tzinfo=timezone.utc)
                  if moment.astimezone(zone).date() == today:
                      uploaded += 1

          should_publish = uploaded < target
          print(f"Shorts subidos hoy en Argentina: {uploaded}/{target}")
          if not should_publish:
              print("Objetivo diario ya cumplido: se omite esta ejecucion para no publicar un Short extra.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"count={uploaded}\n")
              handle.write(f"should_publish={'true' if should_publish else 'false'}\n")
          PY

      - name: Install quota-free Dios runtime
        if: steps.daily_cap.outputs.should_publish == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1 fonts-dejavu-core git >/dev/null
          python -m pip install -q --upgrade pip
          pip install -q \
            "google-genai>=2.3.0" \
            "google-api-python-client>=2.170.0" \
            "google-auth>=2.40.0" \
            "google-auth-oauthlib>=1.2.2" \
            "Pillow>=11.0.0" \
            "requests>=2.32.0" \
            "numpy<3,>=1.26" \
            "soundfile>=0.13.1" \
            "huggingface_hub<2,>=0.34.4" \
            "gradio_client<3,>=1.11.0"
          pip install -q "kokoro>=0.9.4" || echo "Kokoro opcional no disponible; espeak-ng queda como voz local garantizada."

      - name: Verify local image and voice engine
        if: steps.daily_cap.outputs.should_publish == 'true'
        shell: bash
        run: |
          test "$SPIRITUAL_LOCAL_MEDIA_ENGINE" = "true"
          test "$SPIRITUAL_LOCAL_VOICE_LOCK" = "true"
          test "$TTS_PROVIDER" = "local"
          test -z "$GEMINI_API_KEY"
          test -z "$HF_TOKEN"
          test -z "$HF_ZERO_TOKEN"
          test -z "$PEXELS_API_KEY"
          test -z "$POLLINATIONS_API_KEY"
          if ! { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; }; then
            test -n "$YOUTUBE_TOKEN_DIOSHABLAHOYIA"
          fi
          python -m py_compile \
            scripts/publish_dios_fast.py \
            scripts/publish_dios_fast_local_emergency.py \
            app/local_spiritual_media.py \
            app/pipeline.py \
            app/spiritual_image.py \
            app/spiritual_audio.py \
            app/spiritual_continuity.py \
            app/dios_visual_integrity.py

      - name: Generate fresh Short locally
        if: steps.daily_cap.outputs.should_publish == 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            DIOS_LOCAL_DRY_RUN=true python scripts/publish_dios_fast_local_emergency.py
          else
            DIOS_LOCAL_DRY_RUN=false python scripts/publish_dios_fast_local_emergency.py
          fi

      - name: Persist anti-duplicate history
        if: success() && steps.daily_cap.outputs.should_publish == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
        shell: bash
        run: |
          LAST_RECORD="$(tail -n 1 state/history.jsonl)"
          test -n "$LAST_RECORD"
          mkdir -p /tmp/dios-short-history
          printf '%s\n' "$LAST_RECORD" > /tmp/dios-short-history/last.jsonl
          git config user.name "youtube-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p state
            touch state/history.jsonl
            RECORD="$(cat /tmp/dios-short-history/last.jsonl)"
            VIDEO_ID="$(printf '%s' "$RECORD" | python -c 'import json,sys; print(json.load(sys.stdin).get("video_id", ""))' 2>/dev/null || true)"
            if [ -n "$VIDEO_ID" ] && grep -Fq "\"video_id\": \"$VIDEO_ID\"" state/history.jsonl; then
              exit 0
            fi
            printf '%s\n' "$RECORD" >> state/history.jsonl
            git add state/history.jsonl
            git commit -m "chore: update Dios Shorts history"
            git push origin HEAD:main && exit 0
          done
          exit 1

      - name: Upload generated artifact
        if: always() && steps.daily_cap.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dioshablahoyia-short-${{ github.run_id }}
          path: output/
          retention-days: 2
          if-no-files-found: warn

      - name: Open issue on local publishing failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Dios Habla Hoy - fallo un Short local programado" --body "El motor local sin cuota no pudo publicar. Revisar Actions run $GITHUB_RUN_ID. La generacion de imagen/voz no usa Gemini, HF inference, Pexels ni Pollinations."
