name: Generate and publish Shorts

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Canal a ejecutar
        required: true
        type: choice
        options:
          - brotavida
          - dineroclaro
          - envikids
      dry_run:
        description: Generar sin subir a YouTube
        required: true
        default: true
        type: boolean
  schedule:
    # Argentina UTC-3. Si N8N_PRIMARY=true, n8n controla los horarios y GitHub no duplica.
    # BrotaVida: 00,06,12,18. DineroClaro: 08,13,17,21. EnViKids: manual hasta autorizar OAuth.
    - cron: "0 3,9,15,21 * * *"
    - cron: "0 0,11,16,20 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: youtube-ai-publisher-${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'schedule' }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'schedule' || vars.N8N_PRIMARY != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.6-flash
      VIDEO_PROVIDER: real_stock
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      POLLINATIONS_IMAGE_MODEL: flux
      TTS_PROVIDER: kokoro
      KOKORO_VOICE: em_alex
      KOKORO_SPEED: "0.95"
      MUSIC_PROVIDER: local
      YOUTUBE_TOKEN_BROTAVIDA: ${{ secrets.YOUTUBE_TOKEN_BROTAVIDA }}
      YOUTUBE_TOKEN_DINEROCLARO: ${{ secrets.YOUTUBE_TOKEN_DINEROCLARO }}
      YOUTUBE_TOKEN_ENVIKIDS: ${{ secrets.YOUTUBE_TOKEN_ENVIKIDS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select channel and voice
        id: select
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ inputs.channel }}"
          elif [ "${{ github.event.schedule }}" = "0 3,9,15,21 * * *" ]; then
            CHANNEL="brotavida"
          elif [ "${{ github.event.schedule }}" = "0 0,11,16,20 * * *" ]; then
            CHANNEL="dineroclaro"
          else
            CHANNEL=""
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"

          if [ "$CHANNEL" = "envikids" ]; then
            echo "KOKORO_VOICE=ef_dora" >> "$GITHUB_ENV"
            echo "KOKORO_SPEED=1.02" >> "$GITHUB_ENV"
          elif [ "$CHANNEL" = "dineroclaro" ]; then
            echo "KOKORO_VOICE=em_alex" >> "$GITHUB_ENV"
            echo "KOKORO_SPEED=0.95" >> "$GITHUB_ENV"
          fi

      - name: Check generation credentials
        id: readiness
        if: env.CHANNEL != ''
        shell: bash
        run: |
          if python scripts/check_ready.py --generation-only; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            if [ "$CHANNEL" = "envikids" ]; then
              echo "EnViKids: visuales 3D generados; Pollinations key es opcional."
            elif [ -n "$PEXELS_API_KEY" ]; then
              echo "Pexels disponible como fuente preferida de metraje real."
            else
              echo "Sin Pexels API key: se usara Wikimedia Commons con video real obligatorio."
            fi
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Falta GEMINI_API_KEY para crear tema, titulo y descripcion."
            exit 1
          fi

      - name: Determine upload mode
        id: upload
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          READY=false
          if [ "$CHANNEL" = "brotavida" ] && [ -n "$YOUTUBE_TOKEN_BROTAVIDA" ]; then
            READY=true
          elif [ "$CHANNEL" = "dineroclaro" ] && [ -n "$YOUTUBE_TOKEN_DINEROCLARO" ]; then
            READY=true
          elif [ "$CHANNEL" = "envikids" ] && [ -n "$YOUTUBE_TOKEN_ENVIKIDS" ]; then
            READY=true
          fi
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          if [ "$READY" = "true" ]; then
            echo "Token de YouTube disponible para $CHANNEL."
          else
            echo "Token de YouTube ausente para $CHANNEL: se generara sin publicar."
          fi

      - uses: actions/setup-python@v5
        if: steps.readiness.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install and verify Kokoro Spanish TTS
        if: steps.readiness.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python - <<'PY'
          import os
          import numpy as np
          import soundfile as sf
          from pathlib import Path
          from kokoro import KPipeline

          pipeline = KPipeline(lang_code='e')
          voice = os.getenv('KOKORO_VOICE', 'em_alex')
          speed = float(os.getenv('KOKORO_SPEED', '0.95'))
          parts = []
          text = 'Hola. Esta es una prueba clara de voz natural en castellano.'
          for _g, _p, audio in pipeline(text, voice=voice, speed=speed):
              if audio is not None and len(audio):
                  parts.append(np.asarray(audio, dtype=np.float32))
          if not parts:
              raise RuntimeError('Kokoro se instalo pero no genero audio en español.')
          out = Path('/tmp/kokoro_spanish_test.wav')
          sf.write(out, np.concatenate(parts), 24000, subtype='PCM_16')
          if not out.exists() or out.stat().st_size < 5000:
              raise RuntimeError('La prueba de Kokoro produjo audio invalido.')
          print('Kokoro Spanish OK -', voice, '- bytes:', out.stat().st_size)
          PY

      - name: Generate Short and optionally upload
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ steps.upload.outputs.ready }}" != "true" ]; then
            EXTRA="--dry-run"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA="--dry-run"
          fi
          python -m app.pipeline --channel "$CHANNEL" $EXTRA

      - name: Persist anti-duplicate history
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "youtube-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          NEW_RECORD="$(tail -n 1 state/history.jsonl)"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p state
            touch state/history.jsonl
            if ! grep -Fqx "$NEW_RECORD" state/history.jsonl; then
              printf '%s\n' "$NEW_RECORD" >> state/history.jsonl
            fi
            git add state/history.jsonl
            if git diff --cached --quiet; then
              echo "El registro ya existe en el historial."
              exit 0
            fi
            git commit -m "chore: update Shorts history"
            if git push origin HEAD:main; then
              echo "Historial guardado correctamente."
              exit 0
            fi
            echo "Otro cambio llego a main; reintentando historial ($attempt/5)."
          done

          echo "No se pudo guardar el historial tras 5 intentos." >&2
          exit 1

      - name: Upload generated artifact for inspection
        if: steps.readiness.outputs.ready == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ env.CHANNEL }}-${{ github.run_id }}
          path: output/
          retention-days: 3

      - name: Open issue on pipeline failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Automation failure: $CHANNEL" --body "El workflow de Shorts fallo. Revisar Actions run $GITHUB_RUN_ID."
