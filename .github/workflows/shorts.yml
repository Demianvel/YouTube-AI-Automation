name: Generate and publish Shorts

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Canal a ejecutar
        required: true
        type: choice
        options:
          - brotavida
          - dineroclaro
          - envikids
      content_mode:
        description: Formato de audio (BrotaVida); DineroClaro/EnViKids usan voz
        required: true
        default: auto
        type: choice
        options:
          - auto
          - asmr
          - music
          - voice
      dry_run:
        description: Generar sin subir a YouTube
        required: true
        default: true
        type: boolean
  schedule:
    # Horarios UTC. Argentina (UTC-3):
    # BrotaVida 10:00,12:00,14:00,16:00,18:00
    # DineroClaro 10:10,12:10,14:10,16:10,18:10
    # EnViKids 10:20,12:20,14:20,16:20,18:20
    - cron: "0 13,15,17,19,21 * * *"
    - cron: "10 13,15,17,19,21 * * *"
    - cron: "20 13,15,17,19,21 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: youtube-ai-publisher-${{ github.event_name == 'workflow_dispatch' && inputs.channel || github.event.schedule || 'unknown' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.6-flash
      VIDEO_PROVIDER: real_stock
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      POLLINATIONS_IMAGE_MODEL: flux
      HF_VIDEO_ENABLED: "true"
      HF_REQUIRE_TEXT_TO_VIDEO: "true"
      HF_ZERO_VIDEO_SPACE: Lightricks/LTX-2-3
      HF_ZERO_RETRIES: "2"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_VIDEO_PROVIDER: auto
      HF_VIDEO_MODEL: Wan-AI/Wan2.2-TI2V-5B
      TTS_PROVIDER: chatterbox_latam
      TTS_FALLBACK_KOKORO: "true"
      CHATTERBOX_EXAGGERATION: "0.62"
      CHATTERBOX_CFG_WEIGHT: "0.38"
      CHATTERBOX_TEMPERATURE: "0.80"
      KOKORO_VOICE: em_alex
      KOKORO_SPEED: "0.98"
      MUSIC_PROVIDER: local
      YOUTUBE_TOKEN_BROTAVIDA: ${{ secrets.YOUTUBE_TOKEN_BROTAVIDA }}
      YOUTUBE_TOKEN_DINEROCLARO: ${{ secrets.YOUTUBE_TOKEN_DINEROCLARO }}
      YOUTUBE_TOKEN_ENVIKIDS: ${{ secrets.YOUTUBE_TOKEN_ENVIKIDS }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select channel and content format
        id: select
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ inputs.channel }}"
            CONTENT_MODE="${{ inputs.content_mode }}"
          elif [ "${{ github.event.schedule }}" = "0 13,15,17,19,21 * * *" ]; then
            CHANNEL="brotavida"
            CONTENT_MODE="asmr"
          elif [ "${{ github.event.schedule }}" = "10 13,15,17,19,21 * * *" ]; then
            CHANNEL="dineroclaro"
            CONTENT_MODE="voice"
          elif [ "${{ github.event.schedule }}" = "20 13,15,17,19,21 * * *" ]; then
            CHANNEL="envikids"
            CONTENT_MODE="voice"
          else
            CHANNEL=""
            CONTENT_MODE="auto"
          fi

          if [ "$CHANNEL" = "dineroclaro" ] || [ "$CHANNEL" = "envikids" ]; then
            CONTENT_MODE="voice"
          fi

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "content_mode=$CONTENT_MODE" >> "$GITHUB_OUTPUT"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "CONTENT_MODE=$CONTENT_MODE" >> "$GITHUB_ENV"

          if [ "$CHANNEL" = "envikids" ]; then
            echo "TTS_PROVIDER=kokoro" >> "$GITHUB_ENV"
            echo "KOKORO_VOICE=ef_dora" >> "$GITHUB_ENV"
            echo "KOKORO_SPEED=1.03" >> "$GITHUB_ENV"
          elif [ "$CHANNEL" = "brotavida" ]; then
            echo "TTS_PROVIDER=chatterbox_latam" >> "$GITHUB_ENV"
            echo "KOKORO_VOICE=em_alex" >> "$GITHUB_ENV"
            echo "KOKORO_SPEED=0.98" >> "$GITHUB_ENV"
          elif [ "$CHANNEL" = "dineroclaro" ]; then
            echo "TTS_PROVIDER=chatterbox_latam" >> "$GITHUB_ENV"
            echo "KOKORO_VOICE=em_alex" >> "$GITHUB_ENV"
            echo "KOKORO_SPEED=1.00" >> "$GITHUB_ENV"
          fi
          echo "Seleccionado: $CHANNEL / $CONTENT_MODE"

      - name: Check generation credentials and scheduled OAuth
        id: readiness
        if: env.CHANNEL != ''
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$CHANNEL" = "envikids" ] && [ -z "$YOUTUBE_TOKEN_ENVIKIDS" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "EnViKidsAI programado pero OAuth ausente: se omite sin gastar generacion."
            exit 0
          fi
          if python scripts/check_ready.py --generation-only; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Falta configuracion de generacion."
            exit 1
          fi

      - name: Determine upload mode
        id: upload
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          READY=false
          if [ "$CHANNEL" = "brotavida" ] && [ -n "$YOUTUBE_TOKEN_BROTAVIDA" ]; then
            READY=true
          elif [ "$CHANNEL" = "dineroclaro" ] && [ -n "$YOUTUBE_TOKEN_DINEROCLARO" ]; then
            READY=true
          elif [ "$CHANNEL" = "envikids" ] && [ -n "$YOUTUBE_TOKEN_ENVIKIDS" ]; then
            READY=true
          fi
          echo "ready=$READY" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.readiness.outputs.ready == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install base media dependencies
        if: steps.readiness.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 fonts-dejavu-core git
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chatterbox V3 family
        if: steps.readiness.outputs.ready == 'true' && env.CONTENT_MODE == 'voice'
        run: |
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-chatterbox.txt
          python - <<'PY'
          from chatterbox.mtl_tts import ChatterboxMultilingualTTS
          assert 'es' in ChatterboxMultilingualTTS.get_supported_languages()
          print('Chatterbox V3 package OK.')
          PY

      - name: Generate Short and optionally upload
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ steps.upload.outputs.ready }}" != "true" ]; then
            EXTRA="--dry-run"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA="--dry-run"
          fi
          python -m app.pipeline --channel "$CHANNEL" --content-mode "$CONTENT_MODE" $EXTRA

      - name: Persist anti-duplicate history
        if: steps.readiness.outputs.ready == 'true' && success()
        shell: bash
        run: |
          git config user.name "youtube-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          NEW_RECORD="$(tail -n 1 state/history.jsonl)"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p state
            touch state/history.jsonl
            if ! grep -Fqx "$NEW_RECORD" state/history.jsonl; then
              printf '%s\n' "$NEW_RECORD" >> state/history.jsonl
            fi
            git add state/history.jsonl
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "chore: update Shorts history"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1

      - name: Upload generated artifact for inspection
        if: steps.readiness.outputs.ready == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ env.CHANNEL }}-${{ env.CONTENT_MODE }}-${{ github.run_id }}
          path: output/
          retention-days: 3

      - name: Open issue on pipeline failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Automation failure: $CHANNEL" --body "El workflow de Shorts fallo. Revisar Actions run $GITHUB_RUN_ID."
