name: Generate and publish Shorts

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Canal a ejecutar
        required: true
        type: choice
        options:
          - brotavida
          - dineroclaro
          - envikids
      content_mode:
        description: Formato de audio (BrotaVida); DineroClaro/EnViKids usan voz
        required: true
        default: auto
        type: choice
        options:
          - auto
          - asmr
          - music
          - voice
      dry_run:
        description: Generar sin subir a YouTube
        required: true
        default: true
        type: boolean
  schedule:
    # GitHub Actions es el unico programador. Horarios en Argentina (UTC-3).
    # BrotaVida 00,09,18: 3 Shorts + 1 video largo diario a las 14:30.
    # DineroClaro 08,17,21: 3 Shorts + 1 video largo diario a las 14:30.
    # EnViKidsAI 10:30 y 19:30: 2 Shorts normales + Short 1-3 min 16:30 + largo 13:30.
    - cron: "0 3,12,21 * * *"
    - cron: "0 0,11,20 * * *"
    - cron: "30 13,22 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: youtube-ai-publisher-${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'schedule' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.6-flash
      VIDEO_PROVIDER: real_stock
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      POLLINATIONS_IMAGE_MODEL: flux
      TTS_PROVIDER: chatterbox
      TTS_FALLBACK_KOKORO: "true"
      KOKORO_VOICE: em_alex
      KOKORO_SPEED: "0.98"
      MUSIC_PROVIDER: local
      YOUTUBE_TOKEN_BROTAVIDA: ${{ secrets.YOUTUBE_TOKEN_BROTAVIDA }}
      YOUTUBE_TOKEN_DINEROCLARO: ${{ secrets.YOUTUBE_TOKEN_DINEROCLARO }}
      YOUTUBE_TOKEN_ENVIKIDS: ${{ secrets.YOUTUBE_TOKEN_ENVIKIDS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select channel and content format
        id: select
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ inputs.channel }}"
            CONTENT_MODE="${{ inputs.content_mode }}"
          elif [ "${{ github.event.schedule }}" = "0 3,12,21 * * *" ]; then
            CHANNEL="brotavida"
            CONTENT_MODE="auto"
          elif [ "${{ github.event.schedule }}" = "0 0,11,20 * * *" ]; then
            CHANNEL="dineroclaro"
            CONTENT_MODE="voice"
          elif [ "${{ github.event.schedule }}" = "30 13,22 * * *" ]; then
            CHANNEL="envikids"
            CONTENT_MODE="voice"
          else
            CHANNEL=""
            CONTENT_MODE="auto"
          fi

          if [ "$CHANNEL" = "dineroclaro" ] || [ "$CHANNEL" = "envikids" ]; then
            CONTENT_MODE="voice"
          fi

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "content_mode=$CONTENT_MODE" >> "$GITHUB_OUTPUT"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "CONTENT_MODE=$CONTENT_MODE" >> "$GITHUB_ENV"

          if [ "$CHANNEL" = "envikids" ]; then
            echo "KOKORO_VOICE=ef_dora" >> "$GITHUB_ENV"
            echo "KOKORO_SPEED=1.03" >> "$GITHUB_ENV"
          elif [ "$CHANNEL" = "brotavida" ]; then
            echo "KOKORO_VOICE=em_alex" >> "$GITHUB_ENV"
            echo "KOKORO_SPEED=0.98" >> "$GITHUB_ENV"
          elif [ "$CHANNEL" = "dineroclaro" ]; then
            echo "KOKORO_VOICE=em_alex" >> "$GITHUB_ENV"
            echo "KOKORO_SPEED=1.00" >> "$GITHUB_ENV"
          fi
          echo "Seleccionado: $CHANNEL / $CONTENT_MODE"

      - name: Check generation credentials and scheduled OAuth
        id: readiness
        if: env.CHANNEL != ''
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$CHANNEL" = "envikids" ] && [ -z "$YOUTUBE_TOKEN_ENVIKIDS" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "EnViKidsAI programado pero OAuth ausente: se omite sin gastar generacion."
            exit 0
          fi
          if python scripts/check_ready.py --generation-only; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Falta GEMINI_API_KEY para crear tema, titulo y descripcion."
            exit 1
          fi

      - name: Determine upload mode
        id: upload
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          READY=false
          if [ "$CHANNEL" = "brotavida" ] && [ -n "$YOUTUBE_TOKEN_BROTAVIDA" ]; then
            READY=true
          elif [ "$CHANNEL" = "dineroclaro" ] && [ -n "$YOUTUBE_TOKEN_DINEROCLARO" ]; then
            READY=true
          elif [ "$CHANNEL" = "envikids" ] && [ -n "$YOUTUBE_TOKEN_ENVIKIDS" ]; then
            READY=true
          fi
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          if [ "$READY" = "true" ]; then
            echo "Token de YouTube disponible para $CHANNEL."
          else
            echo "Token de YouTube ausente para $CHANNEL: se generara sin publicar."
          fi

      - uses: actions/setup-python@v5
        if: steps.readiness.outputs.ready == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install base media dependencies
        if: steps.readiness.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 fonts-dejavu-core git
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install and verify Chatterbox Multilingual V3
        if: steps.readiness.outputs.ready == 'true' && env.CONTENT_MODE == 'voice'
        run: |
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-chatterbox.txt
          python - <<'PY'
          import torch
          import torchaudio as ta
          from pathlib import Path
          from chatterbox.mtl_tts import ChatterboxMultilingualTTS
          model = ChatterboxMultilingualTTS.from_pretrained(device='cpu', t3_model='v3')
          wav = model.generate('Hola. Hoy vamos a descubrir algo interesante de forma clara y natural.', language_id='es')
          out = Path('/tmp/chatterbox_v3_spanish_test.wav')
          ta.save(str(out), wav.cpu(), model.sr)
          if not out.exists() or out.stat().st_size < 5000:
              raise RuntimeError('Chatterbox V3 no produjo audio valido.')
          print('Chatterbox Multilingual V3 Spanish OK - CPU - bytes:', out.stat().st_size)
          PY

      - name: Generate Short and optionally upload
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ steps.upload.outputs.ready }}" != "true" ]; then
            EXTRA="--dry-run"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA="--dry-run"
          fi
          python -m app.pipeline --channel "$CHANNEL" --content-mode "$CONTENT_MODE" $EXTRA

      - name: Persist anti-duplicate history
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "youtube-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          NEW_RECORD="$(tail -n 1 state/history.jsonl)"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p state
            touch state/history.jsonl
            if ! grep -Fqx "$NEW_RECORD" state/history.jsonl; then
              printf '%s\n' "$NEW_RECORD" >> state/history.jsonl
            fi
            git add state/history.jsonl
            if git diff --cached --quiet; then
              echo "El registro ya existe en el historial."
              exit 0
            fi
            git commit -m "chore: update Shorts history"
            if git push origin HEAD:main; then
              echo "Historial guardado correctamente."
              exit 0
            fi
          done
          echo "No se pudo guardar el historial tras 5 intentos." >&2
          exit 1

      - name: Upload generated artifact for inspection
        if: steps.readiness.outputs.ready == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ env.CHANNEL }}-${{ env.CONTENT_MODE }}-${{ github.run_id }}
          path: output/
          retention-days: 3

      - name: Open issue on pipeline failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Automation failure: $CHANNEL" --body "El workflow de Shorts fallo. Revisar Actions run $GITHUB_RUN_ID."
