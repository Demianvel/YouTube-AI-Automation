name: Dios Habla Hoy IA - 10 Shorts diarios

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Canal bloqueado
        required: true
        default: dioshablahoyia
        type: choice
        options:
          - dioshablahoyia
      content_mode:
        description: Formato bloqueado
        required: true
        default: voice
        type: choice
        options:
          - voice
      dry_run:
        description: Generar sin subir a YouTube
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "triggers/dioshablahoyia-short-now.txt"
  schedule:
    - cron: "30 10,13,16,19,22 * * *"
    - cron: "0 0,12,15,18,21 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: dioshablahoyia-short-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      TZ: America/Argentina/Buenos_Aires
      CHANNEL: dioshablahoyia
      CONTENT_MODE: voice
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.6-flash
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Algenib
      GEMINI_TTS_MAX_ATTEMPTS: "4"
      SPIRITUAL_MALE_GEMINI_VOICE: Algenib
      SPIRITUAL_VOICE_PROFILE: voz_de_luz_serena_original_v1
      SPIRITUAL_VOICE_BRAND: Voz de Luz
      SPIRITUAL_VOICE_REFERENCE_MODE: fixed_original_identity_no_speaker_clone
      SPIRITUAL_VOICE_LOCKED: "true"
      SPIRITUAL_VOICEOVER_MODE: "true"
      SPIRITUAL_LIPSYNC_ENABLED: "false"
      SPIRITUAL_REQUIRE_PRIMARY_VOICE: "true"
      SPIRITUAL_SHORT_SECONDS: "60"
      SPIRITUAL_SHORT_SCENE_SECONDS: "10"
      SPIRITUAL_SHORT_AI_CLIPS: "0"
      SPIRITUAL_ALLOW_STILL_FALLBACK: "true"
      SPIRITUAL_FAST_RENDER: "true"
      SPIRITUAL_VISUAL_VARIETY_LEVEL: maximum
      SPIRITUAL_EDITORIAL_VARIETY_LEVEL: high
      SPIRITUAL_CTA_OVERLAY: "false"
      SPIRITUAL_REQUIRE_FRESH_VISUAL: "true"
      SPIRITUAL_VISUAL_PHASH_MAX_DISTANCE: "7"
      SPIRITUAL_VISUAL_REFERENCE_LOCKED: "true"
      SPIRITUAL_VISUAL_REFERENCE_PROFILE: realistic_jesus_reference_abc_v1
      SPIRITUAL_ALLOW_SYMBOLIC_JESUS_FALLBACK: "false"
      SPIRITUAL_ALLOW_LOCAL_PROCEDURAL_VISUAL: "false"
      TTS_PROVIDER: gemini_tts
      TTS_FALLBACK_KOKORO: "false"
      GEMINI_VIDEO_ENABLED: "false"
      HF_VIDEO_ENABLED: "false"
      HF_REQUIRE_TEXT_TO_VIDEO: "false"
      HF_VIDEO_STRICT: "false"
      HF_REFERENCE_IMAGE_ENABLED: "true"
      HF_REFERENCE_EDITOR_ENABLED: "true"
      HF_REFERENCE_ZERO_SPACE: black-forest-labs/FLUX.1-Kontext-Dev
      HF_TEXT_ZERO_ENABLED: "true"
      HF_TEXT_ZERO_SPACE: black-forest-labs/FLUX.1-schnell
      HF_REFERENCE_ZERO_SPACE_FIRST: "true"
      HF_ZERO_AUTH_RETRY: "true"
      HF_REMOTE_CIRCUIT_BREAKER: "true"
      HF_INFERENCE_PROVIDER_ENABLED: "false"
      HF_ZERO_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_TOKEN: ""
      SPIRITUAL_REFERENCE_AVOID_RECENT: "100"
      DIOS_FAST_LOCAL_VISUAL_MODE: "false"
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      MUSIC_PROVIDER: local
      YOUTUBE_TOKEN_DIOSHABLAHOYIA: ${{ secrets.YOUTUBE_TOKEN_DIOSHABLAHOYIA }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_GRAPH_API_VERSION: v25.0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enforce exactly 10 uploaded Shorts per Argentina day
        id: daily_cap
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          target = 10
          zone = ZoneInfo("America/Argentina/Buenos_Aires")
          today = datetime.now(zone).date()
          uploaded = 0
          history = Path("state/history.jsonl")
          if history.exists():
              for raw in history.read_text(encoding="utf-8").splitlines():
                  try:
                      row = json.loads(raw)
                  except Exception:
                      continue
                  if row.get("channel") != "dioshablahoyia" or row.get("status") != "uploaded":
                      continue
                  stamp = str(row.get("created_at") or "").strip()
                  if not stamp:
                      continue
                  try:
                      moment = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
                  except ValueError:
                      continue
                  if moment.tzinfo is None:
                      moment = moment.replace(tzinfo=timezone.utc)
                  if moment.astimezone(zone).date() == today:
                      uploaded += 1
          should_publish = uploaded < target
          print(f"Shorts subidos hoy en Argentina: {uploaded}/{target}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"count={uploaded}\n")
              handle.write(f"should_publish={'true' if should_publish else 'false'}\n")
          PY

      - name: Install strict Voz de Luz runtime
        if: steps.daily_cap.outputs.should_publish == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1 fonts-dejavu-core git >/dev/null
          python -m pip install -q --upgrade pip
          pip install -q \
            "google-genai>=2.3.0" \
            "google-api-python-client>=2.170.0" \
            "google-auth>=2.40.0" \
            "google-auth-oauthlib>=1.2.2" \
            "Pillow>=11.0.0" \
            "requests>=2.32.0" \
            "numpy<3,>=1.26" \
            "soundfile>=0.13.1" \
            "huggingface_hub<2,>=0.34.4" \
            "gradio_client<3,>=1.11.0"

      - name: Verify immutable voice and historical realistic reference bank
        if: steps.daily_cap.outputs.should_publish == 'true'
        run: |
          test -n "$GEMINI_API_KEY"
          test -n "$YOUTUBE_TOKEN_DIOSHABLAHOYIA"
          test "$GEMINI_TTS_VOICE" = "Algenib"
          test "$SPIRITUAL_MALE_GEMINI_VOICE" = "Algenib"
          test "$SPIRITUAL_VOICE_BRAND" = "Voz de Luz"
          test "$SPIRITUAL_VOICE_PROFILE" = "voz_de_luz_serena_original_v1"
          test "$SPIRITUAL_REQUIRE_PRIMARY_VOICE" = "true"
          test "$SPIRITUAL_VOICE_LOCKED" = "true"
          test "$TTS_PROVIDER" = "gemini_tts"
          test "$TTS_FALLBACK_KOKORO" = "false"
          test "$SPIRITUAL_VISUAL_REFERENCE_LOCKED" = "true"
          test "$SPIRITUAL_ALLOW_SYMBOLIC_JESUS_FALLBACK" = "false"
          test "$SPIRITUAL_ALLOW_LOCAL_PROCEDURAL_VISUAL" = "false"
          for ref in \
            assets/dioshablahoyia/reference/jesus_reference_a.jpg \
            assets/dioshablahoyia/reference/jesus_reference_b.jpg \
            assets/dioshablahoyia/reference/jesus_reference_c.jpg; do
            test -s "$ref"
          done
          python -m py_compile \
            scripts/publish_dios_locked.py \
            scripts/publish_dios_fast.py \
            app/spiritual_tts.py \
            app/spiritual_audio.py \
            app/spiritual_reference_generation.py \
            app/pipeline.py \
            app/dios_visual_integrity.py

      - name: Generate fresh Short with permanent Voz de Luz and realistic reference identity
        if: steps.daily_cap.outputs.should_publish == 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "El dry-run generico no publica; la identidad bloqueada se valida por compilacion y guardas."
            python -m app.pipeline --channel dioshablahoyia --content-mode voice --dry-run
          else
            python scripts/publish_dios_locked.py
          fi

      - name: Verify produced identity before persistence
        if: success() && steps.daily_cap.outputs.should_publish == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('state/history.jsonl').read_text(encoding='utf-8').splitlines()[-1])
          used = str(row.get('tts_provider_used') or '').lower()
          profile = row.get('voice_profile')
          providers = row.get('generated_visual_provider') or []
          if isinstance(providers, str):
              providers = [providers]
          if 'gemini' not in used or ':algenib:' not in used or 'fallback' in used or 'kokoro' in used:
              raise SystemExit(f'BLOQUEADO: voz publicada inesperada: {used}')
          if profile != 'voz_de_luz_serena_original_v1':
              raise SystemExit(f'BLOQUEADO: perfil de voz inesperado: {profile}')
          if not providers or any('dios-realistic-reference-lock-v1' not in str(item) for item in providers):
              raise SystemExit(f'BLOQUEADO: visual fuera de la identidad realista bloqueada: {providers}')
          print('IDENTITY_OK: Voz de Luz / Algenib + realistic Jesus reference bank')
          PY

      - name: Persist anti-duplicate history
        if: success() && steps.daily_cap.outputs.should_publish == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
        shell: bash
        run: |
          LAST_RECORD="$(tail -n 1 state/history.jsonl)"
          test -n "$LAST_RECORD"
          mkdir -p /tmp/dios-short-history
          printf '%s\n' "$LAST_RECORD" > /tmp/dios-short-history/last.jsonl
          git config user.name "youtube-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p state
            touch state/history.jsonl
            RECORD="$(cat /tmp/dios-short-history/last.jsonl)"
            VIDEO_ID="$(printf '%s' "$RECORD" | python -c 'import json,sys; print(json.load(sys.stdin).get("video_id", ""))' 2>/dev/null || true)"
            if [ -n "$VIDEO_ID" ] && grep -Fq "\"video_id\": \"$VIDEO_ID\"" state/history.jsonl; then
              exit 0
            fi
            printf '%s\n' "$RECORD" >> state/history.jsonl
            git add state/history.jsonl
            git commit -m "chore: update Dios Shorts history"
            git push origin HEAD:main && exit 0
          done
          exit 1

      - name: Upload generated artifact
        if: always() && steps.daily_cap.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dioshablahoyia-short-${{ github.run_id }}
          path: output/
          retention-days: 2
          if-no-files-found: warn

      - name: Open issue on strict publishing failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Dios Habla Hoy - fallo identidad permanente" --body "Se bloqueo la publicacion antes de aceptar una voz distinta de Voz de Luz / Algenib o un visual fuera del banco realista de referencias. Revisar Actions run $GITHUB_RUN_ID."
