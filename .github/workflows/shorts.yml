name: Generate and publish Shorts

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Canal a ejecutar
        required: true
        type: choice
        options:
          - brotavida
          - dineroclaro
      dry_run:
        description: Generar sin subir a YouTube
        required: true
        default: true
        type: boolean
  schedule:
    # Fallback interno de GitHub. Si Repository variable N8N_PRIMARY=true,
    # estos schedules se omiten y n8n pasa a ser el programador principal.
    # Argentina UTC-3. BrotaVida: 00,06,12,18. DineroClaro: 08,13,17,21.
    - cron: "0 3,9,15,21 * * *"
    - cron: "0 0,11,16,20 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: youtube-ai-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'schedule' || vars.N8N_PRIMARY != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.6-flash
      VIDEO_PROVIDER: procedural
      YOUTUBE_TOKEN_BROTAVIDA: ${{ secrets.YOUTUBE_TOKEN_BROTAVIDA }}
      YOUTUBE_TOKEN_DINEROCLARO: ${{ secrets.YOUTUBE_TOKEN_DINEROCLARO }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select channel
        id: select
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ inputs.channel }}"
          elif [ "${{ github.event.schedule }}" = "0 3,9,15,21 * * *" ]; then
            CHANNEL="brotavida"
          elif [ "${{ github.event.schedule }}" = "0 0,11,16,20 * * *" ]; then
            CHANNEL="dineroclaro"
          else
            CHANNEL=""
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"

      - name: Check credentials
        id: readiness
        if: env.CHANNEL != ''
        shell: bash
        run: |
          if python scripts/check_ready.py; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Credenciales incompletas: no se genera ni se publica contenido."
          fi

      - uses: actions/setup-python@v5
        if: steps.readiness.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install renderer and Python dependencies
        if: steps.readiness.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and upload
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA="--dry-run"
          fi
          python -m app.pipeline --channel "$CHANNEL" $EXTRA

      - name: Persist anti-duplicate history
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "youtube-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/history.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Shorts history"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload generated artifact for inspection
        if: steps.readiness.outputs.ready == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ env.CHANNEL }}-${{ github.run_id }}
          path: output/
          retention-days: 3

      - name: Open issue on pipeline failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Automation failure: $CHANNEL" --body "El workflow de Shorts fallo. Revisar Actions run $GITHUB_RUN_ID."
