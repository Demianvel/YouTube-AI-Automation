name: Clinix MX Windows and Billing build
on:
  workflow_dispatch:
  push:
    paths:
      - 'clinix-mx/**'
      - 'clinix-mx-billing/**'
      - '.github/workflows/clinix-build.yml'

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore desktop
        run: dotnet restore clinix-mx/ClinixMX.csproj
      - name: Build desktop
        run: dotnet build clinix-mx/ClinixMX.csproj -c Release --no-restore
      - name: Publish EXE
        run: dotnet publish clinix-mx/ClinixMX.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o clinix-mx/publish
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClinixMX-win-x64
          path: clinix-mx/publish/ClinixMX.exe
          if-no-files-found: error

  billing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore billing
        run: dotnet restore clinix-mx-billing/ClinixMX.Billing.csproj
      - name: Build billing
        run: dotnet build clinix-mx-billing/ClinixMX.Billing.csproj -c Release --no-restore
      - name: Publish billing
        run: dotnet publish clinix-mx-billing/ClinixMX.Billing.csproj -c Release --no-restore -o clinix-mx-billing/publish
      - name: Upload billing artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClinixMX-Billing
          path: clinix-mx-billing/publish/**
          if-no-files-found: error
