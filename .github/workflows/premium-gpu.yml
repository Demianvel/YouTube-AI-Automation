name: Premium GPU - LTX2 and ACE-Step

on:
  workflow_dispatch:
    inputs:
      target:
        description: Pipeline premium a ejecutar
        required: true
        type: choice
        options:
          - envikids_short
          - demianvelo
      minutes:
        description: DemianVelo duracion (ignorado para EnViKids short)
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "5"
          - "10"
          - "30"
      style:
        description: DemianVelo estilo (rkt, trap_melodic, pop_electronic, etc.)
        required: false
        default: ""
        type: string
      lyrics:
        description: Letra propia de DemianVelo para ACE-Step
        required: false
        default: ""
        type: string
      publish:
        description: Publicar en YouTube
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: premium-gpu-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  premium:
    # Deliberadamente NO usa ubuntu-latest. Debe existir un runner propio/contratado con estos labels.
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 720
    env:
      PYTHONPATH: .
      AI_MODELS_ROOT: ${{ vars.AI_MODELS_ROOT || format('{0}/ai-models', github.workspace) }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.6-flash
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      YOUTUBE_TOKEN_ENVIKIDS: ${{ secrets.YOUTUBE_TOKEN_ENVIKIDS }}
      YOUTUBE_TOKEN_DEMIANVELO: ${{ secrets.YOUTUBE_TOKEN_DEMIANVELO }}
      TTS_PROVIDER: chatterbox_latam
      TTS_FALLBACK_KOKORO: "true"
      CHATTERBOX_EXAGGERATION: "0.66"
      CHATTERBOX_CFG_WEIGHT: "0.34"
      LTX2_ENABLED: "true"
      LTX2_OFFLOAD: cpu
      LTX2_ENHANCE_PROMPT: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Verify NVIDIA GPU
        run: nvidia-smi

      - name: Prepare premium models when missing
        shell: bash
        run: |
          ROOT="$AI_MODELS_ROOT"
          if [ ! -f "$ROOT/models/ltx-2.3/ltx-2.3-22b-distilled-1.1.safetensors" ] || [ ! -d "$ROOT/ACE-Step-1.5" ]; then
            bash scripts/setup_premium_gpu.sh
          fi

      - name: Export model paths
        shell: bash
        run: |
          ROOT="$AI_MODELS_ROOT"
          echo "LTX2_REPO_ROOT=$ROOT/LTX-2" >> "$GITHUB_ENV"
          echo "LTX2_CHECKPOINT=$ROOT/models/ltx-2.3/ltx-2.3-22b-distilled-1.1.safetensors" >> "$GITHUB_ENV"
          echo "LTX2_SPATIAL_UPSAMPLER=$ROOT/models/ltx-2.3/ltx-2.3-spatial-upscaler-x2-1.1.safetensors" >> "$GITHUB_ENV"
          echo "LTX2_GEMMA_ROOT=$ROOT/models/gemma-3-12b" >> "$GITHUB_ENV"

      - name: Install automation dependencies
        run: |
          python3 -m pip install -U pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install -r requirements-chatterbox.txt

      - name: Start ACE-Step API for DemianVelo lyrics
        if: inputs.target == 'demianvelo' && inputs.lyrics != ''
        shell: bash
        run: |
          cd "$AI_MODELS_ROOT/ACE-Step-1.5"
          nohup uv run acestep-api --host 127.0.0.1 --port 8001 > /tmp/acestep.log 2>&1 &
          echo $! > /tmp/acestep.pid
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8001/health >/dev/null 2>&1; then
              echo "ACESTEP_API_URL=http://127.0.0.1:8001" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 5
          done
          cat /tmp/acestep.log || true
          echo "ACE-Step API no inicio correctamente" >&2
          exit 1

      - name: Run EnViKidsAI premium 4K Short
        if: inputs.target == 'envikids_short'
        shell: bash
        env:
          CHANNEL: envikids
          VIDEO_PROVIDER: real_stock
          TTS_PROVIDER: kokoro
          KOKORO_VOICE: ef_dora
          KOKORO_SPEED: "1.03"
        run: |
          ARGS=(--channel envikids --content-mode voice)
          if [ "${{ inputs.publish }}" != "true" ]; then ARGS+=(--dry-run); fi
          python3 -m app.pipeline "${ARGS[@]}"

      - name: Run DemianVelo premium music video
        if: inputs.target == 'demianvelo'
        shell: bash
        env:
          DEMIANVELO_LYRICS: ${{ inputs.lyrics }}
          DEMIANVELO_VOCAL_CHARACTER: "voz original calida, magnetica, emocional, moderna y con presencia; no imitar cantantes reales"
          DEMIANVELO_VISUAL_ENGINE: auto
        run: |
          ENGINE=local
          if [ -n "$DEMIANVELO_LYRICS" ]; then ENGINE=acestep; fi
          ARGS=(--minutes "${{ inputs.minutes }}" --music-engine "$ENGINE")
          if [ -n "${{ inputs.style }}" ]; then ARGS+=(--style "${{ inputs.style }}"); fi
          if [ "${{ inputs.publish }}" = "true" ]; then ARGS+=(--publish); fi
          python3 -m app.music_pipeline "${ARGS[@]}"

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-${{ inputs.target }}-${{ github.run_id }}
          path: output/
          retention-days: 3
