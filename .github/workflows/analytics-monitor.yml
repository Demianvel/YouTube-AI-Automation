name: Monitor Dios Habla Hoy YouTube Analytics

on:
  workflow_dispatch:
  schedule:
    # External Analytics refresh is allowed only in the two weekend windows.
    # Saturday 09:00 Argentina (UTC-3) = Saturday 12:00 UTC.
    - cron: "0 12 * * 6"
    # Sunday 21:00 Argentina (UTC-3) = Monday 00:00 UTC.
    - cron: "0 0 * * 1"

permissions:
  contents: read

concurrency:
  group: dioshablahoyia-analytics-monitor
  cancel-in-progress: true

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      TZ: America/Argentina/Buenos_Aires
      YOUTUBE_TOKEN_DIOSHABLAHOYIA: ${{ secrets.YOUTUBE_TOKEN_DIOSHABLAHOYIA }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: pip install -q google-api-python-client google-auth

      - name: Verify Dios Habla Hoy OAuth
        run: test -n "$YOUTUBE_TOKEN_DIOSHABLAHOYIA"

      - name: Collect 90-day Dios Habla Hoy analytics
        run: |
          mkdir -p analytics-output
          python scripts/analytics_snapshot.py --channel dioshablahoyia --days 90 --out analytics-output/dioshablahoyia.json

      - name: Upload analytics snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-dioshablahoyia-${{ github.run_id }}
          path: analytics-output/dioshablahoyia.json
          if-no-files-found: warn
          retention-days: 7
