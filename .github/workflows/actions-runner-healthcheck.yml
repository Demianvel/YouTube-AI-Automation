name: Actions Runner Healthcheck

on:
  push:
    branches: [main]
    paths:
      - "triggers/actions-runner-healthcheck.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm GitHub-hosted runner starts
        run: |
          echo "RUNNER_OK"
          uname -a
