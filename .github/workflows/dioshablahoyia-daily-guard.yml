name: Dios Habla Hoy IA - Guardia diaria 10 Shorts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "triggers/dioshablahoyia-daily-guard-now.txt"

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: dioshablahoyia-short-publisher
  cancel-in-progress: true

env:
  TZ: America/Argentina/Buenos_Aires

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Count real Shorts for the current Argentina day
        id: count
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          zone = ZoneInfo("America/Argentina/Buenos_Aires")
          today = datetime.now(zone).date()
          ids = set()
          path = Path("state/history.jsonl")
          if path.exists():
              for raw in path.read_text(encoding="utf-8").splitlines():
                  try:
                      row = json.loads(raw)
                      dt = datetime.fromisoformat(str(row.get("created_at") or "").replace("Z", "+00:00"))
                      if dt.tzinfo is None:
                          dt = dt.replace(tzinfo=timezone.utc)
                  except Exception:
                      continue
                  video_id = str(row.get("video_id") or "").strip()
                  if row.get("channel") == "dioshablahoyia" and video_id and dt.astimezone(zone).date() == today:
                      ids.add(video_id)
          count = len(ids)
          missing = max(0, 10 - count)
          print(f"CONFIRMED_SHORTS={count}/10 MISSING={missing}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"count={count}\nmissing={missing}\n")
          PY

      - name: Check canonical Algenib recovery
        if: steps.count.outputs.missing != '0'
        id: active
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE="$(gh run list -R "$GITHUB_REPOSITORY" --workflow dioshablahoyia-algenib-emergency.yml --limit 30 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length')"
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "CANONICAL_ALGENIB_ACTIVE=$ACTIVE"

      - name: Dispatch canonical recovery when Shorts are missing
        if: steps.count.outputs.missing != '0' && steps.active.outputs.active == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Faltan ${{ steps.count.outputs.missing }} Shorts. Se inicia el recuperador canónico Algenib/Qwen." 
          gh workflow run dioshablahoyia-algenib-emergency.yml -R "$GITHUB_REPOSITORY" --ref main

      - name: Daily target complete
        if: steps.count.outputs.missing == '0'
        run: echo "10/10 Shorts confirmados por video_id. No se publica nada más hoy."
