name: Dios Habla Hoy IA - Guardia diaria 10 Shorts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "triggers/dioshablahoyia-daily-guard-now.txt"
  schedule:
    # 22:10 y 23:20 America/Argentina/Buenos_Aires (GitHub cron usa UTC).
    - cron: "10 1 * * *"
    - cron: "20 2 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: dioshablahoyia-short-publisher
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: .
      TZ: America/Argentina/Buenos_Aires
      CHANNEL: dioshablahoyia
      CONTENT_MODE: voice
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.6-flash
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Algenib
      GEMINI_TTS_MAX_ATTEMPTS: "4"
      SPIRITUAL_MALE_GEMINI_VOICE: Algenib
      SPIRITUAL_VOICE_PROFILE: voz_de_luz_serena_original_v1
      SPIRITUAL_VOICE_BRAND: Voz de Luz
      SPIRITUAL_VOICE_REFERENCE_MODE: fixed_original_identity_no_speaker_clone
      SPIRITUAL_VOICE_LOCKED: "true"
      SPIRITUAL_VOICEOVER_MODE: "true"
      SPIRITUAL_LIPSYNC_ENABLED: "false"
      SPIRITUAL_REQUIRE_PRIMARY_VOICE: "true"
      SPIRITUAL_SHORT_SECONDS: "60"
      SPIRITUAL_SHORT_SCENE_SECONDS: "10"
      SPIRITUAL_SHORT_AI_CLIPS: "0"
      SPIRITUAL_ALLOW_STILL_FALLBACK: "true"
      SPIRITUAL_FAST_RENDER: "true"
      SPIRITUAL_VISUAL_VARIETY_LEVEL: maximum
      SPIRITUAL_EDITORIAL_VARIETY_LEVEL: high
      SPIRITUAL_CTA_OVERLAY: "false"
      SPIRITUAL_REQUIRE_FRESH_VISUAL: "true"
      TTS_PROVIDER: gemini_tts
      TTS_FALLBACK_KOKORO: "false"
      GEMINI_VIDEO_ENABLED: "false"
      HF_VIDEO_ENABLED: "false"
      HF_REQUIRE_TEXT_TO_VIDEO: "false"
      HF_VIDEO_STRICT: "false"
      HF_REFERENCE_IMAGE_ENABLED: "true"
      HF_REFERENCE_EDITOR_ENABLED: "true"
      HF_REFERENCE_ZERO_SPACE: black-forest-labs/FLUX.1-Kontext-Dev
      HF_TEXT_ZERO_ENABLED: "true"
      HF_TEXT_ZERO_SPACE: black-forest-labs/FLUX.1-schnell
      HF_REFERENCE_ZERO_SPACE_FIRST: "true"
      HF_ZERO_AUTH_RETRY: "true"
      HF_REMOTE_CIRCUIT_BREAKER: "true"
      HF_INFERENCE_PROVIDER_ENABLED: "false"
      HF_ZERO_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_TOKEN: ""
      SPIRITUAL_REFERENCE_AVOID_RECENT: "100"
      DIOS_FAST_LOCAL_VISUAL_MODE: "false"
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      MUSIC_PROVIDER: local
      YOUTUBE_TOKEN_DIOSHABLAHOYIA: ${{ secrets.YOUTUBE_TOKEN_DIOSHABLAHOYIA }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install strict recovery runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1 fonts-dejavu-core git >/dev/null
          python -m pip install -q --upgrade pip
          pip install -q \
            "google-genai>=2.3.0" \
            "google-api-python-client>=2.170.0" \
            "google-auth>=2.40.0" \
            "google-auth-oauthlib>=1.2.2" \
            "Pillow>=11.0.0" \
            "requests>=2.32.0" \
            "numpy<3,>=1.26" \
            "soundfile>=0.13.1" \
            "huggingface_hub<2,>=0.34.4" \
            "gradio_client<3,>=1.11.0"

      - name: Verify permanent voice and realistic references
        run: |
          test -n "$GEMINI_API_KEY"
          test -n "$YOUTUBE_TOKEN_DIOSHABLAHOYIA"
          test "$GEMINI_TTS_VOICE" = "Algenib"
          test "$SPIRITUAL_MALE_GEMINI_VOICE" = "Algenib"
          test "$SPIRITUAL_REQUIRE_PRIMARY_VOICE" = "true"
          test "$SPIRITUAL_VOICE_LOCKED" = "true"
          test "$TTS_PROVIDER" = "gemini_tts"
          test "$TTS_FALLBACK_KOKORO" = "false"
          python - <<'PY'
          from pathlib import Path
          refs = sorted(Path('assets/dioshablahoyia/reference').glob('jesus_reference_*.jpg'))
          if not refs:
              raise SystemExit('BLOQUEADO: falta el banco de referencias realistas de Jesus')
          print('Referencias realistas de Jesus disponibles:', len(refs))
          PY
          python -m py_compile scripts/dioshablahoyia_catchup_shorts.py scripts/publish_dios_fast.py app/spiritual_tts.py app/spiritual_audio.py app/pipeline.py

      - name: Complete only missing Shorts with permanent Voz de Luz
        run: python scripts/dioshablahoyia_catchup_shorts.py

      - name: Persist guard recovery records
        if: success()
        shell: bash
        run: |
          RECORDS="/tmp/dios-catchup/new-short-records.jsonl"
          test -f "$RECORDS" || exit 0
          test -s "$RECORDS" || exit 0
          cp "$RECORDS" /tmp/dios-guard-records-copy.jsonl
          git config user.name "youtube-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p state
            touch state/history.jsonl
            while IFS= read -r record; do
              test -n "$record" || continue
              VIDEO_ID="$(printf '%s' "$record" | python -c 'import json,sys; print(json.load(sys.stdin).get("video_id", ""))' 2>/dev/null || true)"
              if [ -n "$VIDEO_ID" ] && grep -Fq "\"video_id\": \"$VIDEO_ID\"" state/history.jsonl; then
                continue
              fi
              printf '%s\n' "$record" >> state/history.jsonl
            done < /tmp/dios-guard-records-copy.jsonl
            git add state/history.jsonl
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore: persist strict daily Dios recovery"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dioshablahoyia-daily-guard-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 2

      - name: Open issue if strict daily target remains missing
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Dios Habla Hoy - guardia estricta no llego a 10 Shorts" \
            --body "La guardia se nego a cambiar Voz de Luz / Algenib. Revisar Actions run $GITHUB_RUN_ID."
