name: Render and publish Aqui Estas x DemianVelo

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar en @DemianVelo al finalizar
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - scripts/render_aqui_estas_demianvelo.py
      - .github/workflows/render-aqui-estas-demianvelo.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: render-aqui-estas-demianvelo
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONPATH: .
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_TOKEN_DEMIANVELO: ${{ secrets.YOUTUBE_TOKEN_DEMIANVELO }}
    steps:
      - uses: actions/checkout@v4

      - name: Recover Aleluya vocal reference from successful FREE render
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: aleluya-v4-music
          path: reference_aleluya
          repository: Demianvel/YouTube-AI-Automation
          run-id: 31659166745
          github-token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FREE production dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation2
          python -m pip install --upgrade pip
          pip install requests gradio_client google-api-python-client google-auth pillow

      - name: Verify DemianVelo OAuth is present before expensive generation
        shell: bash
        run: |
          if [ -z "$YOUTUBE_TOKEN_DEMIANVELO" ]; then
            echo "Falta YOUTUBE_TOKEN_DEMIANVELO; se cancela antes de generar." >&2
            exit 1
          fi

      - name: Render original song, premium cinematic video and thumbnail
        shell: bash
        run: |
          PUBLISH=true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" != "true" ]; then
            PUBLISH=false
          fi
          ARGS=()
          if [ "$PUBLISH" = "true" ]; then ARGS+=(--publish); fi
          python scripts/render_aqui_estas_demianvelo.py "${ARGS[@]}"

      - name: Upload production artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demianvelo-aqui-estas-${{ github.run_id }}
          path: output/aqui_estas_demianvelo/
          if-no-files-found: warn
          retention-days: 5
