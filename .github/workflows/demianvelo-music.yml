name: DemianVelo original music

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Duracion del video
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "5"
          - "10"
          - "30"
      style:
        description: Estilo musical (vacio = auto por Analytics)
        required: false
        default: ""
        type: string
      lyrics:
        description: Letra del artista; se respeta literalmente cuando ACE-Step esta activo
        required: false
        default: ""
        type: string
      vocal_character:
        description: Caracter vocal original, sin imitar cantantes reales
        required: false
        default: "voz calida, magnetica, emocional, clara y con presencia"
        type: string
      music_engine:
        description: Motor musical
        required: true
        default: auto
        type: choice
        options:
          - auto
          - local
          - acestep
      publish:
        description: Publicar en YouTube si OAuth esta conectado
        required: true
        default: false
        type: boolean
  schedule:
    # Argentina UTC-3: Short musical 12:30; video largo 20:30.
    - cron: "30 15 * * *"
    - cron: "30 23 * * *"

permissions:
  contents: read

concurrency:
  group: demianvelo-music-${{ github.event_name == 'workflow_dispatch' && inputs.minutes || github.event.schedule }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: .
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.6-flash
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_TOKEN_DEMIANVELO: ${{ secrets.YOUTUBE_TOKEN_DEMIANVELO }}
      ACESTEP_API_URL: ${{ secrets.ACESTEP_API_URL }}
      ACESTEP_API_KEY: ${{ secrets.ACESTEP_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Select duration and publish mode
        id: select
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MINUTES="${{ inputs.minutes }}"
            WANT_PUBLISH="${{ inputs.publish }}"
            STYLE="${{ inputs.style }}"
            ENGINE="${{ inputs.music_engine }}"
          elif [ "${{ github.event.schedule }}" = "30 15 * * *" ]; then
            MINUTES="1"
            WANT_PUBLISH="true"
            STYLE=""
            ENGINE="auto"
          else
            DAY="$(date -u +%j)"
            SLOT=$((10#$DAY % 3))
            if [ "$SLOT" -eq 0 ]; then MINUTES="5"; fi
            if [ "$SLOT" -eq 1 ]; then MINUTES="10"; fi
            if [ "$SLOT" -eq 2 ]; then MINUTES="30"; fi
            WANT_PUBLISH="true"
            STYLE=""
            ENGINE="auto"
          fi

          PUBLISH=false
          SHOULD_RUN=true
          if [ "$WANT_PUBLISH" = "true" ] && [ -n "$YOUTUBE_TOKEN_DEMIANVELO" ]; then
            PUBLISH=true
          elif [ "${{ github.event_name }}" = "schedule" ] && [ -z "$YOUTUBE_TOKEN_DEMIANVELO" ]; then
            SHOULD_RUN=false
            echo "OAuth DemianVelo ausente: se omite la generacion programada."
          fi
          echo "minutes=$MINUTES" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "style=$STYLE" >> "$GITHUB_OUTPUT"
          echo "engine=$ENGINE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.select.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install media and Python dependencies
        if: steps.select.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate original track and cinematic video
        if: steps.select.outputs.run == 'true'
        shell: bash
        env:
          DEMIANVELO_LYRICS: ${{ github.event_name == 'workflow_dispatch' && inputs.lyrics || '' }}
          DEMIANVELO_VOCAL_CHARACTER: ${{ github.event_name == 'workflow_dispatch' && inputs.vocal_character || '' }}
          DEMIANVELO_STYLE: ${{ steps.select.outputs.style }}
          DEMIANVELO_ENGINE: ${{ steps.select.outputs.engine }}
          DEMIANVELO_MINUTES: ${{ steps.select.outputs.minutes }}
          DEMIANVELO_PUBLISH: ${{ steps.select.outputs.publish }}
        run: |
          ARGS=(--minutes "$DEMIANVELO_MINUTES" --music-engine "$DEMIANVELO_ENGINE")
          if [ -n "$DEMIANVELO_STYLE" ]; then ARGS+=(--style "$DEMIANVELO_STYLE"); fi
          if [ "$DEMIANVELO_PUBLISH" = "true" ]; then ARGS+=(--publish); fi
          python -m app.music_pipeline "${ARGS[@]}"

      - name: Upload dry-run artifact
        if: steps.select.outputs.run == 'true' && steps.select.outputs.publish != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: demianvelo-${{ steps.select.outputs.minutes }}min-${{ github.run_id }}
          path: output/demianvelo/
          retention-days: 2
