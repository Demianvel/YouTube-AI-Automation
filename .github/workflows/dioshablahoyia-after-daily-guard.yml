name: Dios Habla Hoy IA - Completar premium tras guardia

on:
  workflow_run:
    workflows:
      - "Dios Habla Hoy IA - Guardia diaria 10 Shorts"
    types: [completed]

permissions:
  contents: write
  issues: write
  actions: write

env:
  TZ: America/Argentina/Buenos_Aires

jobs:
  complete_missing:
    # Never launch a second recovery while the canonical publisher is already active.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh latest state
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Count real Shorts for current Argentina day
        id: count
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          zone = ZoneInfo("America/Argentina/Buenos_Aires")
          today = datetime.now(zone).date()
          ids = set()
          path = Path("state/history.jsonl")
          if path.exists():
              for raw in path.read_text(encoding="utf-8").splitlines():
                  try:
                      row = json.loads(raw)
                      dt = datetime.fromisoformat(str(row.get("created_at") or "").replace("Z", "+00:00"))
                      if dt.tzinfo is None:
                          dt = dt.replace(tzinfo=timezone.utc)
                  except Exception:
                      continue
                  video_id = str(row.get("video_id") or "").strip()
                  if row.get("channel") == "dioshablahoyia" and video_id and dt.astimezone(zone).date() == today:
                      ids.add(video_id)
          count = len(ids)
          missing = max(0, 10 - count)
          print(f"CONFIRMED_SHORTS={count}/10 MISSING={missing}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"count={count}\nmissing={missing}\n")
          PY

      - name: Check canonical premium publisher is not already active
        if: steps.count.outputs.missing != '0'
        id: active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ACTIVE="$(gh run list -R "$GITHUB_REPOSITORY" --workflow dioshablahoyia-algenib-emergency.yml --limit 30 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting")] | length')"
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "CANONICAL_ACTIVE=$ACTIVE"

      - name: Trigger canonical premium completion only when needed
        if: steps.count.outputs.missing != '0' && steps.active.outputs.active == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run dioshablahoyia-algenib-emergency.yml -R "$GITHUB_REPOSITORY" --ref main

      - name: Report target already complete
        if: steps.count.outputs.missing == '0'
        run: echo "10/10 real Shorts already confirmed; no duplicate publishing."
