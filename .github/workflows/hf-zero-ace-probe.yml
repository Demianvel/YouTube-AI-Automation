name: Probe ACE-Step ZeroGPU generation API

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hf-zero-ace-probe.yml
      - triggers/hf-zero-ace-probe.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -U gradio_client
      - name: Print only useful ACE-Step endpoints
        run: |
          python - <<'PY'
          from gradio_client import Client
          import json

          c = Client('ACE-Step/Ace-Step-v1.5', verbose=False)
          api = c.view_api(return_format='dict')
          named = api.get('named_endpoints', api)
          for name, spec in named.items():
              low = name.lower()
              blob = json.dumps(spec, ensure_ascii=False).lower()
              if any(k in low or k in blob for k in ['generate', 'audio', 'music', 'song', 'task']):
                  print('\nENDPOINT', name)
                  params = spec.get('parameters', []) if isinstance(spec, dict) else []
                  for i, p in enumerate(params, 1):
                      print(' PARAM', i, p.get('parameter_name'), '|', p.get('type'), '| default=', p.get('default'))
                  returns = spec.get('returns', []) if isinstance(spec, dict) else []
                  for i, r in enumerate(returns, 1):
                      print(' RETURN', i, r.get('type'), '| label=', r.get('label'))
          PY
