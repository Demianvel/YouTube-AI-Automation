name: Diag OAuth YouTube

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      YOUTUBE_TOKEN_DIOSHABLAHOYIA: ${{ secrets.YOUTUBE_TOKEN_DIOSHABLAHOYIA }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_KEY }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q google-api-python-client google-auth requests
      - name: Diagnose (sin imprimir secretos)
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, requests
          def ann(level, title, msg):
              msg = re.sub(r'[A-Za-z0-9_\-]{30,}', '<redacted>', str(msg))[:600].replace('\n', ' ')
              print(f'::{level} title={title}::{msg}', flush=True)
          ann('notice','secrets', 'YT=%s GEMINI=%s HF=%s OPENAI=%s' % tuple(bool(os.getenv(k)) for k in ['YOUTUBE_TOKEN_DIOSHABLAHOYIA','GEMINI_API_KEY','HF_TOKEN','OPENAI_API_KEY']))
          try:
              from google.oauth2.credentials import Credentials
              from google.auth.transport.requests import Request
              p = json.loads(os.environ['YOUTUBE_TOKEN_DIOSHABLAHOYIA'])
              ann('notice','yt-token-fields', 'keys=%s scopes=%s has_refresh=%s' % (sorted(k for k in p if k not in ('token','refresh_token','client_secret')), p.get('scopes'), bool(p.get('refresh_token'))))
              c = Credentials.from_authorized_user_info(p)
              c.refresh(Request())
              from googleapiclient.discovery import build
              yt = build('youtube','v3',credentials=c,cache_discovery=False)
              it = yt.channels().list(part='snippet',mine=True).execute().get('items') or []
              ann('notice','yt-ok', 'channel=%s' % [(i['snippet'].get('customUrl'), i['snippet'].get('title')) for i in it])
          except Exception as e:
              ann('error','yt-fail', f'{type(e).__name__}: {e}')
          try:
              r = requests.get('https://generativelanguage.googleapis.com/v1beta/models', params={'key': os.getenv('GEMINI_API_KEY','')}, timeout=20)
              ann('notice' if r.ok else 'error','gemini', f'status={r.status_code} ' + ('' if r.ok else r.text[:300]))
          except Exception as e:
              ann('error','gemini-fail', f'{type(e).__name__}: {e}')
          try:
              r = requests.get('https://huggingface.co/api/whoami-v2', headers={'Authorization': 'Bearer ' + os.getenv('HF_TOKEN','')}, timeout=20)
              ann('notice' if r.ok else 'error','hf', f'status={r.status_code}')
          except Exception as e:
              ann('error','hf-fail', f'{type(e).__name__}: {e}')
          PY
