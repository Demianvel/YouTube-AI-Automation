name: Dios Habla Hoy IA - OpenAI image probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "triggers/dioshablahoyia-openai-image-probe.txt"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_KEY || secrets.OPENAI_API_TOKEN || secrets.OPENAI_TOKEN || secrets.CHATGPT_API_KEY }}
      OPENAI_IMAGE_MODEL: gpt-image-2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install probe runtime
        run: |
          python -m pip install -q --upgrade pip
          pip install -q "requests>=2.32.0"
          python -m py_compile scripts/probe_openai_image_api.py

      - name: Verify OpenAI image key and model access
        run: python scripts/probe_openai_image_api.py --required
