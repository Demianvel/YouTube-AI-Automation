name: EnViKids 1-3 minute Shorts

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Duracion del Short
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      publish:
        description: Publicar si OAuth de EnViKids esta conectado
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: envikids-extended-shorts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: .
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.6-flash
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      POLLINATIONS_IMAGE_MODEL: flux
      KOKORO_KIDS_VOICE: ef_dora
      KOKORO_KIDS_SPEED: "1.03"
      YOUTUBE_TOKEN_ENVIKIDS: ${{ secrets.YOUTUBE_TOKEN_ENVIKIDS }}
    steps:
      - uses: actions/checkout@v4

      - name: Select duration and publish mode
        id: select
        shell: bash
        run: |
          MINUTES="${{ inputs.minutes }}"
          WANT_PUBLISH="${{ inputs.publish }}"
          PUBLISH=false
          if [ "$WANT_PUBLISH" = "true" ] && [ -n "$YOUTUBE_TOKEN_ENVIKIDS" ]; then
            PUBLISH=true
          fi
          echo "minutes=$MINUTES" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "EnViKids manual ${MINUTES}min / publish=${PUBLISH}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install generation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate EnViKids extended Short
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ steps.select.outputs.publish }}" = "true" ]; then EXTRA="--publish"; fi
          python -m app.kids_extended_pipeline --minutes "${{ steps.select.outputs.minutes }}" $EXTRA

      - name: Upload compact artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: envikids-short-${{ steps.select.outputs.minutes }}min-${{ github.run_id }}
          path: |
            output/envikids-extended-shorts/**/envikids_short_*min.mp4
            output/envikids-extended-shorts/**/metadata.json
            output/envikids-extended-shorts/**/result.json
          if-no-files-found: warn
          retention-days: 3
