name: DemianVelo Aleluya Premium

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar en YouTube
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: demianvelo-aleluya-premium
  cancel-in-progress: false

jobs:
  produce:
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 720
    env:
      PYTHONPATH: .
      AI_MODELS_ROOT: ${{ vars.AI_MODELS_ROOT || format('{0}/ai-models', github.workspace) }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.6-flash
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      YOUTUBE_TOKEN_DEMIANVELO: ${{ secrets.YOUTUBE_TOKEN_DEMIANVELO }}
      LTX2_ENABLED: "true"
      LTX2_OFFLOAD: cpu
      LTX2_ENHANCE_PROMPT: "true"
      DEMIANVELO_VISUAL_ENGINE: ltx2
      TTS_PROVIDER: chatterbox_latam
      TTS_FALLBACK_KOKORO: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Verify NVIDIA GPU
        run: nvidia-smi

      - name: Prepare LTX-2 and ACE-Step when missing
        shell: bash
        run: |
          ROOT="$AI_MODELS_ROOT"
          if [ ! -f "$ROOT/models/ltx-2.3/ltx-2.3-22b-distilled-1.1.safetensors" ] || [ ! -d "$ROOT/ACE-Step-1.5" ]; then
            bash scripts/setup_premium_gpu.sh
          fi

      - name: Export model paths
        shell: bash
        run: |
          ROOT="$AI_MODELS_ROOT"
          echo "LTX2_REPO_ROOT=$ROOT/LTX-2" >> "$GITHUB_ENV"
          echo "LTX2_CHECKPOINT=$ROOT/models/ltx-2.3/ltx-2.3-22b-distilled-1.1.safetensors" >> "$GITHUB_ENV"
          echo "LTX2_SPATIAL_UPSAMPLER=$ROOT/models/ltx-2.3/ltx-2.3-spatial-upscaler-x2-1.1.safetensors" >> "$GITHUB_ENV"
          echo "LTX2_GEMMA_ROOT=$ROOT/models/gemma-3-12b" >> "$GITHUB_ENV"

      - name: Install automation dependencies
        run: |
          python3 -m pip install -U pip
          python3 -m pip install -r requirements.txt

      - name: Start ACE-Step API
        shell: bash
        run: |
          cd "$AI_MODELS_ROOT/ACE-Step-1.5"
          nohup uv run acestep-api --host 127.0.0.1 --port 8001 > /tmp/acestep.log 2>&1 &
          echo $! > /tmp/acestep.pid
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8001/health >/dev/null 2>&1; then
              echo "ACESTEP_API_URL=http://127.0.0.1:8001" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 5
          done
          cat /tmp/acestep.log || true
          echo "ACE-Step API no inicio correctamente" >&2
          exit 1

      - name: Load Aleluya preset
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path('presets/demianvelo/aleluya_hallelujah.json').read_text(encoding='utf-8'))
          env = Path(os.environ['GITHUB_ENV'])
          with env.open('a', encoding='utf-8') as f:
              f.write('DEMIANVELO_STYLE=' + p['style'] + '\n')
              f.write('DEMIANVELO_VOCAL_CHARACTER=' + p['vocal_character'].replace('\n',' ') + '\n')
              f.write('DEMIANVELO_LYRICS<<__LYRICS__\n' + p['lyrics'] + '\n__LYRICS__\n')
          print(p['title'])
          PY

      - name: Generate ACE-Step song and LTX-2 music video
        shell: bash
        run: |
          ARGS=(--minutes 5 --style "$DEMIANVELO_STYLE" --music-engine acestep)
          if [ "${{ inputs.publish }}" = "true" ]; then ARGS+=(--publish); fi
          python3 -m app.music_pipeline "${ARGS[@]}"

      - name: Upload final production artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aleluya-hallelujah-demianvelo-${{ github.run_id }}
          path: output/demianvelo/
          retention-days: 5
