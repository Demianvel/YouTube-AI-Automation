name: Dios Habla Hoy IA - 2 Shorts premium ahora

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "triggers/dioshablahoyia-two-premium-now.txt"

permissions:
  contents: write
  issues: write

# Same group as the canonical Algenib emergency publisher. A manual request for
# exactly two premium Shorts takes priority over a broad 10-fill recovery.
concurrency:
  group: dioshablahoyia-algenib-emergency-publisher
  cancel-in-progress: true

jobs:
  publish_two:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
      TZ: America/Argentina/Buenos_Aires
      CHANNEL: dioshablahoyia
      CONTENT_MODE: voice
      DIOS_MANUAL_TARGET_TOTAL: "2"

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.6-flash
      GEMINI_TTS_VOICE: Algenib
      GEMINI_TTS_MAX_ATTEMPTS: "1"
      SPIRITUAL_MALE_GEMINI_VOICE: Algenib
      SPIRITUAL_VOICE_PROFILE: voz_de_luz_serena_original_v1
      SPIRITUAL_VOICE_BRAND: Voz de Luz
      SPIRITUAL_VOICE_REFERENCE_MODE: fixed_original_identity_no_speaker_clone
      SPIRITUAL_VOICE_LOCKED: "true"
      SPIRITUAL_VOICEOVER_MODE: "true"
      SPIRITUAL_REQUIRE_PRIMARY_VOICE: "true"
      TTS_PROVIDER: gemini_tts
      TTS_FALLBACK_KOKORO: "false"

      SPIRITUAL_SHORT_SECONDS: "60"
      SPIRITUAL_SHORT_SCENE_SECONDS: "8"
      SPIRITUAL_SHORT_AI_CLIPS: "0"
      SPIRITUAL_ALLOW_STILL_FALLBACK: "true"
      SPIRITUAL_FAST_RENDER: "false"
      SPIRITUAL_PREMIUM_RENDER: "true"
      SPIRITUAL_VISUAL_VARIETY_LEVEL: maximum
      SPIRITUAL_EDITORIAL_VARIETY_LEVEL: maximum
      SPIRITUAL_CTA_OVERLAY: "false"
      SPIRITUAL_REQUIRE_FRESH_VISUAL: "true"
      SPIRITUAL_REFERENCE_AVOID_RECENT: "100"

      SPIRITUAL_VISUAL_REFERENCE_LOCKED: "true"
      SPIRITUAL_VISUAL_REFERENCE_PROFILE: realistic_jesus_reference_abc_v1
      SPIRITUAL_ALLOW_SYMBOLIC_JESUS_FALLBACK: "false"
      SPIRITUAL_ALLOW_LOCAL_PROCEDURAL_VISUAL: "false"

      GEMINI_VIDEO_ENABLED: "false"
      HF_VIDEO_ENABLED: "false"
      HF_REFERENCE_IMAGE_ENABLED: "false"
      HF_REFERENCE_EDITOR_ENABLED: "false"
      HF_TEXT_ZERO_ENABLED: "false"
      HF_INFERENCE_PROVIDER_ENABLED: "false"
      HF_REMOTE_CIRCUIT_BREAKER: "true"
      MUSIC_PROVIDER: local

      YOUTUBE_TOKEN_DIOSHABLAHOYIA: ${{ secrets.YOUTUBE_TOKEN_DIOSHABLAHOYIA }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install premium publisher runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1 fonts-dejavu-core git >/dev/null
          python -m pip install -q --upgrade pip
          pip install -q \
            "google-genai>=2.3.0" \
            "google-api-python-client>=2.170.0" \
            "google-auth>=2.40.0" \
            "google-auth-oauthlib>=1.2.2" \
            "Pillow>=11.0.0" \
            "requests>=2.32.0" \
            "numpy<3,>=1.26" \
            "soundfile>=0.13.1" \
            "huggingface_hub<2,>=0.34.4" \
            "gradio_client<3,>=1.11.0"

      - name: Verify OAuth, Algenib and premium identity before rendering
        run: |
          test -n "$GEMINI_API_KEY"
          test -n "$YOUTUBE_TOKEN_DIOSHABLAHOYIA"
          test "$GEMINI_TTS_VOICE" = "Algenib"
          test "$SPIRITUAL_MALE_GEMINI_VOICE" = "Algenib"
          test "$SPIRITUAL_VOICE_BRAND" = "Voz de Luz"
          test "$SPIRITUAL_VOICE_PROFILE" = "voz_de_luz_serena_original_v1"
          test "$SPIRITUAL_VOICE_LOCKED" = "true"
          test "$SPIRITUAL_REQUIRE_PRIMARY_VOICE" = "true"
          test "$TTS_FALLBACK_KOKORO" = "false"
          test "$SPIRITUAL_VISUAL_REFERENCE_LOCKED" = "true"
          test "$SPIRITUAL_ALLOW_LOCAL_PROCEDURAL_VISUAL" = "false"
          for ref in \
            assets/dioshablahoyia/reference/jesus_reference_a.jpg \
            assets/dioshablahoyia/reference/jesus_reference_b.jpg \
            assets/dioshablahoyia/reference/jesus_reference_c.jpg; do
            test -s "$ref"
          done
          python -m py_compile \
            scripts/publish_dios_locked.py \
            scripts/publish_dios_two_premium.py \
            scripts/dioshablahoyia_publish_exact_two.py \
            app/spiritual_visual_motion.py
          python - <<'PY'
          import json, os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          payload = json.loads(os.environ['YOUTUBE_TOKEN_DIOSHABLAHOYIA'])
          creds = Credentials.from_authorized_user_info(payload, scopes=payload.get('scopes'))
          yt = build('youtube', 'v3', credentials=creds, cache_discovery=False)
          items = yt.channels().list(part='id,snippet', mine=True).execute().get('items') or []
          if not items:
              raise SystemExit('OAuth no devolvio ningun canal')
          actual = str((items[0].get('snippet') or {}).get('customUrl') or '').lower().lstrip('/')
          if actual != '@dioshablahoyia':
              raise SystemExit(f'Canal OAuth incorrecto: {actual}')
          print('OAUTH_OK @dioshablahoyia')
          PY

      - name: Publish only the first 2 real premium Shorts of today
        id: publish
        run: python scripts/dioshablahoyia_publish_exact_two.py

      - name: Persist every confirmed video_id immediately
        if: always()
        shell: bash
        run: |
          RECORDS=/tmp/dios-two-premium/new-short-records.jsonl
          test -s "$RECORDS" || exit 0
          cp "$RECORDS" /tmp/dios-two-premium-records-copy.jsonl
          git config user.name youtube-ai-bot
          git config user.email actions@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p state
            touch state/history.jsonl
            while IFS= read -r record; do
              test -n "$record" || continue
              VIDEO_ID="$(printf '%s' "$record" | python -c 'import json,sys; print(json.load(sys.stdin).get("video_id", ""))' 2>/dev/null || true)"
              test -n "$VIDEO_ID" || continue
              grep -Fq "\"video_id\": \"$VIDEO_ID\"" state/history.jsonl || printf '%s\n' "$record" >> state/history.jsonl
            done < /tmp/dios-two-premium-records-copy.jsonl
            git add state/history.jsonl
            git diff --cached --quiet && exit 0
            git commit -m "chore: persist two premium Dios Shorts"
            git push origin HEAD:main && exit 0
          done
          exit 1

      - name: Verify 2 real video_ids exist today
        if: always()
        run: |
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          zone = ZoneInfo('America/Argentina/Buenos_Aires')
          today = datetime.now(zone).date()
          rows=[]
          for raw in Path('state/history.jsonl').read_text(encoding='utf-8').splitlines():
              try:
                  row=json.loads(raw)
                  dt=datetime.fromisoformat(str(row.get('created_at') or '').replace('Z','+00:00'))
                  if dt.tzinfo is None: dt=dt.replace(tzinfo=timezone.utc)
              except Exception:
                  continue
              if row.get('channel')=='dioshablahoyia' and dt.astimezone(zone).date()==today and str(row.get('video_id') or '').strip():
                  rows.append(row)
          print(f'CONFIRMED_TODAY={len(rows)}')
          for row in rows:
              print(f"VIDEO_ID={row.get('video_id')} TITLE={row.get('title','')}")
          if len(rows) < 2:
              raise SystemExit('Todavia no hay 2 video_id reales confirmados hoy')
          PY

      - name: Open issue if exact premium request failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Dios Habla Hoy - fallo pedido 2 Shorts premium" \
            --body "El pedido manual se nego a degradar Voz de Luz / Algenib o la identidad visual. Revisar Actions run $GITHUB_RUN_ID. Solo cuentan video_id reales."
