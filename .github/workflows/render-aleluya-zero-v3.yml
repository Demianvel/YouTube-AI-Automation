name: Render Aleluya FREE v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/render-aleluya-zero-v3.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-aleluya-zero-v3
  cancel-in-progress: true

jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -U gradio_client
      - name: Try alternate FREE ACE-Step Spaces dynamically
        shell: bash
        run: |
          mkdir -p output/music
          python - <<'PY'
          import shutil
          from pathlib import Path
          from gradio_client import Client

          caption = (
              'Original Christian electronic worship, cinematic pop and progressive house, 122 BPM, '
              'warm deep original male singer in Argentine Spanish, intimate verses, uplifting chorus, '
              'luminous electronic drop, polished modern production, hopeful spiritual atmosphere, '
              'no imitation of any real singer, no copyrighted melody or samples.'
          )
          lyrics = '''[INTRO]\nCuando la noche parece no terminar,\nTu luz me encuentra y me vuelve a levantar.\n\n[PRE-CORO]\nY aunque tiemble el suelo bajo mis pies,\nsi Tu mano me sostiene, vuelvo a creer.\n\n[CORO]\nAleluya, Hallelujah,\nmi esperanza vive en Vos.\nAleluya, Hallelujah,\nlate fuerte el corazón.\nCuando todo se oscurece,\nTu presencia trae la luz.\nAleluya, Hallelujah,\nmi camino es con Jesús.\n\n[OUTRO]\nAleluya… Hallelujah…\nTu luz siempre estará.'''

          spaces = [
              'R-Kentaren/ace-step-jam',
              'LububMusicAi/ACE-Step-Custom',
              'Gamahea/ACE-Step-Custom',
              'victor/ace-step-jam',
          ]

          def pick(name, default):
              n=name.lower().replace('-','_')
              if 'model' in n: return 'acestep-v15-turbo'
              if n in {'prompt','caption','music_prompt','description','song_description'} or ('prompt' in n and 'negative' not in n): return caption
              if 'lyric' in n: return lyrics
              if n == 'bpm' or n.endswith('_bpm'): return 122
              if 'key' in n and 'api' not in n: return ''
              if 'time_signature' in n or 'timesignature' in n: return '4'
              if 'vocal_language' in n or n in {'language','lang'}: return 'es'
              if 'duration' in n and 'repaint' not in n: return 60
              if 'inference_step' in n or n == 'steps': return 8
              if 'guidance' in n: return 7.0
              if 'batch' in n and 'chunk' not in n: return 1
              if n in {'seed','seed_number'}: return -1
              if 'random_seed' in n: return True
              if 'audio_format' in n or n == 'format': return 'mp3'
              if 'click_track' in n: return False
              if 'temperature' in n: return 0.85
              if 'cfg_scale' in n: return 2.0
              if 'top_k' in n: return 0
              if 'top_p' in n: return 0.9
              if 'auto_lrc' in n: return True
              if 'auto_score' in n: return False
              if 'cot_caption' in n or 'cot_language' in n: return True
              if 'thinking' in n: return True
              if 'task_type' in n: return 'text2music'
              if 'generation_mode' in n: return 'custom'
              return default

          def find_audio(v, files):
              if isinstance(v,str):
                  p=Path(v)
                  if p.exists() and p.suffix.lower() in {'.mp3','.wav','.flac','.m4a'}: files.append(p)
              elif isinstance(v,dict):
                  for x in v.values(): find_audio(x,files)
              elif isinstance(v,(list,tuple)):
                  for x in v: find_audio(x,files)

          errors=[]
          for space in spaces:
              print('\nTRY_SPACE',space)
              try:
                  c=Client(space,verbose=False)
                  api=c.view_api(return_format='dict')
                  named=api.get('named_endpoints',api)
                  candidates=[]
                  for endpoint,spec in named.items():
                      if not isinstance(spec,dict): continue
                      names=[str(p.get('parameter_name') or '') for p in spec.get('parameters',[])]
                      blob=(endpoint+' '+' '.join(names)).lower()
                      if 'lyric' in blob and any(k in blob for k in ['generate','song','music','custom']):
                          candidates.append((endpoint,spec))
                  if not candidates:
                      raise RuntimeError('No generation endpoint with lyrics found')
                  endpoint,spec=candidates[0]
                  print('ENDPOINT',endpoint)
                  args=[]
                  for p in spec.get('parameters',[]):
                      name=str(p.get('parameter_name') or '')
                      default=p.get('default',None)
                      args.append(pick(name,default))
                      print('ARG',name,'=',repr(args[-1])[:120])
                  result=c.predict(*args,api_name=endpoint)
                  files=[]; find_audio(result,files)
                  if not files:
                      raise RuntimeError('No downloadable audio in result: '+repr(result)[:2000])
                  src=files[0]
                  dst=Path('output/music/Aleluya_Hallelujah_DemianVelo_60s'+src.suffix.lower())
                  shutil.copy2(src,dst)
                  print('MUSIC_SUCCESS',space,dst,dst.stat().st_size)
                  break
              except Exception as exc:
                  errors.append(f'{space}: {type(exc).__name__}: {exc}')
                  print('SPACE_FAIL',errors[-1])
          else:
              raise RuntimeError('All FREE ACE-Step Spaces failed:\n'+'\n'.join(errors))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aleluya-music-v3
          path: output/music/
          if-no-files-found: warn
          retention-days: 5

  video:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: 1
            space: cbensimon/LTX-2-3
            prompt: "Original fictional adult male Christian electronic singer performing on a minimal cinematic stage, volumetric blue and golden light, expressive natural movement, realistic premium cinematography, no celebrity resemblance, no text, no logos, 16:9"
          - id: 2
            space: techfreakworm/LTX2.3-Studio
            prompt: "Epic sunrise over mountain landscape, golden rays through clouds, cinematic drone movement, spiritual hopeful atmosphere, photorealistic premium electronic Christian music video, no text, no logos, 16:9"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -U gradio_client
      - name: Detect and call alternate FREE LTX-2.3 Space
        shell: bash
        env:
          SPACE: ${{ matrix.space }}
          SCENE_ID: ${{ matrix.id }}
          PROMPT: ${{ matrix.prompt }}
        run: |
          mkdir -p output/video
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          from gradio_client import Client

          c=Client(os.environ['SPACE'],verbose=False)
          api=c.view_api(return_format='dict')
          named=api.get('named_endpoints',api)
          candidates=[]
          for endpoint,spec in named.items():
              if not isinstance(spec,dict): continue
              names=[str(p.get('parameter_name') or '') for p in spec.get('parameters',[])]
              blob=(endpoint+' '+' '.join(names)).lower()
              returns=' '.join(str(r.get('type') or '') for r in spec.get('returns',[])).lower()
              if 'prompt' in blob and ('video' in endpoint.lower() or 'video' in returns):
                  candidates.append((endpoint,spec))
          if not candidates:
              raise RuntimeError('No video generation endpoint found')
          endpoint,spec=candidates[0]
          print('SPACE',os.environ['SPACE'],'ENDPOINT',endpoint)
          args=[]
          for p in spec.get('parameters',[]):
              n=str(p.get('parameter_name') or '').lower().replace('-','_')
              default=p.get('default',None)
              if 'prompt' in n: value=os.environ['PROMPT']
              elif 'image' in n or 'audio' in n or 'video' in n and 'output' not in n: value=None
              elif 'duration' in n: value=3.0
              elif 'enhance' in n: value=True
              elif n == 'seed': value=100+int(os.environ['SCENE_ID'])
              elif 'randomize_seed' in n or 'random_seed' in n: value=True
              elif n == 'height': value=576
              elif n == 'width': value=1024
              else: value=default
              args.append(value)
              print('ARG',n,'=',repr(value)[:120])
          result=c.predict(*args,api_name=endpoint)
          files=[]
          def walk(v):
              if isinstance(v,str):
                  p=Path(v)
                  if p.exists() and p.suffix.lower() in {'.mp4','.webm','.mov'}: files.append(p)
              elif isinstance(v,dict):
                  for x in v.values(): walk(x)
              elif isinstance(v,(list,tuple)):
                  for x in v: walk(x)
          walk(result)
          if not files:
              raise RuntimeError('No downloadable video in result: '+repr(result)[:3000])
          src=files[0]
          dst=Path(f"output/video/scene_{int(os.environ['SCENE_ID']):02d}{src.suffix.lower()}")
          shutil.copy2(src,dst)
          print('VIDEO_SUCCESS',os.environ['SPACE'],dst,dst.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aleluya-scene-v3-${{ matrix.id }}
          path: output/video/
          if-no-files-found: warn
          retention-days: 5

  assemble:
    needs: [music, video]
    if: always() && needs.music.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: aleluya-*-v3*
          path: input
          merge-multiple: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Assemble 60-second final
        shell: bash
        run: |
          mkdir -p output/final
          python - <<'PY'
          import glob,subprocess
          from pathlib import Path
          audio=next((p for p in glob.glob('input/*') if Path(p).suffix.lower() in {'.mp3','.wav','.flac','.m4a'}),None)
          scenes=sorted([p for p in glob.glob('input/*') if Path(p).suffix.lower() in {'.mp4','.webm','.mov'}])
          if not audio: raise RuntimeError('Missing ACE-Step audio')
          if not scenes: raise RuntimeError('Missing LTX-2 video')
          def dur(p):
              r=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',p],capture_output=True,text=True,check=True)
              return float(r.stdout.strip())
          target=dur(audio)
          variants=[]
          for i,src in enumerate(scenes):
              for mode in range(4):
                  dst=Path(f'output/final/var_{i}_{mode}.mp4')
                  vf=[
                    'scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30',
                    'scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,hflip,fps=30',
                    'scale=2304:1296:force_original_aspect_ratio=increase,crop=1920:1080:x=(iw-ow)/2:y=(ih-oh)/2,fps=30',
                    'scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,eq=contrast=1.06:saturation=1.10,fps=30',
                  ][mode]
                  subprocess.run(['ffmpeg','-y','-loglevel','error','-stream_loop','-1','-i',src,'-t','8','-vf',vf,'-an','-c:v','libx264','-preset','medium','-crf','19','-pix_fmt','yuv420p',str(dst)],check=True)
                  variants.append(dst)
          manifest=Path('output/final/concat.txt'); lines=[]; elapsed=0.;i=0
          while elapsed<target+8:
              v=variants[i%len(variants)]; lines.append("file '"+str(v.resolve()).replace("'","'\\''")+"'"); elapsed+=dur(str(v));i+=1
          manifest.write_text('\n'.join(lines),encoding='utf-8')
          visual=Path('output/final/visual.mp4')
          subprocess.run(['ffmpeg','-y','-loglevel','error','-f','concat','-safe','0','-i',str(manifest),'-t',f'{target:.3f}','-an','-c:v','libx264','-preset','medium','-crf','18','-pix_fmt','yuv420p',str(visual)],check=True)
          final=Path('output/final/Aleluya_Hallelujah_x_DemianVelo_60s.mp4')
          subprocess.run(['ffmpeg','-y','-loglevel','error','-i',str(visual),'-i',audio,'-map','0:v:0','-map','1:a:0','-t',f'{target:.3f}','-c:v','copy','-c:a','aac','-b:a','256k','-movflags','+faststart',str(final)],check=True)
          print('FINAL',final,target,final.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aleluya-final-free-v3
          path: output/final/Aleluya_Hallelujah_x_DemianVelo_60s.mp4
          if-no-files-found: error
          retention-days: 5
