name: Dios Actua - Norway 4K official release
# Premium DemianVelo render. Push trigger generates a QA master without publishing.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar en @DemianVelo si el master pasa QA
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - triggers/dios-actua-premium-test.txt
  schedule:
    - cron: '15 12 14 8 *'

permissions:
  contents: read
  actions: read

concurrency:
  group: dios-actua-noruega-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: ${{ github.workspace }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_TOKEN_DEMIANVELO: ${{ secrets.YOUTUBE_TOKEN_DEMIANVELO }}
      ACESTEP_HF_SPACE: ACE-Step/Ace-Step-v1.5
      ACESTEP_HF_MODEL: acestep-v15-turbo
    steps:
      - uses: actions/checkout@v4

      - name: Resolver modo de ejecución
        id: release_gate
        shell: bash
        run: |
          RUN_RELEASE=false
          WANT_PUBLISH=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN_RELEASE=true
            WANT_PUBLISH="${{ inputs.publish }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            RUN_RELEASE=true
            WANT_PUBLISH=false
          elif [ "$(date -u +%F)" = "2026-08-14" ]; then
            RUN_RELEASE=true
            WANT_PUBLISH=true
          fi
          echo "run_release=$RUN_RELEASE" >> "$GITHUB_OUTPUT"
          echo "publish=$WANT_PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Render habilitado=$RUN_RELEASE / publicar=$WANT_PUBLISH"

      - name: Recuperar la referencia vocal Aleluya de DemianVelo
        if: steps.release_gate.outputs.run_release == 'true'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: aleluya-v4-music
          path: reference_aleluya
          repository: Demianvel/YouTube-AI-Automation
          run-id: 31659166745
          github-token: ${{ github.token }}

      - uses: actions/setup-python@v5
        if: steps.release_gate.outputs.run_release == 'true'
        with:
          python-version: "3.11"

      - name: Instalar motor musical y editor 4K
        if: steps.release_gate.outputs.run_release == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation2
          python -m pip install --upgrade pip
          pip install -U requests gradio_client huggingface_hub google-api-python-client google-auth pillow

      - name: Configurar ACE-Step 1.5 Turbo y rutas estables
        if: steps.release_gate.outputs.run_release == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/render_dios_actua_noruega.py')
          text = p.read_text(encoding='utf-8')

          # El Space público oficial expone actualmente los modelos turbo/shift3.
          # No sustituirlos por el identificador XL dentro del cliente Gradio.
          text = text.replace('acestep-v15-xl-turbo', 'acestep-v15-turbo')

          # Priorizar el Space oficial también cuando no hay referencia vocal.
          old = '''    spaces = [\n        "techfreakworm/ACE-Music-Studio",'''
          new = '''    spaces = [\n        os.getenv("ACESTEP_HF_SPACE", "ACE-Step/Ace-Step-v1.5"),\n        "techfreakworm/ACE-Music-Studio",'''
          if old in text:
              text = text.replace(old, new, 1)

          # Mirror eliminado/no disponible: evita un 404 inútil en cada release.
          text = text.replace('        "R-Kentaren/ace-step-jam",\n', '')

          p.write_text(text, encoding='utf-8')
          assert 'acestep-v15-turbo' in text
          assert 'R-Kentaren/ace-step-jam' not in text
          assert 'os.getenv("ACESTEP_HF_SPACE", "ACE-Step/Ace-Step-v1.5")' in text
          print('ACE-Step oficial priorizado; modelo turbo compatible; mirror 404 eliminado.')
          PY
          if find reference_aleluya -type f \( -iname '*.wav' -o -iname '*.mp3' -o -iname '*.flac' -o -iname '*.m4a' \) -print -quit 2>/dev/null | grep -q .; then
            echo "VOCAL_REFERENCE_READY=true"
            echo "Referencia vocal DemianVelo disponible."
          else
            echo "VOCAL_REFERENCE_READY=false"
            echo "No hay archivo de referencia; se usará dirección vocal original sin imitar terceros."
          fi

      - name: Validar recursos antes del render
        if: steps.release_gate.outputs.run_release == 'true'
        shell: bash
        run: |
          test -s assets/dios-actua/thumbnail-b-emocion-noruega.jpg
          test -s assets/dios-actua/letra-original.txt
          if [ "${{ steps.release_gate.outputs.publish }}" = "true" ]; then
            test -n "$YOUTUBE_TOKEN_DEMIANVELO" || { echo "Falta YOUTUBE_TOKEN_DEMIANVELO" >&2; exit 1; }
          fi
          if [ -z "$HF_TOKEN" ]; then
            echo "AVISO: HF_TOKEN no está disponible; ACE-Step/LTX usarán sólo cuota pública si el Space lo permite."
          else
            echo "HF_TOKEN disponible para Spaces/Inference."
          fi

      - name: Crear canción original y videoclip cinematográfico 4K
        if: steps.release_gate.outputs.run_release == 'true'
        shell: bash
        run: |
          ARGS=()
          if [ "${{ steps.release_gate.outputs.publish }}" = "true" ]; then
            ARGS+=(--publish)
          fi
          python scripts/render_dios_actua_noruega.py "${ARGS[@]}"

      - name: Verificar master 4K y resultado
        if: always() && steps.release_gate.outputs.run_release == 'true'
        shell: bash
        run: |
          if [ -f output/dios_actua_demianvelo/final/result.json ]; then
            cat output/dios_actua_demianvelo/final/result.json
          fi
          MASTER=output/dios_actua_demianvelo/final/Dios_Actua_DemianVelo_4K.mp4
          if [ -f "$MASTER" ]; then
            ffprobe -v error -show_entries stream=width,height,codec_name:format=duration,size -of json "$MASTER"
          fi

      - name: Guardar master 4K y variantes A/B
        if: always() && steps.release_gate.outputs.run_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dios-actua-demianvelo-4k-${{ github.run_id }}
          path: |
            output/dios_actua_demianvelo/
            assets/dios-actua/letra-original.txt
            assets/dios-actua/youtube-metadata.txt
            assets/dios-actua/thumbnail-a-jesus-noruega.jpg
            assets/dios-actua/thumbnail-b-emocion-noruega.jpg
          if-no-files-found: warn
          compression-level: 0
          retention-days: 5