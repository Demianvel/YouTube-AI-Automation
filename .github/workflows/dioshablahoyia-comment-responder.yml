name: Dios Habla Hoy IA - Responder comentarios 24x7

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:
    inputs:
      max_replies:
        description: Maximo de respuestas en esta ejecucion
        required: false
        default: "12"
  push:
    paths:
      - "scripts/dioshablahoyia_comment_responder.py"
      - "scripts/dioshablahoyia_comment_responder_es.py"
      - ".github/workflows/dioshablahoyia-comment-responder.yml"

permissions:
  contents: read

concurrency:
  group: dioshablahoyia-comment-responder-24x7
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      YOUTUBE_TOKEN_DIOSHABLAHOYIA: ${{ secrets.YOUTUBE_TOKEN_DIOSHABLAHOYIA }}
      COMMENT_REPLY_MAX: ${{ github.event_name == 'workflow_dispatch' && inputs.max_replies || '12' }}
      COMMENT_THREAD_SCAN_MAX: "100"
      COMMENT_REPLY_LANGUAGE: "es"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YouTube API dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "google-api-python-client>=2.180,<3" \
            "google-auth>=2.40,<3" \
            "requests>=2.32,<3"

      - name: Validate Spanish-only responder
        run: |
          python -m py_compile \
            scripts/dioshablahoyia_comment_responder.py \
            scripts/dioshablahoyia_comment_responder_es.py
          python scripts/dioshablahoyia_comment_responder_es.py --self-test

      - name: Verify YouTube OAuth secret exists
        id: secret
        shell: bash
        run: |
          if [ -z "$YOUTUBE_TOKEN_DIOSHABLAHOYIA" ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=YouTube OAuth ausente::Falta YOUTUBE_TOKEN_DIOSHABLAHOYIA; el responder queda en fail-open."
          else
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight YouTube OAuth refresh
        id: oauth
        if: steps.secret.outputs.valid == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials

          valid = False
          reason = ""
          try:
              payload = json.loads(os.environ["YOUTUBE_TOKEN_DIOSHABLAHOYIA"])
              creds = Credentials.from_authorized_user_info(payload, scopes=payload.get("scopes"))
              creds.refresh(Request())
              valid = True
          except Exception as exc:
              reason = f"{type(exc).__name__}: {exc}".replace("\n", " ")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"valid={'true' if valid else 'false'}\n")

          if valid:
              print("OAUTH_REFRESH_OK")
          else:
              print(f"::warning title=YouTube OAuth requiere reconexion::{reason}")
              print("El workflow no se marca como fallo por un OAuth invalido; volvera a operar cuando el secret sea renovado.")
          PY

      - name: Detectar y responder comentarios solo en español
        if: steps.secret.outputs.valid == 'true' && steps.oauth.outputs.valid == 'true'
        shell: bash
        run: |
          status=1
          for attempt in 1 2 3; do
            echo "Intento $attempt/3 del respondedor 24x7"
            if python scripts/dioshablahoyia_comment_responder_es.py; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          exit "$status"

      - name: OAuth pendiente - fail open sin bloquear CI
        if: steps.secret.outputs.valid != 'true' || steps.oauth.outputs.valid != 'true'
        shell: bash
        run: |
          echo "::warning title=Accion requerida::Reconecta @dioshablahoyia para renovar YOUTUBE_TOKEN_DIOSHABLAHOYIA."
          echo "Ejecuta desde Termux: bash scripts/connect_dioshablahoyia_termux.sh"
          echo "El respondedor queda fail-open y volvera a operar automaticamente cuando el secret sea valido."
          exit 0
