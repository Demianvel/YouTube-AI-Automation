name: Dios Habla Hoy IA - Responder comentarios 24x7

on:
  schedule:
    # Monitoreo continuo 24/7: revisa comentarios nuevos cada 5 minutos.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      max_replies:
        description: Maximo de respuestas en esta ejecucion
        required: false
        default: "12"

permissions:
  contents: read

concurrency:
  group: dioshablahoyia-comment-responder-24x7
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YOUTUBE_TOKEN_DIOSHABLAHOYIA: ${{ secrets.YOUTUBE_TOKEN_DIOSHABLAHOYIA }}
      COMMENT_REPLY_MAX: ${{ github.event_name == 'workflow_dispatch' && inputs.max_replies || '12' }}
      COMMENT_THREAD_SCAN_MAX: "100"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YouTube API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth

      - name: Detect and reply to new suitable comments
        run: python scripts/dioshablahoyia_comment_responder.py
