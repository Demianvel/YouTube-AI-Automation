name: DemianVelo Aqui Estas - ACE-Step + Wan2.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/demianvelo-aqui-estas-wan22.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: demianvelo-aqui-estas-wan22
  cancel-in-progress: true

jobs:
  music:
    name: Recuperar máster ACE-Step verificado
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar la voz y canción ya aprobadas
        uses: actions/download-artifact@v4
        with:
          name: aqui-estas-music
          path: output/music
          repository: Demianvel/YouTube-AI-Automation
          run-id: 31666079104
          github-token: ${{ github.token }}
      - name: Verificar el máster de audio
        shell: bash
        run: |
          python - <<'PY'
          import wave
          from pathlib import Path
          files = list(Path("output/music").rglob("*.wav"))
          if len(files) != 1:
              raise RuntimeError(f"Se esperaba un único WAV y se encontraron: {files}")
          audio = files[0]
          with wave.open(str(audio), "rb") as wav:
              duration = wav.getnframes() / wav.getframerate()
              print("AUDIO_QA", audio, duration, wav.getframerate(), wav.getnchannels(), wav.getsampwidth())
              if not 239 <= duration <= 241:
                  raise RuntimeError(f"Duración inesperada: {duration:.3f}s")
              if wav.getframerate() != 48000 or wav.getnchannels() != 2:
                  raise RuntimeError("El máster no es estéreo a 48 kHz")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aqui-estas-music
          path: output/music/
          retention-days: 7

  video:
    name: Escena Wan2.2 ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: 1
            space: OpenKing/wan2-video-generation
            prompt: "Respectful original cinematic depiction of Jesus, a Middle Eastern Jewish man in his early thirties with shoulder-length dark hair and a simple cream robe, walking with diverse adults through a sunlit green meadow and helping them cross a small stream, distant mountains, slow cinematic dolly, premium Christian music video, human photorealism, natural skin and hands, contemplative faces with relaxed closed mouths, nobody speaking or singing, no direct-to-camera performance, no celebrity resemblance, no text, no logo, 16:9"
          - id: 2
            space: BYTFITY/wan2-video-generation262515414142
            prompt: "Respectful original cinematic depiction of Jesus, a Middle Eastern Jewish man in his early thirties wearing a simple cream robe, welcoming tired adult hikers at a mountain summit at sunrise, sincere embraces, vast valley and birds, smooth aerial-to-dolly camera, authentic hope, premium human photorealism, contemplative faces with relaxed closed mouths, nobody speaking or singing, no direct-to-camera performance, no celebrity resemblance, no text, no logo, 16:9"
          - id: 3
            space: OpenKing/wan2-video-generation
            prompt: "Respectful original cinematic depiction of Jesus sharing bread at a warm community gathering beside a lake, diverse adults helping an older man, compassionate gestures, sunlight through olive trees, gentle gimbal movement, premium human photorealism, natural skin and hands, calm faces with relaxed closed mouths, nobody speaking or singing, no direct-to-camera performance, no celebrity resemblance, no text, no logo, 16:9"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -U gradio_client
      - name: Generar escena cinematográfica
        shell: bash
        env:
          SPACE: ${{ matrix.space }}
          SCENE_ID: ${{ matrix.id }}
          PROMPT: ${{ matrix.prompt }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p output/video
          python - <<'PY'
          import os, shutil, signal, time
          from pathlib import Path
          from gradio_client import Client

          client = Client(os.environ["SPACE"], token=os.getenv("HF_TOKEN") or None, verbose=False)
          api = client.view_api(return_format="dict")
          named = api.get("named_endpoints", api)
          candidates = []
          for name, info in named.items():
              if not isinstance(info, dict):
                  continue
              parameters = info.get("parameters", [])
              names = [str(p.get("parameter_name") or "").lower() for p in parameters]
              returns = " ".join(str(r.get("component") or r.get("type") or "") for r in info.get("returns", [])).lower()
              has_prompt = any("prompt" in n or "description" in n for n in names)
              generic = len(parameters) >= 7 and all(n.startswith("param_") for n in names)
              if (has_prompt or generic) and ("video" in returns or "video" in name.lower() or "generate" in name.lower()):
                  candidates.append((name, info))
          if not candidates:
              raise RuntimeError("No se detectó endpoint de Wan2.2: " + repr(named)[:4000])
          candidates.sort(key=lambda x: (0 if "generate" in x[0].lower() else 1, len(x[1].get("parameters", []))))
          failures = []
          source = None
          for endpoint, spec in candidates[:4]:
              parameters = spec.get("parameters", [])
              generic = all(str(p.get("parameter_name") or "").lower().startswith("param_") for p in parameters)
              args = []
              for idx, parameter in enumerate(parameters):
                  name = str(parameter.get("parameter_name") or "").lower().replace("-", "_")
                  default = parameter.get("default", None)
                  if generic:
                      value = {0: os.environ["PROMPT"], 1: None, 2: 1280, 3: 704, 4: 73, 5: 28, 6: 5.0, 7: 2600 + int(os.environ["SCENE_ID"])}.get(idx, default)
                  elif "image" in name:
                      value = None
                  elif "prompt" in name or "description" in name:
                      value = os.environ["PROMPT"]
                  elif "height" in name:
                      value = 704
                  elif "width" in name:
                      value = 1280
                  elif "frame" in name:
                      value = 73
                  elif "duration" in name or "seconds" in name:
                      value = 3.0
                  elif "sampling" in name or "steps" in name:
                      value = 28
                  elif "guide" in name:
                      value = 5.0
                  elif "shift" in name:
                      value = 5.0 if default is None else default
                  elif "seed" in name:
                      value = 2600 + int(os.environ["SCENE_ID"])
                  else:
                      value = default
                  args.append(value)
              try:
                  result = None
                  def timeout_handler(_signum, _frame):
                      raise TimeoutError("Wan2.2 no respondió dentro del límite por intento")
                  signal.signal(signal.SIGALRM, timeout_handler)
                  for attempt in range(1, 5):
                      try:
                          signal.alarm(360)
                          try:
                              result = client.predict(*args, api_name=endpoint)
                          finally:
                              signal.alarm(0)
                          break
                      except Exception as exc:
                          transient = any(term in str(exc).lower() for term in ("queue is full", "queue full", "temporarily", "timeout", "503", "429"))
                          if not transient or attempt == 4:
                              raise
                          wait_seconds = min(30 * attempt, 120)
                          print(f"WAN_RETRY endpoint={endpoint} attempt={attempt}/4 wait={wait_seconds}s reason={type(exc).__name__}: {exc}")
                          time.sleep(wait_seconds)
                  videos = []
                  def walk(value):
                      if isinstance(value, str):
                          p = Path(value)
                          if p.exists() and p.suffix.lower() in {".mp4", ".webm", ".mov", ".mkv"}:
                              videos.append(p)
                      elif isinstance(value, dict):
                          for item in value.values(): walk(item)
                      elif isinstance(value, (list, tuple)):
                          for item in value: walk(item)
                  walk(result)
                  if not videos:
                      raise RuntimeError("resultado sin video: " + repr(result)[:1000])
                  source = videos[0]
                  break
              except Exception as exc:
                  failures.append(f"{endpoint}: {type(exc).__name__}: {exc}")
          if source is None:
              raise RuntimeError("Wan2.2 no devolvió video: " + " | ".join(failures))
          target = Path(f"output/video/scene_{int(os.environ['SCENE_ID']):02d}{source.suffix.lower()}")
          shutil.copy2(source, target)
          print("VIDEO_OK", target, target.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aqui-estas-wan-${{ matrix.id }}
          path: output/video/
          if-no-files-found: warn
          retention-days: 7

  master:
    name: Mezcla, videoclip y Short
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [music, video]
    if: always() && needs.music.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: aqui-estas-*
          path: artifacts
          merge-multiple: true
      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Construir masters
        shell: bash
        run: |
          mkdir -p release /tmp/scenes
          AUDIO="$(find artifacts -type f \( -iname '*.wav' -o -iname '*.flac' -o -iname '*.mp3' \) | head -n1)"
          test -n "$AUDIO" || { echo "Falta audio"; exit 1; }
          mapfile -t SCENES < <(find artifacts -type f \( -iname '*.mp4' -o -iname '*.webm' -o -iname '*.mov' \) | sort)
          test "${#SCENES[@]}" -ge 3 || { echo "BLOQUEADO: Wan2.2 entregó menos de 3 escenas; no se publicará un video estático o incompleto"; exit 1; }

          : > /tmp/scenes/list.txt
          INDEX=0
          for SCENE in "${SCENES[@]}"; do
            OUT="/tmp/scenes/wan_${INDEX}.mp4"
            ffmpeg -y -loglevel error -stream_loop -1 -i "$SCENE" -t 18 \
              -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30,eq=contrast=1.04:saturation=1.06:gamma=1.01,vignette=PI/11,fade=t=in:st=0:d=0.7,fade=t=out:st=17.3:d=0.7" \
              -an -c:v libx264 -preset fast -crf 17 -pix_fmt yuv420p -video_track_timescale 90000 "$OUT"
            echo "file '$OUT'" >> /tmp/scenes/list.txt
            if test "$INDEX" -lt 4; then
              STILL="$(find assets/aqui-estas -maxdepth 1 -type f -iname '*.jpg' | sort | sed -n "$((INDEX+1))p")"
              test -n "$STILL" || { echo "Falta recurso cinematográfico ${INDEX}"; exit 1; }
              STILL_OUT="/tmp/scenes/still_${INDEX}.mp4"
              ffmpeg -y -loglevel error -loop 1 -i "$STILL" -t 20 \
                -vf "scale=2100:1182:force_original_aspect_ratio=increase,crop=2100:1182,zoompan=z='min(zoom+0.00035,1.10)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=600:s=1920x1080:fps=30,eq=contrast=1.04:saturation=1.05:gamma=1.01,vignette=PI/12,fade=t=in:st=0:d=0.7,fade=t=out:st=19.3:d=0.7" \
                -an -c:v libx264 -preset fast -crf 17 -pix_fmt yuv420p -video_track_timescale 90000 "$STILL_OUT"
              echo "file '$STILL_OUT'" >> /tmp/scenes/list.txt
            fi
            INDEX=$((INDEX+1))
          done

          ffmpeg -y -loglevel error -f concat -safe 0 -i /tmp/scenes/list.txt \
            -an -c:v copy /tmp/montage.mp4
          ffmpeg -y -loglevel error -i "$AUDIO" -t 240 \
            -af "highpass=f=32,lowpass=f=18000,acompressor=threshold=-18dB:ratio=2:attack=20:release=180:makeup=2,loudnorm=I=-13:LRA=8:TP=-1.2,alimiter=limit=0.90" \
            -ar 48000 -ac 2 -c:a pcm_s24le release/Aqui_Estas_x_DemianVelo_MASTER.wav
          ffmpeg -y -loglevel error -stream_loop -1 -i /tmp/montage.mp4 -i release/Aqui_Estas_x_DemianVelo_MASTER.wav -t 240 \
            -map 0:v:0 -map 1:a:0 -vf "fps=30" -c:v libx264 -preset fast -crf 17 -pix_fmt yuv420p \
            -c:a aac -b:a 320k -movflags +faststart release/Aqui_Estas_x_DemianVelo_4min.mp4

          ffmpeg -y -loglevel error -ss 32 -i release/Aqui_Estas_x_DemianVelo_4min.mp4 -t 59 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30" \
            -c:v libx264 -preset fast -crf 18 -c:a aac -b:a 320k -movflags +faststart \
            release/Aqui_Estas_x_DemianVelo_SHORT.mp4

          cp assets/aqui-estas/thumbnail-aqui-estas-demianvelo.jpg release/thumbnail.jpg
          test "$(stat -c%s release/thumbnail.jpg)" -lt 2097152 || { echo "Miniatura supera 2 MB"; exit 1; }
          ffprobe -v error -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate:format=duration,size -of json release/Aqui_Estas_x_DemianVelo_4min.mp4 > release/qa-long.json
          ffprobe -v error -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate:format=duration,size -of json release/Aqui_Estas_x_DemianVelo_SHORT.mp4 > release/qa-short.json
          python - <<'PY'
          import json
          from pathlib import Path
          qa = json.loads(Path("release/qa-long.json").read_text())
          duration = float(qa["format"]["duration"])
          video = next(s for s in qa["streams"] if s["codec_type"] == "video")
          audio = next(s for s in qa["streams"] if s["codec_type"] == "audio")
          if not 239 <= duration <= 241:
              raise RuntimeError(f"Duración final inválida: {duration}")
          if (video.get("width"), video.get("height")) != (1920, 1080):
              raise RuntimeError(f"Resolución final inválida: {video}")
          if audio.get("codec_name") != "aac":
              raise RuntimeError(f"Audio final inválido: {audio}")
          if int(qa["format"]["size"]) < 20_000_000:
              raise RuntimeError("El video final es demasiado pequeño")
          print("MASTER_QA_OK", duration, video, audio)
          PY
      - name: Guardar letra y metadatos
        shell: bash
        run: |
          cat > release/LETRA_Y_METADATA.txt <<'TXT'
          AQUÍ ESTÁS x DEMIANVELO

          Canción pop worship cristiana original 2026 sobre la presencia de Dios, la esperanza y la fe en Jesús.

          Título YouTube:
          AQUÍ ESTÁS — DemianVelo | Video Oficial | Canción Cristiana

          Descripción:
          “Aquí Estás” es una canción cristiana original de DemianVelo sobre sentir la presencia de Dios en cada momento. Una alabanza contemporánea, íntima y esperanzadora para recordar que Jesús permanece cerca, trae paz y vuelve a levantar el corazón.

          Suscribite a DemianVelo y compartí esta canción con alguien que necesite esperanza hoy.

          Dios Habla Hoy
          #DemianVelo #AquiEstas #MusicaCristiana #Jesus #Dios #Worship

          CORO:
          Aquí estás, cerca de mi corazón,
          trayendo vida, levantando mi canción.
          Aquí estás, dando calma y libertad,
          Jesús, tu amor me vuelve a despertar.
          Sos mi refugio, mi fuerza y mi verdad;
          mi Dios, aquí estás.
          TXT
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar publicador de YouTube
        run: pip install -U google-api-python-client google-auth
      - name: Publicar directamente en DemianVelo
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
          YOUTUBE_TOKEN_DEMIANVELO: ${{ secrets.YOUTUBE_TOKEN_DEMIANVELO }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from app.config import load_channel
          from app.youtube import upload_long_video

          video = Path("release/Aqui_Estas_x_DemianVelo_4min.mp4")
          thumb = Path("release/thumbnail.jpg")
          channel = load_channel("demianvelo")
          metadata = {
              "title": "AQUÍ ESTÁS — DemianVelo | Video Oficial | Canción Cristiana",
              "description": "“Aquí Estás” es una canción cristiana original de DemianVelo sobre sentir la presencia de Dios en cada momento.\n\nUna alabanza contemporánea, íntima y esperanzadora para recordar que Jesús permanece cerca, trae paz y vuelve a levantar el corazón.\n\nSuscribite a DemianVelo y compartí esta canción con alguien que necesite esperanza hoy.\n\nDios Habla Hoy",
              "hashtags": ["#DemianVelo", "#AquiEstas", "#MusicaCristiana", "#Jesus", "#Dios"],
              "tags": ["DemianVelo", "Aquí Estás", "música cristiana", "Dios Habla Hoy", "Jesús", "video oficial", "alabanza cristiana", "canción cristiana 2026", "música de fe"],
              "duration_minutes": 4,
              "music_engine_used": "ACE-Step",
              "visual_engine_used": "Wan2.2",
          }
          video_id = upload_long_video(channel, metadata, video, thumbnail_path=thumb, expected_minutes=4)
          result = {
              "status": "uploaded",
              "video_id": video_id,
              "url": f"https://youtu.be/{video_id}",
              "title": metadata["title"],
              "thumbnail_upload_status": metadata.get("thumbnail_upload_status"),
          }
          Path("release/youtube-result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("YOUTUBE_OK", json.dumps(result, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aqui-estas-demianvelo-release
          path: release/
          if-no-files-found: error
          retention-days: 7
