name: Start both channels safely

on:
  workflow_dispatch:
  push:
    paths:
      - "state/kickoff-both.txt"

permissions:
  contents: write

concurrency:
  group: youtube-ai-kickoff-both
  cancel-in-progress: false

jobs:
  generate-both:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.6-flash
      VIDEO_PROVIDER: procedural
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install renderer and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate BrotaVida Short, title and description
        env:
          CHANNEL: brotavida
        run: |
          python scripts/check_ready.py --generation-only
          python -m app.pipeline --channel brotavida --dry-run

      - name: Generate Dinero Claro Short, title and description
        env:
          CHANNEL: dineroclaro
        run: |
          python scripts/check_ready.py --generation-only
          python -m app.pipeline --channel dineroclaro --dry-run

      - name: Save both generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kickoff-both-${{ github.run_id }}
          path: output/
          retention-days: 3

      - name: Persist anti-duplicate history once
        run: |
          git config user.name "youtube-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/history.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "chore: record dual-channel kickoff"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
