name: BrotaVida watchdog

on:
  workflow_dispatch:
  schedule:
    # Cada 15 minutos aprox., Argentina UTC-3.
    - cron: "11,26,41,56 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/brotavida_watchdog.py"
      - ".github/workflows/brotavida-watchdog.yml"

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: brotavida-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Calculate today's BrotaVida deficit
        id: plan
        shell: bash
        run: |
          REPORT="$(python scripts/brotavida_watchdog.py)"
          echo "$REPORT"
          MISSING="$(printf '%s' "$REPORT" | python -c 'import json,sys; print(json.load(sys.stdin)["missing"])')"
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"

      - name: Recover one missing BrotaVida Short
        if: steps.plan.outputs.missing != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ACTIVE="$(gh run list -R "$GITHUB_REPOSITORY" --workflow shorts.yml --limit 30 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
          if [ "$ACTIVE" -gt 0 ]; then
            echo "Hay $ACTIVE Short(s) en cola/ejecucion; espero al siguiente control para evitar duplicados."
            exit 0
          fi
          echo "Faltan ${{ steps.plan.outputs.missing }} Short(s) de BrotaVida; recuperando uno."
          gh workflow run shorts.yml \
            -R "$GITHUB_REPOSITORY" \
            --ref main \
            -f channel=brotavida \
            -f content_mode=asmr \
            -f dry_run=false

      - name: Report recovery failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create \
            -R "$GITHUB_REPOSITORY" \
            --title "BrotaVida watchdog necesita atencion" \
            --body "El watchdog no pudo recuperar un Short faltante. Revisar Actions run $GITHUB_RUN_ID."
