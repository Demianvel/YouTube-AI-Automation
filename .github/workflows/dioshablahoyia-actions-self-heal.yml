name: Dios Habla Hoy IA - Actions self-heal

on:
  # Desactivado el reintento automatico: triplicaba los minutos de Actions
  # en cada fallo de un job de hasta 90 min. Ejecutar a mano si hace falta.
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID del run a reintentar"
        required: true

permissions:
  actions: write
  contents: read

jobs:
  retry-runner-failure:
    if: ${{ inputs.run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retry failed emergency run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          ATTEMPT: manual
        run: |
          set -euo pipefail
          echo "Emergency run $RUN_ID failed on attempt $ATTEMPT. Requesting automatic retry."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs"
          echo "Automatic retry requested."
