name: Dios Habla Hoy IA - Actions self-heal

on:
  workflow_run:
    workflows:
      - Dios Habla Hoy IA - Algenib emergency publish
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry-runner-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retry failed emergency run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          echo "Emergency run $RUN_ID failed on attempt $ATTEMPT. Requesting automatic retry."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs"
          echo "Automatic retry requested."
