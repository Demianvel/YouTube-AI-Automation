name: Validate automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VIDEO_PROVIDER: procedural
      MUSIC_PROVIDER: synth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q app scripts
      - name: Validate channel configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('config/channels.json').read_text(encoding='utf-8'))
          assert set(data) == {'brotavida', 'dineroclaro'}
          assert data['brotavida']['scenes_per_short'] == 1
          assert data['brotavida']['scene_seconds'] == 8
          assert data['brotavida']['audio_mode'] == 'music_only'
          assert 'photoreal' in data['brotavida']['visual_mode']
          assert data['dineroclaro']['scenes_per_short'] == 3
          assert data['dineroclaro']['scene_seconds'] == 8
          assert data['dineroclaro']['audio_mode'] == 'voice_music'
          assert 'photoreal' in data['dineroclaro']['visual_mode']
          for cfg in data.values():
              assert cfg['token_env'].startswith('YOUTUBE_TOKEN_')
          print('premium configuration OK')
          PY
      - name: Smoke test local fallback without paid APIs
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install Pillow
          python - <<'PY'
          from pathlib import Path
          from app.video import generate_short
          plant = {
              'handle': '@BrotaVidaAI',
              'scenes_per_short': 1,
              'scene_seconds': 1,
              'audio_mode': 'music_only',
              'visual_mode': 'photoreal_botanical_growth',
          }
          meta = {
              'topic': 'girasol desde semilla hasta planta adulta',
              'title': 'Asi despierta un girasol',
              'hook': 'La semilla comienza a abrirse',
              'scenes': [{'narration': ''}],
          }
          result = generate_short(plant, meta, Path('/tmp/plant-smoke'))
          assert result.exists() and result.stat().st_size > 1000
          print('fallback renderer OK')
          PY
