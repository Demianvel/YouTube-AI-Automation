name: Validate automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VIDEO_PROVIDER: procedural
      MUSIC_PROVIDER: local
      TTS_PROVIDER: kokoro
      KOKORO_VOICE: em_alex
      KOKORO_SPEED: "0.95"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Compile Python
        run: python -m compileall -q app scripts
      - name: Validate channel configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('config/channels.json').read_text(encoding='utf-8'))
          assert set(data) == {'brotavida', 'dineroclaro'}
          assert data['brotavida']['scenes_per_short'] == 1
          assert data['brotavida']['scene_seconds'] == 8
          assert data['brotavida']['audio_mode'] == 'music_only'
          assert 'botanical' in data['brotavida']['visual_mode']
          assert data['dineroclaro']['scenes_per_short'] == 3
          assert data['dineroclaro']['scene_seconds'] == 8
          assert data['dineroclaro']['audio_mode'] == 'voice_music'
          assert 'finance' in data['dineroclaro']['visual_mode']
          for cfg in data.values():
              assert cfg['token_env'].startswith('YOUTUBE_TOKEN_')
          print('channel configuration OK')
          PY
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify Kokoro Spanish voice generation
        run: |
          python - <<'PY'
          import numpy as np
          import soundfile as sf
          from pathlib import Path
          from kokoro import KPipeline
          pipeline = KPipeline(lang_code='e')
          chunks = []
          for _g, _p, audio in pipeline('Hola. Esta es una prueba clara de voz en castellano para Dinero Claro.', voice='em_alex', speed=0.95):
              if audio is not None and len(audio):
                  chunks.append(np.asarray(audio, dtype=np.float32))
          assert chunks, 'Kokoro no genero audio'
          out = Path('/tmp/kokoro-test.wav')
          sf.write(out, np.concatenate(chunks), 24000, subtype='PCM_16')
          assert out.exists() and out.stat().st_size > 5000
          print('Kokoro Spanish OK:', out.stat().st_size, 'bytes')
          PY
      - name: Smoke test local plant renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.video import generate_short
          plant = {
              'handle': '@BrotaVidaAI',
              'scenes_per_short': 1,
              'scene_seconds': 1,
              'audio_mode': 'music_only',
              'visual_mode': 'photoreal_botanical_growth',
          }
          meta = {
              'topic': 'crecimiento real de una planta',
              'title': 'Asi despierta una semilla',
              'hook': 'La semilla comienza a abrirse',
              'scenes': [{'stock_query': 'seed germination timelapse', 'narration': ''}],
          }
          result = generate_short(plant, meta, Path('/tmp/plant-smoke'))
          assert result.exists() and result.stat().st_size > 1000
          print('local renderer OK')
          PY
