name: Validate automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-automation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VIDEO_PROVIDER: procedural
      MUSIC_PROVIDER: local
      TTS_PROVIDER: chatterbox
      TTS_FALLBACK_KOKORO: "true"
      KOKORO_VOICE: em_alex
      KOKORO_SPEED: "0.95"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Compile Python
        run: python -m compileall -q app scripts
      - name: Validate channel configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('config/channels.json').read_text(encoding='utf-8'))
          required = {'brotavida', 'dineroclaro', 'envikids', 'demianvelo', 'dioshablahoyia'}
          assert required.issubset(data), f"Faltan canales requeridos: {sorted(required - set(data))}"
          assert data['brotavida']['audio_mode'] == 'voice_music'
          assert data['brotavida']['require_real_video'] is True
          assert data['dineroclaro']['audio_mode'] == 'voice_music'
          assert data['dineroclaro']['require_real_video'] is False
          assert data['dineroclaro']['visual_mode'] == 'mixed_finance_entertainment'
          assert data['envikids']['audio_mode'] == 'voice_music'
          assert data['envikids']['made_for_kids'] is True
          assert data['envikids']['visual_mode'] == 'generated_3d_kids'
          assert data['envikids']['handle'].lower() == '@envikidsai'
          assert data['demianvelo']['handle'].lower() == '@demianvelo'
          assert data['demianvelo']['category_id'] == '10'
          assert data['demianvelo']['require_real_video'] is False
          spiritual = data['dioshablahoyia']
          assert spiritual['handle'].lower() == '@dioshablahoyia'
          assert spiritual['token_env'] == 'YOUTUBE_TOKEN_DIOSHABLAHOYIA'
          assert spiritual['audio_mode'] == 'voice_music'
          assert spiritual['visual_mode'] == 'generated_jesus_spiritual'
          assert spiritual['made_for_kids'] is False
          assert spiritual['contains_synthetic_media'] is True
          assert spiritual['require_real_video'] is False
          assert int(spiritual['scenes_per_short']) >= 3
          assert int(spiritual['scene_seconds']) >= 6
          prompt = spiritual['master_prompt'].lower()
          for keyword in ('biblia', 'jesus', 'oracion', 'profecias', 'sin logos'):
              assert keyword in prompt, f"Falta regla espiritual en master_prompt: {keyword}"
          for cfg in data.values():
              assert cfg['token_env'].startswith('YOUTUBE_TOKEN_')
          print('required channel configuration OK:', ', '.join(sorted(required)))
          PY
      - name: Install media and base Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 fonts-dejavu-core git
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify original DemianVelo music synthesis
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.music_audio import generate_original_electronic_track
          out = Path('/tmp/demianvelo-music-test.wav')
          generate_original_electronic_track(out, 8, 12345, bpm=128, style='progressive_house', faith_theme=False)
          assert out.exists() and out.stat().st_size > 100000
          print('original music synthesis OK:', out.stat().st_size)
          PY
      - name: Verify Kokoro Spanish fallback
        run: |
          python - <<'PY'
          import numpy as np
          import soundfile as sf
          from pathlib import Path
          from kokoro import KPipeline
          pipeline = KPipeline(lang_code='e')
          chunks = []
          for _g, _p, audio in pipeline('Hola. Esta es una prueba de respaldo en castellano.', voice='em_alex', speed=0.95):
              if audio is not None and len(audio):
                  chunks.append(np.asarray(audio, dtype=np.float32))
          assert chunks, 'Kokoro no genero audio'
          out = Path('/tmp/kokoro-test.wav')
          sf.write(out, np.concatenate(chunks), 24000, subtype='PCM_16')
          assert out.exists() and out.stat().st_size > 5000
          print('Kokoro Spanish fallback OK:', out.stat().st_size)
          PY
      - name: Install official Chatterbox V3 with CPU PyTorch
        run: |
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-chatterbox.txt
      - name: Verify Chatterbox Multilingual V3 Spanish
        run: |
          python - <<'PY'
          import torchaudio as ta
          from pathlib import Path
          from chatterbox.mtl_tts import ChatterboxMultilingualTTS
          model = ChatterboxMultilingualTTS.from_pretrained(device='cpu', t3_model='v3')
          wav = model.generate('Hola. Esta es una prueba de voz natural y profesional en español.', language_id='es')
          out = Path('/tmp/chatterbox-v3-test.wav')
          ta.save(str(out), wav.cpu(), model.sr)
          assert out.exists() and out.stat().st_size > 5000
          print('Chatterbox V3 Spanish OK: CPU', out.stat().st_size)
          PY
      - name: Smoke test local Dinero Claro premium renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.video import generate_short
          finance = {
              'handle': '@DineroClaroAi',
              'scenes_per_short': 1,
              'scene_seconds': 1,
              'audio_mode': 'music_only',
              'visual_mode': 'finance_animation_test',
          }
          meta = {
              'topic': 'margen de un emprendimiento',
              'title': 'Entende tu margen',
              'hook': 'Vender mas no siempre significa ganar mas',
              'scenes': [{'visual_prompt': 'animated finance dashboard', 'stock_query': 'small business finance', 'narration': ''}],
          }
          result = generate_short(finance, meta, Path('/tmp/finance-smoke'))
          assert result.exists() and result.stat().st_size > 1000
          print('local finance renderer OK')
          PY
      - name: Validate BrotaVida refuses synthetic plant fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.video import generate_short
          plant = {
              'handle': '@BrotaVidaAI',
              'scenes_per_short': 1,
              'scene_seconds': 1,
              'audio_mode': 'music_only',
              'visual_mode': 'real_botanical_timelapse',
              'require_real_video': True,
          }
          meta = {
              'topic': 'germinacion de girasol',
              'title': 'Girasol desde semilla',
              'hook': 'Mira como despierta',
              'scenes': [{'visual_prompt': 'sunflower seed germination timelapse', 'stock_query': 'sunflower seed germination timelapse', 'narration': ''}],
          }
          try:
              generate_short(plant, meta, Path('/tmp/plant-policy-smoke'))
          except RuntimeError as exc:
              message = str(exc).lower()
              assert 'no permite plantas sinteticas' in message or 'requiere pexels_api_key' in message
              print('BrotaVida real-footage policy OK:', exc)
          else:
              raise AssertionError('BrotaVida no debe aceptar un fallback sintetico en validacion local')
          PY
