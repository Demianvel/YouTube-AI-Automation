name: Dios Habla Hoy IA - Reparar miniatura Short

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "triggers/dioshablahoyia-repair-thumbnail.json"

permissions:
  contents: write

concurrency:
  group: dioshablahoyia-thumbnail-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      TZ: America/Argentina/Buenos_Aires
      YOUTUBE_TOKEN_DIOSHABLAHOYIA: ${{ secrets.YOUTUBE_TOKEN_DIOSHABLAHOYIA }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_KEY || secrets.OPENAI_API_TOKEN || secrets.OPENAI_TOKEN || secrets.CHATGPT_API_KEY }}
      OPENAI_IMAGE_MODEL: gpt-image-2
      SPIRITUAL_THUMBNAIL_DHASH_MIN_DISTANCE: "20"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install thumbnail repair runtime
        run: |
          python -m pip install -q --upgrade pip
          pip install -q \
            "google-api-python-client>=2.170.0" \
            "google-auth>=2.40.0" \
            "Pillow>=11.0.0" \
            "requests>=2.32.0"
          python -m py_compile app/spiritual_auto_thumbnail.py scripts/probe_openai_image_api.py scripts/repair_dios_short_thumbnail.py

      - name: Probe OpenAI image provider
        run: python scripts/probe_openai_image_api.py || true

      - name: Repair and verify custom thumbnail
        run: |
          test -n "$YOUTUBE_TOKEN_DIOSHABLAHOYIA"
          python scripts/repair_dios_short_thumbnail.py \
            --request triggers/dioshablahoyia-repair-thumbnail.json

      - name: Persist verified thumbnail status
        shell: bash
        run: |
          git config user.name youtube-ai-bot
          git config user.email actions@users.noreply.github.com
          cp state/history.jsonl /tmp/history-repaired.jsonl
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/history-repaired.jsonl state/history.jsonl
            git add state/history.jsonl
            git diff --cached --quiet && exit 0
            git commit -m "chore: persist verified Short thumbnail repair"
            git push origin HEAD:main && exit 0
          done
          exit 1

      - name: Upload repair artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dioshablahoyia-thumbnail-repair-${{ github.run_id }}
          path: output/dioshablahoyia-thumbnail-repair/
          retention-days: 3
