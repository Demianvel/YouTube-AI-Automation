name: Dios Habla Hoy IA - Extra quality test Short

on:
  push:
    branches: [main]
    paths:
      - "triggers/dioshablahoyia-extra-quality-test.txt"

permissions:
  contents: write
  issues: write

concurrency:
  group: dioshablahoyia-short-publisher
  cancel-in-progress: false

jobs:
  publish_one_extra_test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      TZ: America/Argentina/Buenos_Aires
      CHANNEL: dioshablahoyia
      CONTENT_MODE: voice
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.6-flash
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Algenib
      GEMINI_TTS_MAX_ATTEMPTS: "4"
      SPIRITUAL_MALE_GEMINI_VOICE: Algenib
      SPIRITUAL_VOICE_PROFILE: voz_de_luz_serena_original_v1
      SPIRITUAL_VOICE_BRAND: Voz de Luz
      SPIRITUAL_VOICE_REFERENCE_MODE: fixed_original_identity_no_speaker_clone
      SPIRITUAL_VOICE_LOCKED: "true"
      SPIRITUAL_VOICEOVER_MODE: "true"
      SPIRITUAL_REQUIRE_PRIMARY_VOICE: "true"
      SPIRITUAL_SHORT_SECONDS: "60"
      SPIRITUAL_SHORT_SCENE_SECONDS: "10"
      SPIRITUAL_SHORT_AI_CLIPS: "0"
      SPIRITUAL_ALLOW_STILL_FALLBACK: "true"
      SPIRITUAL_FAST_RENDER: "true"
      SPIRITUAL_VISUAL_VARIETY_LEVEL: maximum
      SPIRITUAL_EDITORIAL_VARIETY_LEVEL: high
      SPIRITUAL_CTA_OVERLAY: "false"
      SPIRITUAL_REQUIRE_FRESH_VISUAL: "true"
      SPIRITUAL_VISUAL_REFERENCE_LOCKED: "true"
      SPIRITUAL_VISUAL_REFERENCE_PROFILE: realistic_jesus_reference_abc_v1
      SPIRITUAL_ALLOW_SYMBOLIC_JESUS_FALLBACK: "false"
      SPIRITUAL_ALLOW_LOCAL_PROCEDURAL_VISUAL: "false"
      TTS_PROVIDER: gemini_tts
      TTS_FALLBACK_KOKORO: "false"
      GEMINI_VIDEO_ENABLED: "false"
      HF_VIDEO_ENABLED: "false"
      HF_REFERENCE_IMAGE_ENABLED: "true"
      HF_REFERENCE_EDITOR_ENABLED: "true"
      HF_REFERENCE_ZERO_SPACE: black-forest-labs/FLUX.1-Kontext-Dev
      HF_TEXT_ZERO_ENABLED: "false"
      HF_REFERENCE_ZERO_SPACE_FIRST: "true"
      HF_ZERO_AUTH_RETRY: "true"
      HF_REMOTE_CIRCUIT_BREAKER: "true"
      HF_INFERENCE_PROVIDER_ENABLED: "false"
      HF_ZERO_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_TOKEN: ""
      SPIRITUAL_REFERENCE_AVOID_RECENT: "100"
      DIOS_FAST_LOCAL_VISUAL_MODE: "false"
      MUSIC_PROVIDER: local
      YOUTUBE_TOKEN_DIOSHABLAHOYIA: ${{ secrets.YOUTUBE_TOKEN_DIOSHABLAHOYIA }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install strict quality runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1 fonts-dejavu-core git >/dev/null
          python -m pip install -q --upgrade pip
          pip install -q \
            "google-genai>=2.3.0" \
            "google-api-python-client>=2.170.0" \
            "google-auth>=2.40.0" \
            "google-auth-oauthlib>=1.2.2" \
            "Pillow>=11.0.0" \
            "requests>=2.32.0" \
            "numpy<3,>=1.26" \
            "soundfile>=0.13.1" \
            "huggingface_hub<2,>=0.34.4" \
            "gradio_client<3,>=1.11.0"

      - name: Verify permanent quality identity
        run: |
          test -n "$GEMINI_API_KEY"
          test -n "$YOUTUBE_TOKEN_DIOSHABLAHOYIA"
          test -n "$HF_ZERO_TOKEN"
          test "$GEMINI_TTS_VOICE" = "Algenib"
          test "$SPIRITUAL_MALE_GEMINI_VOICE" = "Algenib"
          test "$SPIRITUAL_VOICE_BRAND" = "Voz de Luz"
          test "$SPIRITUAL_VOICE_PROFILE" = "voz_de_luz_serena_original_v1"
          test "$SPIRITUAL_REQUIRE_PRIMARY_VOICE" = "true"
          test "$SPIRITUAL_VOICE_LOCKED" = "true"
          test "$TTS_PROVIDER" = "gemini_tts"
          test "$TTS_FALLBACK_KOKORO" = "false"
          test "$SPIRITUAL_VISUAL_REFERENCE_LOCKED" = "true"
          test "$SPIRITUAL_ALLOW_SYMBOLIC_JESUS_FALLBACK" = "false"
          test "$SPIRITUAL_ALLOW_LOCAL_PROCEDURAL_VISUAL" = "false"
          for ref in \
            assets/dioshablahoyia/reference/jesus_reference_a.jpg \
            assets/dioshablahoyia/reference/jesus_reference_b.jpg \
            assets/dioshablahoyia/reference/jesus_reference_c.jpg; do
            test -s "$ref"
          done
          python -m py_compile scripts/publish_dios_locked.py app/spiritual_tts.py app/spiritual_reference_generation.py app/pipeline.py

      - name: Publish exactly one extra quality-test Short
        run: python scripts/publish_dios_locked.py

      - name: Verify uploaded identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('state/history.jsonl').read_text(encoding='utf-8').splitlines()[-1])
          used = str(row.get('tts_provider_used') or '').lower()
          providers = row.get('generated_visual_provider') or row.get('visual_providers') or []
          if isinstance(providers, str): providers = [providers]
          if row.get('status') != 'uploaded' or not row.get('video_id'):
              raise SystemExit('No se confirmo upload')
          if 'algenib' not in used or 'gemini' not in used or 'kokoro' in used or 'fallback' in used:
              raise SystemExit(f'VOICE_IDENTITY_LOCK fallo: {used}')
          if not providers or any('dios-realistic-reference-lock-v1' not in str(x) for x in providers):
              raise SystemExit(f'VISUAL_IDENTITY_LOCK fallo: {providers}')
          print('UPLOAD_OK', row.get('video_id'), row.get('title'))
          PY

      - name: Persist test publication history
        if: success()
        run: |
          RECORD="$(tail -n 1 state/history.jsonl)"
          VIDEO_ID="$(printf '%s' "$RECORD" | python -c 'import json,sys; print(json.load(sys.stdin).get("video_id", ""))')"
          git config user.name youtube-ai-bot
          git config user.email actions@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            touch state/history.jsonl
            if [ -n "$VIDEO_ID" ] && grep -Fq "\"video_id\": \"$VIDEO_ID\"" state/history.jsonl; then exit 0; fi
            printf '%s\n' "$RECORD" >> state/history.jsonl
            git add state/history.jsonl
            git commit -m "chore: persist extra quality-test Short"
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1

      - name: Open issue on quality-test failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Dios Habla Hoy - fallo prueba extra de calidad" --body "La prueba extra se nego a publicar fuera de Voz de Luz / Algenib o del banco visual realista. Revisar Actions run $GITHUB_RUN_ID."
