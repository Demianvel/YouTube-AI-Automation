name: Validate Dios Habla Hoy automation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/spiritual_*.py"
      - "scripts/dioshablahoyia_watchdog.py"
      - "config/dioshablahoyia_bible_references.json"
      - "assets/dioshablahoyia/reference/*.jpg"
      - ".github/workflows/dioshablahoyia-*.yml"
      - ".github/workflows/shorts.yml"
      - ".github/workflows/analytics-monitor.yml"
      - ".github/workflows/validate-dios-growth.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight validation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q "pillow>=11" requests "numpy>=1.26,<3" "huggingface_hub>=0.34.4,<2" "gradio_client>=1.11,<3"

      - name: Compile spiritual Python modules
        run: |
          python -m compileall -q app scripts/dioshablahoyia_watchdog.py

      - name: Validate continuous voice quality gate
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y -loglevel error -f lavfi -i "sine=frequency=180:sample_rate=48000:duration=9.90" -ac 1 /tmp/voice-ok.wav
          python - <<'PY'
          from pathlib import Path
          from app.spiritual_continuity import fit_and_validate_spiritual_voice
          stats = fit_and_validate_spiritual_voice(Path('/tmp/voice-ok.wav'), 10.0, max_silence_seconds=2.2)
          assert stats['voice_continuity_passed'] is True
          assert stats['voice_coverage_ratio'] >= 0.96
          print('Continuity positive test OK:', stats)
          PY
          ffmpeg -y -loglevel error -f lavfi -i "sine=frequency=180:sample_rate=48000:duration=2" -ac 1 /tmp/voice-too-short.wav
          python - <<'PY'
          from pathlib import Path
          from app.spiritual_continuity import fit_and_validate_spiritual_voice
          try:
              fit_and_validate_spiritual_voice(Path('/tmp/voice-too-short.wav'), 10.0)
          except RuntimeError as exc:
              assert 'BLOQUEADO' in str(exc)
              print('Continuity negative test OK:', exc)
          else:
              raise AssertionError('Una voz demasiado corta no fue bloqueada')
          PY

      - name: Validate CTA filters with real FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          ffmpeg -y -loglevel error -f lavfi -i color=c=black:s=1080x1920:r=30:d=2 \
            -vf "drawbox=x=iw*0.11:y=ih*0.79:w=iw*0.78:h=150:color=black@0.62:t=fill,drawtext=fontfile='$FONT':text='SUSCRIBITE  |  COMPARTI  |  AMEN':fontcolor=white:fontsize=48:x=(w-text_w)/2:y=h*0.82" \
            -t 2 -c:v libx264 -pix_fmt yuv420p /tmp/cta-short.mp4
          ffmpeg -y -loglevel error -f lavfi -i color=c=black:s=1920x1080:r=30:d=2 \
            -vf "drawbox=x=iw*0.18:y=ih*0.80:w=iw*0.64:h=100:color=black@0.55:t=fill,drawtext=fontfile='$FONT':text='SUSCRIBITE  |  COMPARTI  |  AMEN':fontcolor=white:fontsize=38:x=(w-text_w)/2:y=h*0.825" \
            -t 2 -c:v libx264 -pix_fmt yuv420p /tmp/cta-long.mp4
          test -s /tmp/cta-short.mp4
          test -s /tmp/cta-long.mp4
          echo "CTA FFmpeg filters OK"

      - name: Validate zero-credit photoreal references
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from app.spiritual_image import _local_reference
          refs = sorted(Path('assets/dioshablahoyia/reference').glob('jesus_reference_*.jpg'))
          valid = []
          for ref in refs:
              try:
                  with Image.open(ref) as image:
                      image.verify()
                  valid.append(ref)
              except Exception as exc:
                  print(f'Referencia inválida ignorada: {ref} ({exc})')
          assert len(valid) >= 3, [str(x) for x in valid]
          out = Path('/tmp/dios-local-fallback.jpg')
          provider = _local_reference(out, 20260815)
          assert out.exists() and out.stat().st_size > 20_000
          assert provider.startswith('local_project_jesus_reference/'), provider
          print('Zero-credit photoreal fallback OK:', provider, out.stat().st_size)
          PY

      - name: Validate resilient long-script targets
        run: |
          python - <<'PY'
          from app.spiritual_long_local_metadata import generate_local_long_metadata
          for minutes in (10, 15, 25, 30):
              data = generate_local_long_metadata({"display_name":"Dios Habla Hoy IA"}, minutes)
              sections = data.get("sections") or []
              assert len(sections) == max(5, minutes // 2), (minutes, len(sections))
              words = sum(len(str(x.get("narration") or "").split()) for x in sections)
              assert words >= minutes * 105, (minutes, words)
              assert all(x.get("bible_reference") for x in sections)
              print(f"{minutes} min OK: sections={len(sections)}, words={words}")
          PY

      - name: Validate watchdog plan
        run: |
          python scripts/dioshablahoyia_watchdog.py

      - name: Validate expected daily schedules
        shell: bash
        run: |
          grep -q 'MINUTES="10"' .github/workflows/dioshablahoyia-long.yml
          grep -q 'MINUTES="15"' .github/workflows/dioshablahoyia-long.yml
          grep -q 'MINUTES="25"' .github/workflows/dioshablahoyia-long.yml
          grep -q 'MINUTES="30"' .github/workflows/dioshablahoyia-long.yml
          ! grep -q 'MINUTES="5"' .github/workflows/dioshablahoyia-long.yml
          grep -q '10 Shorts diarios' .github/workflows/dioshablahoyia-shorts-5min.yml
          echo "Daily schedule validation OK"