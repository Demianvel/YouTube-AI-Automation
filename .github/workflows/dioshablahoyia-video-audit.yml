name: Dios Habla Hoy IA - Auditoria videos

on:
  push:
    paths:
      - triggers/dioshablahoyia-video-audit.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      YOUTUBE_TOKEN_DIOSHABLAHOYIA: ${{ secrets.YOUTUBE_TOKEN_DIOSHABLAHOYIA }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audit dependencies
        run: |
          python -m pip install -q "google-api-python-client>=2.170.0" "google-auth>=2.40.0" "google-auth-oauthlib>=1.2.2"

      - name: Run read-only YouTube audit
        run: |
          python scripts/audit_dios_youtube_inventory.py

      - name: Persist audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/dioshablahoyia_video_audit.json
          if git diff --cached --quiet; then
            echo "No audit changes"
          else
            git commit -m "chore: update Dios YouTube video audit"
            git push origin HEAD:main
          fi
