name: Validate Dios Growth Engine

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/youtube_growth_engine.py"
      - "app/youtube_niche_radar.py"
      - "app/fast_spiritual_metadata.py"
      - "scripts/growth_learn.py"
      - "scripts/growth_radar.py"
      - "config/dioshablahoyia_growth_radar.json"
      - ".github/workflows/dioshablahoyia-growth-engine.yml"
      - ".github/workflows/validate-dios-growth-engine.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight dependencies
        run: pip install -q google-api-python-client google-auth

      - name: Compile Growth Engine
        run: |
          python -m py_compile \
            app/youtube_growth_engine.py \
            app/youtube_niche_radar.py \
            app/fast_spiritual_metadata.py \
            scripts/growth_learn.py \
            scripts/growth_radar.py

      - name: Validate learning and fail-open selection
        run: |
          python - <<'PY'
          from app.youtube_growth_engine import build_growth_profile, candidate_growth_score, ranked_theme_indices
          from app.fast_spiritual_metadata import THEMES, build_fast_metadata

          snapshot = {
              "analytics_api_available": True,
              "reports": {"top_videos": [
                  {"video":"winner", "title":"Paz en la tormenta", "publishedAt":"2026-08-19T00:00:00Z", "views":12000, "engagedViews":9000, "averageViewPercentage":91, "likes":1200, "comments":180, "shares":140, "subscribersGained":70, "like_rate":.10, "comment_rate":.015, "share_rate":.0117, "subscriber_gain_rate":.0058},
                  {"video":"base", "title":"Reflexión diaria", "publishedAt":"2026-08-10T00:00:00Z", "views":400, "likes":14, "comments":2, "like_rate":.035, "comment_rate":.005},
              ]},
              "warnings": [],
          }
          history = [
              {"video_id":"winner", "status":"uploaded", "bible_reference":"Marcos 4:39-40", "content_family":"Marcos 4 y Jesus calma la tormenta", "topic":"paz en la tormenta"},
              {"video_id":"base", "status":"uploaded", "bible_reference":"Salmo 27:13-14", "content_family":"Salmo 27 y esperar con confianza", "topic":"espera"},
          ]
          profile = build_growth_profile(snapshot, history)
          assert profile["fail_open"] is True
          assert profile["publishing_must_continue"] is True
          assert len(profile["top_outliers"]) == 2
          assert profile["top_outliers"][0]["growth_score"] >= profile["top_outliers"][1]["growth_score"]

          score, reasons = candidate_growth_score(
              family="Marcos 4 y Jesus calma la tormenta",
              reference="Marcos 4:39-40",
              truth="Jesús está presente en la tormenta",
              practice="confiar y actuar con prudencia",
              previous=[],
              profile=profile,
          )
          assert 0 <= score <= 100
          assert reasons
          ranked = ranked_theme_indices(THEMES, [], 12345, profile=profile)
          assert len(ranked) == len(THEMES)

          # No profile must never stop metadata generation.
          base = {"scenes": [{"visual_prompt":"test"} for _ in range(6)]}
          result = build_fast_metadata(base, {"scenes_per_short":6}, [])
          assert result["title"]
          assert result["bible_reference"]
          assert len(result["scenes"]) == 6
          print("Growth Engine validation OK")
          PY
