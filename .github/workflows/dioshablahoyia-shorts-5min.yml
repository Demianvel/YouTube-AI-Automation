name: Dios Habla Hoy IA - 10 Shorts diarios

on:
  schedule:
    # Argentina UTC-3: 07:30, 09:00, 10:30, 12:00, 13:30,
    # 15:00, 16:30, 18:00, 19:30 y 21:00.
    - cron: "30 10,13,16,19,22 * * *"
    - cron: "0 0,12,15,18,21 * * *"
  workflow_dispatch:
  push:
    paths:
      - "triggers/dioshablahoyia-5min-now.txt"

permissions:
  actions: write
  contents: read

concurrency:
  group: dioshablahoyia-shorts-daily-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lanzar Short fotorrealista biblico
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Lanzando Short de @dioshablahoyia: $(date -u +%FT%TZ)"
          gh workflow run shorts.yml \
            -R "$GITHUB_REPOSITORY" \
            --ref main \
            -f channel=dioshablahoyia \
            -f content_mode=voice \
            -f dry_run=false
          echo "Generacion/publicacion solicitada correctamente."
