name: Dios Habla Hoy IA - 10 Shorts diarios

on:
  schedule:
    # Argentina UTC-3: 07:30, 09:00, 10:30, 12:00, 13:30,
    # 15:00, 16:30, 18:00, 19:30 y 21:00.
    - cron: "30 10,13,16,19,22 * * *"
    - cron: "0 0,12,15,18,21 * * *"
  workflow_dispatch:
  push:
    paths:
      - "triggers/dioshablahoyia-5min-now.txt"

permissions:
  actions: write
  contents: read

concurrency:
  group: dioshablahoyia-shorts-daily-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check daily 10-Short cap
        id: quota
        shell: bash
        run: |
          REPORT="$(python scripts/dioshablahoyia_watchdog.py)"
          echo "$REPORT"
          ACTUAL="$(printf '%s' "$REPORT" | python -c 'import json,sys; print(json.load(sys.stdin)["short_actual"])')"
          TARGET="$(printf '%s' "$REPORT" | python -c 'import json,sys; print(json.load(sys.stdin)["daily_short_target"])')"
          if [ "$ACTUAL" -ge "$TARGET" ]; then
            echo "launch=false" >> "$GITHUB_OUTPUT"
            echo "Ya hay $ACTUAL/$TARGET Shorts publicados hoy en Argentina; no se supera el tope diario."
          else
            echo "launch=true" >> "$GITHUB_OUTPUT"
            echo "Hay $ACTUAL/$TARGET Shorts publicados hoy; se habilita este slot."
          fi

      - name: Lanzar Short fotorrealista biblico
        if: steps.quota.outputs.launch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Lanzando Short de @dioshablahoyia: $(date -u +%FT%TZ)"
          gh workflow run shorts.yml \
            -R "$GITHUB_REPOSITORY" \
            --ref main \
            -f channel=dioshablahoyia \
            -f content_mode=voice \
            -f dry_run=false
          echo "Generacion/publicacion solicitada correctamente."

      - name: Daily target already complete
        if: steps.quota.outputs.launch != 'true'
        run: echo "Objetivo diario de 10 Shorts ya cumplido; este slot se omite."
