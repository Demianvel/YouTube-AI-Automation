name: Dios Habla Hoy IA - 10 Shorts diarios

on:
  schedule:
    # Watch hourly from 07:20 through 23:20 Argentina (UTC-3).
    # This is a watchdog, not an instruction to exceed the 10/day cap.
    - cron: "20 10-23 * * *"
    - cron: "20 0-2 * * *"
  workflow_dispatch:
  push:
    paths:
      - "triggers/dioshablahoyia-5min-now.txt"

permissions:
  actions: write
  contents: read

concurrency:
  group: dioshablahoyia-shorts-daily-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      TZ: America/Argentina/Buenos_Aires
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check real daily 10-Short target
        id: quota
        shell: bash
        run: |
          REPORT="$(python scripts/dioshablahoyia_watchdog.py)"
          echo "$REPORT"
          ACTUAL="$(printf '%s' "$REPORT" | python -c 'import json,sys; print(json.load(sys.stdin)["short_actual"])')"
          TARGET="$(printf '%s' "$REPORT" | python -c 'import json,sys; print(json.load(sys.stdin)["daily_short_target"])')"
          echo "actual=$ACTUAL" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          if [ "$ACTUAL" -ge "$TARGET" ]; then
            echo "launch=false" >> "$GITHUB_OUTPUT"
            echo "Objetivo completo: $ACTUAL/$TARGET Shorts reales hoy."
          else
            echo "launch=true" >> "$GITHUB_OUTPUT"
            echo "Faltan $((TARGET-ACTUAL)) Shorts: $ACTUAL/$TARGET confirmados."
          fi

      - name: Check active premium publishers
        if: steps.quota.outputs.launch == 'true'
        id: active
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          active_for() {
            gh run list -R "$GITHUB_REPOSITORY" --workflow "$1" --limit 20 --json status \
              --jq '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="in_progress")] | length' 2>/dev/null || echo 0
          }
          CANON="$(active_for dioshablahoyia-algenib-emergency.yml)"
          MANUAL="$(active_for dioshablahoyia-two-premium-now.yml)"
          if [ "$CANON" -gt 0 ] || [ "$MANUAL" -gt 0 ]; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            echo "Ya existe publisher premium activo (canonical=$CANON manual=$MANUAL); no se duplica."
          else
            echo "dispatch=true" >> "$GITHUB_OUTPUT"
            echo "No hay publisher activo; se habilita recuperacion premium."
          fi

      - name: Launch canonical premium hybrid recovery
        if: steps.quota.outputs.launch == 'true' && steps.active.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Solicitando recuperacion premium para completar ${ACTUAL:-${{ steps.quota.outputs.actual }}}/${TARGET:-${{ steps.quota.outputs.target }}} -> 10/10"
          gh workflow run dioshablahoyia-algenib-emergency.yml \
            -R "$GITHUB_REPOSITORY" \
            --ref main
          echo "Publisher premium Algenib/Qwen solicitado."

      - name: No launch required
        if: steps.quota.outputs.launch != 'true' || steps.active.outputs.dispatch != 'true'
        run: echo "Sin lanzamiento adicional: objetivo completo o publisher ya activo."
