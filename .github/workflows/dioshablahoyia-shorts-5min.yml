name: Dios Habla Hoy IA - 10 Shorts diarios

on:
  schedule:
    # Argentina UTC-3: 07:20, 09:20, 11:20, 13:20, 15:20, 17:20, 19:20, 21:20, 22:20, 23:20
    - cron: "20 10,12,14,16,18,20,22 * * *"
    - cron: "20 0,1,2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "triggers/dioshablahoyia-5min-now.txt"

permissions:
  actions: write
  contents: read

concurrency:
  group: dioshablahoyia-shorts-daily-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      TZ: America/Argentina/Buenos_Aires
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile and validate daily realistic visual guard
        run: |
          python -m py_compile \
            scripts/dioshablahoyia_watchdog.py \
            scripts/validate_dios_realistic_visual_policy.py \
            app/dios_realistic_visual_policy.py
          python scripts/validate_dios_realistic_visual_policy.py

      - name: Count confirmed Shorts
        id: quota
        shell: bash
        run: |
          REPORT="$(python scripts/dioshablahoyia_watchdog.py)"
          printf '%s\n' "$REPORT"
          ACTUAL="$(printf '%s' "$REPORT" | python -c 'import json,sys; print(int(json.load(sys.stdin)["short_actual"]))')"
          TARGET="$(printf '%s' "$REPORT" | python -c 'import json,sys; print(int(json.load(sys.stdin)["daily_short_target"]))')"
          echo "actual=$ACTUAL" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          if [ "$ACTUAL" -lt "$TARGET" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "Faltan $((TARGET-ACTUAL)) Shorts confirmados."
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
            echo "Objetivo diario completo: $ACTUAL/$TARGET."
          fi

      - name: Check premium publisher concurrency
        id: active
        if: steps.quota.outputs.missing == 'true'
        shell: bash
        run: |
          active_count() {
            gh run list -R "$GITHUB_REPOSITORY" --workflow "$1" --limit 30 --json status --jq '[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "in_progress")] | length'
          }
          CANONICAL="$(active_count dioshablahoyia-algenib-emergency.yml)"
          TWO_MANUAL="$(active_count dioshablahoyia-two-premium-now.yml)"
          ONE_MANUAL="$(active_count dioshablahoyia-one-premium-now.yml)"
          echo "canonical=$CANONICAL" >> "$GITHUB_OUTPUT"
          echo "two_manual=$TWO_MANUAL" >> "$GITHUB_OUTPUT"
          echo "one_manual=$ONE_MANUAL" >> "$GITHUB_OUTPUT"
          if [ "$CANONICAL" -eq 0 ] && [ "$TWO_MANUAL" -eq 0 ] && [ "$ONE_MANUAL" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Publisher premium ya activo; no se crea duplicado. canonical=$CANONICAL two_manual=$TWO_MANUAL one_manual=$ONE_MANUAL"
          fi

      - name: Dispatch canonical premium publisher
        if: steps.quota.outputs.missing == 'true' && steps.active.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Un push hecho con GITHUB_TOKEN NO dispara otros workflows, por eso
          # el archivo trigger nunca iniciaba el publisher. Se usa dispatch directo.
          # Perfil visual: realistic_biblical_premium_v5 (definido en el publisher).
          gh workflow run dioshablahoyia-algenib-emergency.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "Publisher Algenib iniciado para completar los Shorts faltantes."

      - name: Guard result
        if: always()
        shell: bash
        run: |
          echo "Confirmados al iniciar: ${{ steps.quota.outputs.actual || 'unknown' }}/${{ steps.quota.outputs.target || '10' }}"
          echo "El scheduler no supera 10/dia y no inicia un publisher si ya existe uno activo."
