name: Validate DHH Sovereign Local AI

on:
  pull_request:
    paths:
      - "app/dios_sovereign_ai.py"
      - "app/dios_sovereign_voice.py"
      - "app/dios_sovereign_packaging.py"
      - "app/dios_sovereign_scene.py"
      - "app/dios_sovereign_visual_v3.py"
      - "app/hf_primary_router.py"
      - "scripts/dios_sovereign_*.py"
      - "scripts/publish_dios_sovereign.py"
      - "scripts/dioshablahoyia_sovereign_catchup_shorts.py"
      - "config/dios_sovereign_ai.json"
      - "presets/dioshablahoyia_master_prompts.txt"
      - "models/dios_sovereign/**"
      - ".github/workflows/dios-sovereign-local-ai.yml"
      - ".github/workflows/dios-sovereign-bootstrap.yml"
      - ".github/workflows/dioshablahoyia-sovereign-hosted-catchup.yml"
      - ".github/workflows/validate-dios-sovereign-ai.yml"
      - "requirements-sovereign.txt"
  push:
    branches: [main]
    paths:
      - "app/dios_sovereign_ai.py"
      - "app/dios_sovereign_voice.py"
      - "app/dios_sovereign_packaging.py"
      - "app/dios_sovereign_scene.py"
      - "app/dios_sovereign_visual_v3.py"
      - "app/hf_primary_router.py"
      - "scripts/dios_sovereign_*.py"
      - "scripts/publish_dios_sovereign.py"
      - "scripts/dioshablahoyia_sovereign_catchup_shorts.py"
      - "config/dios_sovereign_ai.json"
      - "presets/dioshablahoyia_master_prompts.txt"
      - "models/dios_sovereign/**"
      - ".github/workflows/dioshablahoyia-sovereign-hosted-catchup.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight visual test runtime
        run: pip install -q "Pillow>=11.0.0" "numpy<3,>=1.26"
      - name: Compile sovereign Python sources
        run: |
          python -m py_compile \
            app/dios_sovereign_ai.py \
            app/dios_sovereign_voice.py \
            app/dios_sovereign_packaging.py \
            app/dios_sovereign_scene.py \
            app/dios_sovereign_visual_v3.py \
            app/hf_primary_router.py \
            scripts/dios_sovereign_bootstrap_weights.py \
            scripts/dios_sovereign_bootstrap_voice.py \
            scripts/dios_sovereign_prepare_dataset.py \
            scripts/dios_sovereign_train_lora.py \
            scripts/dioshablahoyia_sovereign_catchup_shorts.py \
            scripts/publish_dios_sovereign.py
      - name: Validate model manifest and approved references
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('config/dios_sovereign_ai.json').read_text(encoding='utf-8'))
          assert cfg['version'] == 'dhh-sovereign-v1'
          assert cfg['offline'] is True
          assert cfg['publication']['allow_remote_image_ai'] is False
          assert cfg['publication']['allow_remote_tts'] is False
          assert cfg['publication']['daily_shorts_target'] == 10
          assert cfg['publication']['weekend_long_target'] == 2
          refs = [Path(cfg['image']['reference_dir']) / name for name in cfg['image']['references']]
          for ref in refs:
              assert ref.exists() and ref.stat().st_size > 1000, ref
          assert cfg['voice']['exact_algenib'] is False
          prompt = Path('presets/dioshablahoyia_master_prompts.txt').read_text(encoding='utf-8')
          assert 'PROMPT MAESTRO SOBERANO PREMIUM V2' in prompt
          assert 'CREAR -> VALIDAR -> PUBLICAR -> REGISTRAR -> MEDIR -> COMPARAR -> APRENDER -> VARIAR -> MEJORAR' in prompt
          print('Sovereign manifest and master prompt OK')
          PY
      - name: Validate optional provider isolation and hosted dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          router = Path('app/hf_primary_router.py').read_text(encoding='utf-8')
          publisher = Path('scripts/publish_dios_sovereign.py').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/dioshablahoyia-sovereign-hosted-catchup.yml').read_text(encoding='utf-8')
          top_level = '\n'.join(line for line in router.splitlines() if line and not line.startswith((' ', '\t')))
          assert 'from .hf_video import' not in top_level
          assert 'from .spiritual_hf_video import' not in top_level
          assert 'from .gemini_spiritual_video import' not in top_level
          assert 'HF_VIDEO_ENABLED: "false"' in workflow
          assert 'GEMINI_VIDEO_ENABLED: "false"' in workflow
          assert 'SPIRITUAL_ALLOW_STILL_FALLBACK: "true"' in workflow
          assert '"gradio-client>=1.8.0"' in workflow
          assert 'sovereign_visual.generate_visual' in publisher
          print('Hosted sovereign isolation/config OK')
          PY
      - name: Validate sovereign voice guard policy
        run: |
          python - <<'PY'
          from pathlib import Path
          publisher = Path('scripts/publish_dios_sovereign.py').read_text(encoding='utf-8')
          continuity = Path('app/spiritual_continuity.py').read_text(encoding='utf-8')
          assert 'SOVEREIGN_MIN_VOICE_COVERAGE = 0.82' in publisher
          assert 'SOVEREIGN_MAX_VOICE_SILENCE_SECONDS = 1.15' in publisher
          assert 'youtube_module._enforce_spiritual_voice_guard = _enforce_sovereign_voice_upload_guard' in publisher
          assert 'min_coverage: float = 0.82' in continuity
          assert 'max_silence_seconds: float = 1.15' in continuity
          assert 'coverage < SOVEREIGN_MIN_VOICE_COVERAGE' in publisher
          print('Sovereign voice guard policy matches continuity validator')
          PY
      - name: Render six distinct local visual scenes
        env:
          GITHUB_RUN_ID: visual-diversity-ci
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import app.dios_visual_integrity as integrity
          from app.dios_sovereign_scene import render_unique_scene

          root = Path('.')
          cfg = json.loads(Path('config/dios_sovereign_ai.json').read_text(encoding='utf-8'))
          refs = [root / cfg['image']['reference_dir'] / name for name in cfg['image']['references']]
          empty = Path('/tmp/dhh-empty-history.jsonl')
          empty.write_text('', encoding='utf-8')
          integrity.SHORT_HISTORY = empty
          integrity.LONG_HISTORY = empty
          outdir = Path('/tmp/dhh-v3-scenes')
          outdir.mkdir(parents=True, exist_ok=True)
          prompts = [
              'Jesus praying beside an olive tree at sunrise',
              'Norwegian fjord under aurora borealis',
              'open Bible and rays of morning light',
              'clear river through a green valley',
              'narrow stone path illuminated ahead',
              'storm clouds opening to sunlight over the sea',
          ]
          hashes=[]
          for index, prompt in enumerate(prompts, 1):
              path = outdir / f'spiritual_generated_{index}.jpg'
              provider = render_unique_scene(path, prompt, 9000 + index, references=refs, width=360, height=640)
              assert path.exists() and path.stat().st_size > 5000
              assert 'fresh-distance:' in provider
              hashes.append(integrity.fingerprint_image(path)['dhash'])
          for i, left in enumerate(hashes):
              for right in hashes[i+1:]:
                  assert (int(left, 16) ^ int(right, 16)).bit_count() > 18
          print('Visual diversity v3 OK:', len(set(hashes)), 'unique scenes')
          PY
      - name: Validate premium packaging quality gate
        run: |
          python - <<'PY'
          from app.dios_sovereign_packaging import apply_premium_packaging
          meta = {
              'title': 'Una palabra para hoy | Juan 14:27',
              'topic': 'Juan 14 y la paz de Jesus',
              'content_family': 'paz de Jesus',
              'bible_reference': 'Juan 14:27',
              'hook': 'Si hoy necesitás paz, recordá esta enseñanza de Jesús.',
              'scenes': [{'narration': 'Dios puede acompañarte en este momento.'} for _ in range(6)],
          }
          out = apply_premium_packaging(meta, [])
          assert out['packaging_quality_gate_passed'] is True
          assert out['packaging_quality_score'] >= 72
          assert len(out['tags']) >= 8
          assert len(out['hashtags']) >= 3
          assert out['pinned_comment_candidate']
          assert out['master_prompt_sha256']
          print('Premium packaging gate OK:', out['packaging_quality_score'])
          PY
