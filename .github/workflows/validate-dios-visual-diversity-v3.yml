name: Validate Dios visual diversity v3

on:
  pull_request:
    paths:
      - "app/dios_visual_integrity.py"
      - "app/spiritual_visual_motion.py"
      - "app/spiritual_long_visual_variety.py"
      - "app/visual_variety_v3.py"
      - "scripts/publish_dios_fast.py"
      - "scripts/publish_dios_fast_local_emergency.py"
      - "scripts/publish_dios_long_fresh.py"
      - "scripts/validate_dios_visual_diversity_v3.py"
      - ".github/workflows/validate-dios-visual-diversity-v3.yml"
  push:
    branches: [main]
    paths:
      - "app/dios_visual_integrity.py"
      - "app/spiritual_visual_motion.py"
      - "app/spiritual_long_visual_variety.py"
      - "app/visual_variety_v3.py"
      - "scripts/publish_dios_fast.py"
      - "scripts/publish_dios_fast_local_emergency.py"
      - "scripts/publish_dios_long_fresh.py"
      - "scripts/validate_dios_visual_diversity_v3.py"
      - ".github/workflows/validate-dios-visual-diversity-v3.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation runtime
        run: |
          python -m pip install -q --upgrade pip
          pip install -q "Pillow>=11.0.0"
      - name: Compile visual pipeline
        run: |
          python -m py_compile \
            app/dios_visual_integrity.py \
            app/spiritual_visual_motion.py \
            app/spiritual_long_visual_variety.py \
            app/visual_variety_v3.py \
            scripts/publish_dios_fast.py \
            scripts/publish_dios_fast_local_emergency.py \
            scripts/publish_dios_long_fresh.py \
            scripts/validate_dios_visual_diversity_v3.py
      - name: Validate semantic, source and motion diversity
        run: python scripts/validate_dios_visual_diversity_v3.py
