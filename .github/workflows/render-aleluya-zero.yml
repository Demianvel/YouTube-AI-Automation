name: Render Aleluya FREE - ACE-Step + LTX-2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/render-aleluya-zero.yml
      - presets/demianvelo/aleluya_hallelujah.json
      - triggers/render-aleluya-zero.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-aleluya-zero
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install free remote clients and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -U gradio_client huggingface_hub

      - name: Generate song with free ACE-Step Space
        shell: bash
        run: |
          mkdir -p output/aleluya-zero/audio output/aleluya-zero/ltx output/aleluya-zero/final
          python - <<'PY'
          import json, os, shutil, sys
          from pathlib import Path
          from gradio_client import Client

          preset = json.loads(Path('presets/demianvelo/aleluya_hallelujah.json').read_text(encoding='utf-8'))
          outdir = Path('output/aleluya-zero/audio')
          outdir.mkdir(parents=True, exist_ok=True)

          token = os.getenv('HF_TOKEN') or None
          client = Client('ACE-Step/Ace-Step-v1.5', token=token, verbose=False)

          caption = (
              'Original Christian electronic worship, cinematic pop and progressive house, 122 BPM, '
              'warm deep original male singer in Argentine Spanish, intimate verses, emotional pre-chorus, '
              'large uplifting chorus, luminous electronic build and drop, modern polished production, '
              'hopeful spiritual atmosphere, no imitation of any real singer, no copyrighted melody or samples.'
          )
          query = 'Canción cristiana original Aleluya Hallelujah para DemianVelo, emotiva, moderna y cinematográfica.'
          lyrics = preset['lyrics']

          args = [
              'acestep-v15-turbo', # selected_model
              'custom',            # generation_mode
              query,               # simple_query_input
              'es',                # simple_vocal_language
              caption,             # custom caption/prompt
              lyrics,              # custom lyrics
              122,                 # bpm
              '',                  # key scale
              '4',                 # time signature
              'es',                # vocal language
              8,                   # inference steps
              7.0,                 # guidance scale
              True,                # random seed
              '-1',                # seed
              None,                # reference audio
              220,                 # target duration seconds (3:40)
              1,                   # batch size
              None,                # source audio
              '',                  # audio code
              0.0,                 # repaint start
              -1,                  # repaint end
              'Fill the audio semantic mask based on the given conditions:',
              1.0,                 # cover strength
              'text2music',
              False,               # ADG
              0.0,                 # cfg interval start
              1.0,                 # cfg interval end
              3.0,                 # shift
              'ode',               # infer method
              '',                  # custom timesteps
              'mp3',               # format
              0.85,                # lm temperature
              True,                # think
              2.0,                 # lm cfg scale
              0,                   # top k
              0.9,                 # top p
              'NO USER INPUT',
              True, True, True,    # CoT metadata/caption/language
              False,               # constrained debug
              True,                # LM batch
              False,               # auto score
              True,                # auto LRC
              0.5,                 # score scale
              8,                   # LM batch chunk
              'vocals',            # track name
              [],                  # complete track classes
              False,               # final optional flag
          ]

          print('Calling ACE-Step ZeroGPU...')
          try:
              result = client.predict(*args, api_name='/generation_wrapper')
          except Exception as exc:
              print('ACE_FULL_ERROR:', type(exc).__name__, exc)
              # Free quota may reject long generation. Retry a 60-second official short version rather than use any paid fallback.
              args[15] = 60
              short_lyrics = '''[INTRO]\nCuando la noche parece no terminar,\nTu luz me encuentra y me vuelve a levantar.\n\n[PRE-CORO]\nY aunque tiemble el suelo bajo mis pies,\nsi Tu mano me sostiene, vuelvo a creer.\n\n[CORO]\nAleluya, Hallelujah,\nmi esperanza vive en Vos.\nAleluya, Hallelujah,\nlate fuerte el corazón.\nCuando todo se oscurece,\nTu presencia trae la luz.\nAleluya, Hallelujah,\nmi camino es con Jesús.\n\n[OUTRO]\nAleluya… Hallelujah…\nTu luz siempre estará.'''
              args[5] = short_lyrics
              print('Retrying ACE-Step as 60-second FREE version...')
              result = client.predict(*args, api_name='/generation_wrapper')

          def walk(value):
              if isinstance(value, str):
                  yield value
              elif isinstance(value, dict):
                  for v in value.values():
                      yield from walk(v)
              elif isinstance(value, (list, tuple)):
                  for v in value:
                      yield from walk(v)

          audio = None
          for item in walk(result):
              low = item.lower()
              p = Path(item)
              if low.endswith(('.mp3', '.flac', '.wav', '.m4a')) and p.exists():
                  audio = p
                  break
          if audio is None:
              print('ACE_RESULT_REPR:', repr(result)[:12000])
              raise RuntimeError('ACE-Step no devolvió un archivo de audio descargado por gradio_client.')

          target = outdir / ('aleluya_hallelujah' + audio.suffix.lower())
          shutil.copy2(audio, target)
          Path('output/aleluya-zero/ace_result.txt').write_text(repr(result), encoding='utf-8')
          print('ACE_AUDIO=', target, 'bytes=', target.stat().st_size)
          PY

      - name: Generate cinematic scenes with free LTX-2 Space
        shell: bash
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          from gradio_client import Client

          outdir = Path('output/aleluya-zero/ltx')
          outdir.mkdir(parents=True, exist_ok=True)
          token = os.getenv('HF_TOKEN') or None
          client = Client('Lightricks/LTX-2-3', token=token, verbose=False)

          prompts = [
              'Original fictional adult male Christian electronic singer on a minimal cinematic stage, wide performance shot, volumetric blue and golden light, natural body movement to music, smoke haze, realistic premium cinematography, no celebrity resemblance, no text, no logos, 16:9',
              'Epic sunrise over Argentine-style mountain landscape, golden rays through clouds, cinematic drone movement, spiritual hopeful atmosphere, photorealistic, premium commercial music video, no text, no logos, 16:9',
              'Wet city road at night with reflections, blue and amber cinematic lighting, smooth dolly camera, anonymous distant silhouette walking toward light, realistic premium music video, no brands, no text, 16:9',
              'Powerful ocean cliffs at dawn, waves and golden sunlight, uplifting cinematic camera movement, realistic atmospheric Christian electronic music video, no text, no logos, 16:9',
              'Anonymous worship silhouettes with hands raised in a vast minimal hall, beams of warm light, tasteful spiritual atmosphere, cinematic slow camera movement, no identifiable real people, no text, no logos, 16:9',
              'Abstract modern spiritual architecture opening toward a brilliant sunrise, blue shadows and golden highlights, cinematic steadicam movement, photorealistic, no religious brand, no text, 16:9',
          ]

          made = []
          for idx, prompt in enumerate(prompts, 1):
              print(f'LTX scene {idx}/{len(prompts)}')
              try:
                  result = client.predict(prompt, True, 42 + idx, api_name='/generate_video')
              except Exception as exc:
                  print('LTX_ERROR', idx, type(exc).__name__, exc)
                  if len(made) >= 2:
                      break
                  continue

              candidates = []
              def walk(v):
                  if isinstance(v, str): candidates.append(v)
                  elif isinstance(v, dict):
                      for x in v.values(): walk(x)
                  elif isinstance(v, (list,tuple)):
                      for x in v: walk(x)
              walk(result)
              src = next((Path(x) for x in candidates if x.lower().endswith(('.mp4','.webm','.mov')) and Path(x).exists()), None)
              if src:
                  dst = outdir / f'scene_{idx:02d}{src.suffix.lower()}'
                  shutil.copy2(src, dst)
                  made.append(dst)
                  print('LTX_VIDEO=', dst, 'bytes=', dst.stat().st_size)
              else:
                  print('LTX_NO_FILE', idx, repr(result)[:4000])

          if not made:
              raise RuntimeError('No se pudo obtener ninguna escena LTX-2 gratuita; se detiene sin usar servicios pagos.')
          print('LTX_SCENES=', len(made))
          PY

      - name: Assemble synchronized music video
        shell: bash
        run: |
          python - <<'PY'
          import glob, subprocess
          from pathlib import Path

          audio_files = glob.glob('output/aleluya-zero/audio/*')
          audio_files = [p for p in audio_files if Path(p).suffix.lower() in {'.mp3','.wav','.flac','.m4a'}]
          scenes = sorted(glob.glob('output/aleluya-zero/ltx/*'))
          if not audio_files or not scenes:
              raise RuntimeError('Falta audio ACE-Step o escenas LTX-2.')
          audio = audio_files[0]

          def duration(path):
              r = subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',path],capture_output=True,text=True,check=True)
              return float(r.stdout.strip())

          target_dur = duration(audio)
          work = Path('output/aleluya-zero/final')
          work.mkdir(parents=True, exist_ok=True)

          # Create a pool of visually distinct edits from LTX-2 originals: normal, slow, mirrored, zoomed.
          variants = []
          for i, src in enumerate(scenes):
              for mode in range(4):
                  dst = work / f'v_{i:02d}_{mode}.mp4'
                  if mode == 0:
                      vf='scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30'
                      speed='1.0'
                  elif mode == 1:
                      vf='scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,hflip,fps=30'
                      speed='1.0'
                  elif mode == 2:
                      vf='scale=2304:1296:force_original_aspect_ratio=increase,crop=1920:1080:x=(iw-ow)/2:y=(ih-oh)/2,fps=30'
                      speed='0.85'
                  else:
                      vf='scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,eq=contrast=1.05:saturation=1.08,fps=30'
                      speed='0.92'
                  subprocess.run(['ffmpeg','-y','-loglevel','error','-i',src,'-vf',vf,'-an','-filter:v',vf+',setpts=PTS/'+speed,'-c:v','libx264','-preset','medium','-crf','19','-pix_fmt','yuv420p',str(dst)],check=True)
                  variants.append(dst)

          manifest = work / 'concat.txt'
          lines=[]
          elapsed=0.0
          k=0
          while elapsed < target_dur + 5:
              v=variants[k % len(variants)]
              lines.append("file '" + str(v.resolve()).replace("'", "'\\''") + "'")
              elapsed += max(0.1, duration(str(v)))
              k += 1
          manifest.write_text('\n'.join(lines),encoding='utf-8')

          visual=work/'visual_master.mp4'
          subprocess.run(['ffmpeg','-y','-loglevel','error','-f','concat','-safe','0','-i',str(manifest),'-t',f'{target_dur:.3f}','-an','-c:v','libx264','-preset','medium','-crf','18','-pix_fmt','yuv420p','-movflags','+faststart',str(visual)],check=True)

          final=work/'Aleluya_Hallelujah_x_DemianVelo.mp4'
          subprocess.run(['ffmpeg','-y','-loglevel','error','-i',str(visual),'-i',audio,'-map','0:v:0','-map','1:a:0','-t',f'{target_dur:.3f}','-c:v','copy','-c:a','aac','-b:a','256k','-movflags','+faststart',str(final)],check=True)
          print('FINAL_VIDEO=', final, 'duration=', target_dur, 'bytes=', final.stat().st_size)
          PY

      - name: Write release metadata
        if: always()
        run: |
          cat > output/aleluya-zero/README.txt <<'TXT'
          Título: Aleluya (Hallelujah) x DemianVelo | Música Cristiana Electrónica
          Artista: DemianVelo
          Música/voz cantada: ACE-Step 1.5 (Space público gratuito, cuando estuvo disponible)
          Video: LTX-2 (Space público gratuito, cuando estuvo disponible)
          Montaje: FFmpeg
          Política: FREE ONLY; sin API paga ni fallback pago.
          Voz: cantante masculino original; no clona ni imita a una persona real.
          TXT

      - name: Upload final files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aleluya-zero-${{ github.run_id }}
          path: output/aleluya-zero/
          if-no-files-found: warn
          retention-days: 5
