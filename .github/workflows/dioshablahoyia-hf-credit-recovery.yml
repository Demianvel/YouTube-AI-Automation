name: Dios Habla Hoy IA - HF Credit Recovery 10 Shorts + 2 Longs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "triggers/dioshablahoyia-hf-credit-recovery.txt"
  schedule:
    # 09:00, 15:00 y 21:00 America/Argentina/Buenos_Aires (UTC-3).
    # Son checkpoints de recuperacion: solo publican lo que realmente falta.
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
    - cron: "0 0 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: dioshablahoyia-hf-credit-recovery
  cancel-in-progress: false

env:
  PYTHONPATH: .
  TZ: America/Argentina/Buenos_Aires
  CHANNEL: dioshablahoyia
  CONTENT_MODE: voice
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_TEXT_MODEL: gemini-3.6-flash
  GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
  GEMINI_TTS_VOICE: Algenib
  GEMINI_TTS_MAX_ATTEMPTS: "4"
  SPIRITUAL_MALE_GEMINI_VOICE: Algenib
  SPIRITUAL_VOICE_PROFILE: voz_de_luz_serena_original_v1
  SPIRITUAL_VOICE_BRAND: Voz de Luz
  SPIRITUAL_VOICE_REFERENCE_MODE: fixed_original_identity_no_speaker_clone
  SPIRITUAL_VOICE_LOCKED: "true"
  SPIRITUAL_VOICEOVER_MODE: "true"
  SPIRITUAL_REQUIRE_PRIMARY_VOICE: "true"
  SPIRITUAL_LIPSYNC_ENABLED: "false"
  SPIRITUAL_LONG_LIPSYNC_ENABLED: "false"
  TTS_PROVIDER: gemini_tts
  TTS_FALLBACK_KOKORO: "false"

  # Mantener identidad visual realista historica y usar primero creditos HF.
  SPIRITUAL_REQUIRE_FRESH_VISUAL: "true"
  SPIRITUAL_VISUAL_REFERENCE_LOCKED: "true"
  SPIRITUAL_VISUAL_REFERENCE_PROFILE: realistic_jesus_reference_abc_v1
  SPIRITUAL_ALLOW_SYMBOLIC_JESUS_FALLBACK: "false"
  SPIRITUAL_ALLOW_LOCAL_PROCEDURAL_VISUAL: "false"
  SPIRITUAL_ALLOW_STILL_FALLBACK: "true"
  SPIRITUAL_VISUAL_VARIETY_LEVEL: maximum
  SPIRITUAL_EDITORIAL_VARIETY_LEVEL: high
  SPIRITUAL_REFERENCE_AVOID_RECENT: "100"
  SPIRITUAL_SHORT_SECONDS: "60"
  SPIRITUAL_SHORT_SCENE_SECONDS: "10"
  SPIRITUAL_SHORT_AI_CLIPS: "0"
  SPIRITUAL_FAST_RENDER: "true"
  SPIRITUAL_CTA_OVERLAY: "false"

  # El publisher bloqueado usa reference-guided images + movimiento cinematico.
  # Inference Providers se intenta antes que ZeroGPU para aprovechar creditos.
  HF_VIDEO_ENABLED: "false"
  HF_REFERENCE_IMAGE_ENABLED: "true"
  HF_REFERENCE_EDITOR_ENABLED: "true"
  HF_INFERENCE_PROVIDER_ENABLED: "true"
  HF_REFERENCE_ZERO_SPACE_FIRST: "false"
  HF_REFERENCE_IMAGE_PROVIDER: auto
  HF_REFERENCE_IMAGE_MODEL: black-forest-labs/FLUX.1-Kontext-dev
  HF_IMAGE_PROVIDER: auto
  HF_IMAGE_MODEL: black-forest-labs/FLUX.1-schnell
  HF_REFERENCE_ZERO_SPACE: black-forest-labs/FLUX.1-Kontext-Dev
  HF_TEXT_ZERO_ENABLED: "true"
  HF_TEXT_ZERO_SPACE: black-forest-labs/FLUX.1-schnell
  HF_ZERO_AUTH_RETRY: "true"
  HF_REMOTE_CIRCUIT_BREAKER: "true"
  HF_ZERO_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  MUSIC_PROVIDER: local
  YOUTUBE_TOKEN_DIOSHABLAHOYIA: ${{ secrets.YOUTUBE_TOKEN_DIOSHABLAHOYIA }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install auth preflight runtime
        run: |
          python -m pip install -q --upgrade pip
          pip install -q "google-api-python-client>=2.170.0" "google-auth>=2.40.0"

      - name: Validate secrets and permanent identity before spending credits
        shell: bash
        run: |
          test -n "$YOUTUBE_TOKEN_DIOSHABLAHOYIA"
          test -n "$GEMINI_API_KEY"
          test -n "$HF_TOKEN"
          test "$GEMINI_TTS_VOICE" = "Algenib"
          test "$SPIRITUAL_MALE_GEMINI_VOICE" = "Algenib"
          test "$SPIRITUAL_VOICE_BRAND" = "Voz de Luz"
          test "$SPIRITUAL_VOICE_PROFILE" = "voz_de_luz_serena_original_v1"
          test "$SPIRITUAL_VOICE_LOCKED" = "true"
          test "$SPIRITUAL_REQUIRE_PRIMARY_VOICE" = "true"
          test "$TTS_PROVIDER" = "gemini_tts"
          test "$TTS_FALLBACK_KOKORO" = "false"
          test "$HF_INFERENCE_PROVIDER_ENABLED" = "true"
          test "$HF_REFERENCE_ZERO_SPACE_FIRST" = "false"
          for ref in \
            assets/dioshablahoyia/reference/jesus_reference_a.jpg \
            assets/dioshablahoyia/reference/jesus_reference_b.jpg \
            assets/dioshablahoyia/reference/jesus_reference_c.jpg; do
            test -s "$ref"
          done

      - name: Preflight YouTube OAuth and channel identity
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          info = json.loads(os.environ["YOUTUBE_TOKEN_DIOSHABLAHOYIA"])
          scopes = info.get("scopes") or [
              "https://www.googleapis.com/auth/youtube.upload",
              "https://www.googleapis.com/auth/youtube.readonly",
          ]
          creds = Credentials.from_authorized_user_info(info, scopes=scopes)
          youtube = build("youtube", "v3", credentials=creds, cache_discovery=False)
          items = youtube.channels().list(part="id,snippet", mine=True).execute().get("items", [])
          if not items:
              raise SystemExit("OAuth valido pero no identifica ningun canal de YouTube.")
          snippet = items[0].get("snippet", {})
          actual = str(snippet.get("customUrl") or "").lower().lstrip("/")
          expected = "@dioshablahoyia"
          if actual != expected:
              raise SystemExit(
                  f"OAuth pertenece a otro canal: esperado {expected}, recibido {actual or snippet.get('title','desconocido')}"
              )
          print(f"OAuth YouTube OK para {actual}. Se habilita el gasto de generacion.")
          PY

  shorts:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install publishing runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1 fonts-dejavu-core git >/dev/null
          python -m pip install -q --upgrade pip
          pip install -q \
            "google-genai>=2.3.0" \
            "google-api-python-client>=2.170.0" \
            "google-auth>=2.40.0" \
            "google-auth-oauthlib>=1.2.2" \
            "Pillow>=11.0.0" \
            "requests>=2.32.0" \
            "numpy<3,>=1.26" \
            "soundfile>=0.13.1" \
            "huggingface_hub<2,>=0.34.4" \
            "gradio_client<3,>=1.11.0"
          python -m py_compile \
            scripts/dioshablahoyia_catchup_shorts.py \
            scripts/publish_dios_locked.py \
            app/spiritual_tts.py \
            app/spiritual_reference_generation.py \
            app/spiritual_image.py \
            app/youtube.py

      - name: Complete only missing Shorts to 10
        run: python scripts/dioshablahoyia_catchup_shorts.py

      - name: Persist every successful Short even after a later failure
        if: always()
        shell: bash
        run: |
          RECORDS="/tmp/dios-catchup/new-short-records.jsonl"
          test -s "$RECORDS" || exit 0
          cp "$RECORDS" /tmp/dios-credit-short-records.jsonl
          git config user.name "youtube-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p state
            touch state/history.jsonl
            while IFS= read -r record; do
              test -n "$record" || continue
              VIDEO_ID="$(printf '%s' "$record" | python -c 'import json,sys; print(json.load(sys.stdin).get("video_id", ""))' 2>/dev/null || true)"
              if [ -n "$VIDEO_ID" ] && grep -Fq "\"video_id\": \"$VIDEO_ID\"" state/history.jsonl; then
                continue
              fi
              printf '%s\n' "$record" >> state/history.jsonl
            done < /tmp/dios-credit-short-records.jsonl
            git add state/history.jsonl
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore: persist HF-credit Dios Shorts recovery"
            git push origin HEAD:main && exit 0
          done
          exit 1

  longs:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine weekend and weekly missing long count
        id: long_plan
        shell: bash
        run: |
          DOW="$(TZ=America/Argentina/Buenos_Aires date +%u)"
          if [ "$DOW" != "6" ] && [ "$DOW" != "7" ]; then
            echo "run_longs=false" >> "$GITHUB_OUTPUT"
            echo "targets=" >> "$GITHUB_OUTPUT"
            echo "Fuera de fin de semana: no se generan largos."
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("America/Argentina/Buenos_Aires")
          now = datetime.now(tz)
          current = now.isocalendar()
          rows = []
          path = Path("state/dioshablahoyia_long_history.jsonl")
          if path.exists():
              for raw in path.read_text(encoding="utf-8").splitlines():
                  try:
                      row = json.loads(raw)
                      if row.get("channel") != "dioshablahoyia" or row.get("content_type") != "long":
                          continue
                      if row.get("status") != "uploaded" and not row.get("video_id"):
                          continue
                      dt = datetime.fromisoformat(str(row.get("created_at") or "").replace("Z", "+00:00")).astimezone(tz)
                      iso = dt.isocalendar()
                      if (iso.year, iso.week) == (current.year, current.week):
                          rows.append(row)
                  except Exception:
                      continue
          count = len(rows)
          used = {int(r.get("minutes", 0) or 0) for r in rows}
          candidates = [m for m in (10, 15, 25, 30) if m not in used]
          missing_count = max(0, 2 - count)
          targets = candidates[:missing_count]
          print(f"run_longs={'true' if targets else 'false'}")
          print("targets=" + " ".join(str(x) for x in targets))
          PY

      - name: Install long publishing runtime
        if: steps.long_plan.outputs.run_longs == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1 fonts-dejavu-core git >/dev/null
          python -m pip install -q --upgrade pip
          pip install -q \
            "google-genai>=2.3.0" \
            "google-api-python-client>=2.170.0" \
            "google-auth>=2.40.0" \
            "google-auth-oauthlib>=1.2.2" \
            "Pillow>=11.0.0" \
            "requests>=2.32.0" \
            "numpy<3,>=1.26" \
            "soundfile>=0.13.1" \
            "huggingface_hub<2,>=0.34.4" \
            "gradio_client<3,>=1.11.0"
          python -m py_compile scripts/dioshablahoyia_catchup_longs.py scripts/publish_dios_long_fresh.py

      - name: Snapshot long history before recovery
        if: steps.long_plan.outputs.run_longs == 'true'
        shell: bash
        run: |
          mkdir -p state
          touch state/dioshablahoyia_long_history.jsonl
          cp state/dioshablahoyia_long_history.jsonl /tmp/dios-long-before.jsonl

      - name: Recover only weekly missing long videos
        if: steps.long_plan.outputs.run_longs == 'true'
        shell: bash
        run: |
          rc=0
          for minutes in ${{ steps.long_plan.outputs.targets }}; do
            python scripts/dioshablahoyia_catchup_longs.py --minutes "$minutes" || rc=1
          done
          exit "$rc"

      - name: Build partial long checkpoint
        if: always() && steps.long_plan.outputs.run_longs == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          before = Path('/tmp/dios-long-before.jsonl')
          current = Path('state/dioshablahoyia_long_history.jsonl')
          out = Path('/tmp/dios-long-new-records.jsonl')
          baseline = before.read_text(encoding='utf-8').splitlines() if before.exists() else []
          rows = current.read_text(encoding='utf-8').splitlines() if current.exists() else []
          fresh = [line for line in rows[len(baseline):] if line.strip()]
          out.write_text(''.join(f'{line}\n' for line in fresh), encoding='utf-8')
          print(f'Checkpoint largos: {len(fresh)} registro(s) nuevo(s).')
          PY

      - name: Persist every successful long even after a later failure
        if: always() && steps.long_plan.outputs.run_longs == 'true'
        shell: bash
        run: |
          RECORDS="/tmp/dios-long-new-records.jsonl"
          test -s "$RECORDS" || exit 0
          cp "$RECORDS" /tmp/dios-credit-long-records.jsonl
          git config user.name "youtube-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p state
            touch state/dioshablahoyia_long_history.jsonl
            while IFS= read -r record; do
              test -n "$record" || continue
              VIDEO_ID="$(printf '%s' "$record" | python -c 'import json,sys; print(json.load(sys.stdin).get("video_id", ""))' 2>/dev/null || true)"
              if [ -n "$VIDEO_ID" ] && grep -Fq "\"video_id\": \"$VIDEO_ID\"" state/dioshablahoyia_long_history.jsonl; then
                continue
              fi
              printf '%s\n' "$record" >> state/dioshablahoyia_long_history.jsonl
            done < /tmp/dios-credit-long-records.jsonl
            git add state/dioshablahoyia_long_history.jsonl
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore: persist HF-credit Dios long recovery"
            git push origin HEAD:main && exit 0
          done
          exit 1

  report_failure:
    needs: [preflight, shorts, longs]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open actionable recovery issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dios Habla Hoy - HF credit recovery incompleto" \
            --body "El recovery verifico OAuth antes de gastar creditos y mantuvo Voz de Luz / Algenib + referencias realistas bloqueadas. Revisar Actions run $GITHUB_RUN_ID. Si preflight fallo con invalid_grant, renovar YOUTUBE_TOKEN_DIOSHABLAHOYIA mediante el flujo OAuth interactivo existente."
