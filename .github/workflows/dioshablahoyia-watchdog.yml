name: Dios Habla Hoy IA watchdog

on:
  workflow_dispatch:
  schedule:
    # Publicador Reino 4x10 revisa cada 15 minutos el objetivo diario.
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/dioshablahoyia_watchdog.py"
      - "app/workers/divine_publisher_4x10.py"
      - ".github/workflows/dioshablahoyia-watchdog.yml"

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: dioshablahoyia-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
      PUBLISHER_WORKER: Publicador Reino 4x10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Calculate today's 4x10 deficit
        id: plan
        shell: bash
        run: |
          REPORT="$(python scripts/dioshablahoyia_watchdog.py)"
          echo "$REPORT"
          SHORT_MISSING="$(printf '%s' "$REPORT" | python -c 'import json,sys; print(json.load(sys.stdin)["short_missing"])')"
          LONG_MISSING="$(printf '%s' "$REPORT" | python -c 'import json,sys; print(json.load(sys.stdin)["long_missing"])')"
          LONG_MINUTES="$(printf '%s' "$REPORT" | python -c 'import json,sys; x=json.load(sys.stdin)["long_recovery_minutes"]; print(x if x is not None else "10")')"
          echo "short_missing=$SHORT_MISSING" >> "$GITHUB_OUTPUT"
          echo "long_missing=$LONG_MISSING" >> "$GITHUB_OUTPUT"
          echo "long_minutes=$LONG_MINUTES" >> "$GITHUB_OUTPUT"

      - name: Check whether strict daily catch-up is active
        id: batch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ACTIVE="$(gh run list -R "$GITHUB_REPOSITORY" --workflow dioshablahoyia-catchup-shorts.yml --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length' 2>/dev/null || echo 0)"
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "Catch-up estricto activo: $ACTIVE"

      - name: Catch up one missing Dios Short
        if: steps.plan.outputs.short_missing != '0' && steps.batch.outputs.active == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ACTIVE="$(gh run list -R "$GITHUB_REPOSITORY" --workflow shorts.yml --limit 30 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length')"
          if [ "$ACTIVE" -gt 0 ]; then
            echo "Hay $ACTIVE Short(s) en cola/ejecucion; no duplicar."
          else
            echo "Faltan ${{ steps.plan.outputs.short_missing }} Short(s); Publicador Reino 4x10 recupera uno ahora."
            gh workflow run shorts.yml \
              -R "$GITHUB_REPOSITORY" \
              --ref main \
              -f channel=dioshablahoyia \
              -f content_mode=voice \
              -f dry_run=false
          fi

      - name: Catch up one missing long Dios video
        if: steps.plan.outputs.long_missing != '0' && steps.batch.outputs.active == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ACTIVE="$(gh run list -R "$GITHUB_REPOSITORY" --workflow dioshablahoyia-long.yml --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length')"
          if [ "$ACTIVE" -gt 0 ]; then
            echo "Hay $ACTIVE video(s) largo(s) en cola/ejecucion; no duplicar."
          else
            echo "Faltan ${{ steps.plan.outputs.long_missing }} video(s) largo(s); recuperando uno de ${{ steps.plan.outputs.long_minutes }} min."
            gh workflow run dioshablahoyia-long.yml \
              -R "$GITHUB_REPOSITORY" \
              --ref main \
              -f minutes="${{ steps.plan.outputs.long_minutes }}" \
              -f publish=true
          fi

      - name: Strict catch-up owns recovery right now
        if: steps.batch.outputs.active != '0'
        run: echo "El lote estricto esta completando el objetivo diario; watchdog no dispara trabajos paralelos."

      - name: Report serious daily deficit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create \
            -R "$GITHUB_REPOSITORY" \
            --title "Publicador Reino 4x10 necesita atencion" \
            --body "El watchdog no pudo recuperar contenido faltante de Dios Habla Hoy. Revisar Actions run $GITHUB_RUN_ID."
