name: Dios Habla Hoy IA watchdog

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: dioshablahoyia-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Count only real Shorts uploaded today
        id: count
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          zone=ZoneInfo('America/Argentina/Buenos_Aires')
          today=datetime.now(zone).date()
          ids=set()
          path=Path('state/history.jsonl')
          if path.exists():
              for raw in path.read_text(encoding='utf-8').splitlines():
                  try:
                      row=json.loads(raw)
                      dt=datetime.fromisoformat(str(row.get('created_at') or '').replace('Z','+00:00'))
                      if dt.tzinfo is None: dt=dt.replace(tzinfo=timezone.utc)
                  except Exception:
                      continue
                  vid=str(row.get('video_id') or '').strip()
                  if row.get('channel')=='dioshablahoyia' and dt.astimezone(zone).date()==today and vid:
                      ids.add(vid)
          count=len(ids)
          missing=max(0,10-count)
          print(f'CONFIRMED={count}/10 MISSING={missing}')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write(f'count={count}\nmissing={missing}\n')
          PY

      - name: Check canonical recovery
        if: steps.count.outputs.missing != '0'
        id: active
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ACTIVE="$(gh run list -R "$GITHUB_REPOSITORY" --workflow dioshablahoyia-algenib-emergency.yml --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length' 2>/dev/null || echo 0)"
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "Canonical recovery active: $ACTIVE"

      - name: Dispatch only canonical Shorts recovery
        if: steps.count.outputs.missing != '0' && steps.active.outputs.active == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Faltan ${{ steps.count.outputs.missing }} Shorts. Disparando solo el recuperador Algenib 2.5."
          gh workflow run dioshablahoyia-algenib-emergency.yml -R "$GITHUB_REPOSITORY" --ref main

      - name: Daily target complete
        if: steps.count.outputs.missing == '0'
        run: echo "10/10 Shorts confirmados por video_id. No publicar mas Shorts hoy."
