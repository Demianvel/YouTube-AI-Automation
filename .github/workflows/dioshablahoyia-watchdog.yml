name: Dios Habla Hoy IA watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: dioshablahoyia-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Calculate today's publishing deficit
        id: plan
        shell: bash
        run: |
          REPORT="$(python scripts/dioshablahoyia_watchdog.py)"
          echo "$REPORT"
          SHORT_MISSING="$(printf '%s' "$REPORT" | python -c 'import json,sys; print(json.load(sys.stdin)["short_missing"])')"
          LONG_FIRST="$(printf '%s' "$REPORT" | python -c 'import json,sys; x=json.load(sys.stdin)["long_missing"]; print(x[0] if x else "")')"
          echo "short_missing=$SHORT_MISSING" >> "$GITHUB_OUTPUT"
          echo "long_first=$LONG_FIRST" >> "$GITHUB_OUTPUT"

      - name: Catch up one missing Short
        if: steps.plan.outputs.short_missing != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ACTIVE="$(gh run list -R "$GITHUB_REPOSITORY" --workflow shorts.yml --limit 30 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
          if [ "$ACTIVE" -gt 0 ]; then
            echo "Hay $ACTIVE Short(s) en cola/ejecucion; no duplicar."
            exit 0
          fi
          echo "Faltan ${{ steps.plan.outputs.short_missing }} Short(s); recuperando uno."
          gh workflow run shorts.yml \
            -R "$GITHUB_REPOSITORY" \
            --ref main \
            -f channel=dioshablahoyia \
            -f content_mode=voice \
            -f dry_run=false

      - name: Catch up one missing long video
        if: steps.plan.outputs.long_first != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ACTIVE="$(gh run list -R "$GITHUB_REPOSITORY" --workflow dioshablahoyia-long.yml --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
          if [ "$ACTIVE" -gt 0 ]; then
            echo "Hay $ACTIVE video(s) largo(s) en cola/ejecucion; no duplicar."
            exit 0
          fi
          MINUTES="${{ steps.plan.outputs.long_first }}"
          echo "Recuperando video largo faltante de ${MINUTES} minutos."
          gh workflow run dioshablahoyia-long.yml \
            -R "$GITHUB_REPOSITORY" \
            --ref main \
            -f minutes="$MINUTES" \
            -f publish=true

      - name: Report serious daily deficit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create \
            -R "$GITHUB_REPOSITORY" \
            --title "Dios Habla Hoy watchdog necesita atencion" \
            --body "El watchdog no pudo recuperar una publicacion faltante. Revisar Actions run $GITHUB_RUN_ID."
