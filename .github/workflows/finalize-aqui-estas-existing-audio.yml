name: Finalize and publish Aqui Estas from existing ACE chunks

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar en @DemianVelo
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: finalize-aqui-estas-existing-audio
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: .
      YOUTUBE_TOKEN_DEMIANVELO: ${{ secrets.YOUTUBE_TOKEN_DEMIANVELO }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the six successful ACE-Step chunks without regenerating music
        uses: actions/download-artifact@v4
        with:
          pattern: aqui-estas-*
          path: chunks
          merge-multiple: true
          repository: Demianvel/YouTube-AI-Automation
          run-id: 31695893286
          github-token: ${{ github.token }}

      - name: Install free cinematic production dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation2
          python -m pip install --upgrade pip
          pip install requests google-api-python-client google-auth pillow gradio_client

      - name: Verify all six ACE chunks and DemianVelo OAuth
        shell: bash
        run: |
          test -n "$YOUTUBE_TOKEN_DEMIANVELO" || { echo "Falta YOUTUBE_TOKEN_DEMIANVELO"; exit 1; }
          for f in \
            chunks/aqui_estas_045.wav \
            chunks/aqui_estas_090.wav \
            chunks/aqui_estas_135.wav \
            chunks/aqui_estas_180.wav \
            chunks/aqui_estas_225.wav \
            chunks/Aqui_Estas_x_DemianVelo.wav; do
            test -s "$f" || { echo "Falta $f"; exit 1; }
          done
          echo "Seis tramos ACE-Step disponibles."

      - name: Join song, render ten unique cinematic scenes, create thumbnail and publish
        shell: bash
        run: |
          ARGS=(--chunks-dir chunks)
          if [ "${{ inputs.publish }}" = "true" ]; then ARGS+=(--publish); fi
          python scripts/finalize_aqui_estas_from_chunks.py "${ARGS[@]}"

      - name: Upload final production artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqui-estas-published-master-${{ github.run_id }}
          path: output/aqui_estas_demianvelo/final/
          if-no-files-found: warn
          retention-days: 5
