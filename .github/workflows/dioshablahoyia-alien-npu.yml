name: Dios Habla Hoy IA - Alien NPU Brain

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */2 * * *"
  push:
    branches: [main]
    paths:
      - "app/alien_npu_brain.py"
      - "app/npu_market_radar.py"
      - "scripts/npu_brain_learn.py"
      - "scripts/npu_market_radar.py"
      - "config/npu_market_radar.json"
      - ".github/workflows/dioshablahoyia-alien-npu.yml"

permissions:
  contents: write

concurrency:
  group: dioshablahoyia-alien-npu-learning
  cancel-in-progress: true

jobs:
  brain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      TZ: America/Argentina/Buenos_Aires
      YOUTUBE_TOKEN_DIOSHABLAHOYIA: ${{ secrets.YOUTUBE_TOKEN_DIOSHABLAHOYIA }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install NPU dependencies
        run: pip install -q google-api-python-client google-auth

      - name: Compile brain before learning
        run: |
          python -m py_compile \
            app/alien_npu_brain.py \
            app/npu_market_radar.py \
            app/fast_spiritual_metadata.py \
            scripts/npu_brain_learn.py \
            scripts/npu_market_radar.py

      - name: Refresh broad YouTube market radar once per Argentina day
        continue-on-error: true
        run: python scripts/npu_market_radar.py --channel dioshablahoyia

      - name: Rebuild Alien NPU memory from latest Growth Engine state
        continue-on-error: true
        run: python scripts/npu_brain_learn.py

      - name: Persist NPU memory without touching publishing history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            state/growth/dioshablahoyia_npu_brain.json \
            state/growth/youtube_market_radar.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "NPU memory sin cambios"
            exit 0
          fi
          git commit -m "chore: evolve Alien NPU brain memory"
          git pull --rebase origin main
          git push origin HEAD:main
