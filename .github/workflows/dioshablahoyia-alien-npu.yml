name: Dios Habla Hoy IA - Alien NPU Brain 24x7 Local

on:
  workflow_dispatch:
  schedule:
    # One local learning cycle every hour, every day of the year.
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "app/alien_npu_brain.py"
      - "app/npu_seo_cortex.py"
      - "app/npu_internal_cortex.py"
      - "app/fast_spiritual_metadata.py"
      - "scripts/npu_brain_learn.py"
      - "scripts/npu_seo_train.py"
      - "scripts/npu_internal_train.py"
      - ".github/workflows/dioshablahoyia-alien-npu.yml"

permissions:
  contents: write

concurrency:
  group: dioshablahoyia-alien-npu-learning
  cancel-in-progress: true

jobs:
  brain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      TZ: America/Argentina/Buenos_Aires
      NPU_TRAINING_MODE: local_only_zero_quota
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile zero-quota local brain
        run: |
          python -m py_compile \
            app/alien_npu_brain.py \
            app/npu_seo_cortex.py \
            app/npu_internal_cortex.py \
            app/fast_spiritual_metadata.py \
            scripts/npu_brain_learn.py \
            scripts/npu_seo_train.py \
            scripts/npu_internal_train.py

      - name: Train internal quality and creator-focus cortex
        run: python scripts/npu_internal_train.py

      - name: Train SEO cortex from locally cached first-party learning
        continue-on-error: true
        run: python scripts/npu_seo_train.py

      - name: Rebuild Alien NPU memory from local Growth + SEO cache
        continue-on-error: true
        run: python scripts/npu_brain_learn.py

      - name: Verify zero-quota and fail-open policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          workflow = Path('.github/workflows/dioshablahoyia-alien-npu.yml').read_text(encoding='utf-8')
          forbidden = (
              'YOUTUBE' + '_TOKEN_',
              'google-api-' + 'python-client',
              'npu_market_' + 'radar.py --channel',
              'growth_' + 'radar.py --channel',
          )
          for value in forbidden:
              assert value not in workflow, f'external/quota path found in local trainer: {value}'

          internal_path = Path('state/growth/dioshablahoyia_internal_brain.json')
          if internal_path.exists():
              internal = json.loads(internal_path.read_text(encoding='utf-8'))
              assert internal.get('training_mode') == 'local_only_zero_external_calls'
              mission = internal.get('mission') or {}
              assert mission.get('publishing_must_continue') is True
              assert mission.get('never_sacrifice_quality_for_clickbait') is True

          brain_path = Path('state/growth/dioshablahoyia_npu_brain.json')
          if brain_path.exists():
              brain = json.loads(brain_path.read_text(encoding='utf-8'))
              arch = brain.get('architecture') or {}
              assert arch.get('fail_open') is True
              assert arch.get('publishing_must_continue') is True
              assert arch.get('no_viral_guarantee') is True
          print('ZERO_QUOTA_24X7_NPU_POLICY_OK')
          PY

      - name: Persist local learning memory without touching publishing history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            state/growth/dioshablahoyia_internal_brain.json \
            state/growth/dioshablahoyia_npu_brain.json \
            state/growth/dioshablahoyia_seo_brain.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin datos locales nuevos; ciclo completado sin commit."
            exit 0
          fi
          git commit -m "chore: local zero-quota NPU learning cycle"
          git pull --rebase origin main
          git push origin HEAD:main
