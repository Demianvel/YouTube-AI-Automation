name: Dios Habla Hoy IA - 2 Shorts Animales y Biblia

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "triggers/dioshablahoyia-animal-bible-2.txt"

permissions:
  contents: write
  issues: write

concurrency:
  group: dioshablahoyia-short-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: .
      TZ: America/Argentina/Buenos_Aires
      CHANNEL: dioshablahoyia
      CONTENT_MODE: voice
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.6-flash
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Algenib
      GEMINI_TTS_MAX_ATTEMPTS: "4"
      SPIRITUAL_MALE_GEMINI_VOICE: Algenib
      SPIRITUAL_VOICE_PROFILE: voz_de_luz_serena_original_v1
      SPIRITUAL_VOICE_BRAND: Voz de Luz
      SPIRITUAL_VOICE_LOCKED: "true"
      SPIRITUAL_VOICEOVER_MODE: "true"
      SPIRITUAL_LIPSYNC_ENABLED: "false"
      SPIRITUAL_REQUIRE_PRIMARY_VOICE: "true"
      SPIRITUAL_SHORT_SECONDS: "60"
      SPIRITUAL_SHORT_SCENE_SECONDS: "10"
      SPIRITUAL_SHORT_AI_CLIPS: "0"
      SPIRITUAL_FAST_RENDER: "true"
      SPIRITUAL_REQUIRE_FRESH_VISUAL: "true"
      SPIRITUAL_VISUAL_VARIETY_LEVEL: maximum
      SPIRITUAL_EDITORIAL_VARIETY_LEVEL: high
      SPIRITUAL_CTA_OVERLAY: "false"
      TTS_PROVIDER: gemini_tts
      TTS_FALLBACK_KOKORO: "false"
      GEMINI_VIDEO_ENABLED: "false"
      HF_VIDEO_ENABLED: "false"
      HF_REFERENCE_IMAGE_ENABLED: "true"
      HF_REFERENCE_EDITOR_ENABLED: "true"
      HF_REFERENCE_ZERO_SPACE: black-forest-labs/FLUX.1-Kontext-Dev
      HF_TEXT_ZERO_ENABLED: "true"
      HF_TEXT_ZERO_SPACE: black-forest-labs/FLUX.1-schnell
      HF_REFERENCE_ZERO_SPACE_FIRST: "true"
      HF_ZERO_AUTH_RETRY: "true"
      HF_REMOTE_CIRCUIT_BREAKER: "true"
      HF_INFERENCE_PROVIDER_ENABLED: "false"
      HF_ZERO_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_TOKEN: ""
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      MUSIC_PROVIDER: local
      YOUTUBE_TOKEN_DIOSHABLAHOYIA: ${{ secrets.YOUTUBE_TOKEN_DIOSHABLAHOYIA }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_GRAPH_API_VERSION: v25.0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve available slots inside daily target of 10
        id: slots
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("America/Argentina/Buenos_Aires")
          today = datetime.now(tz).date()
          count = 0
          path = Path("state/history.jsonl")
          if path.exists():
              for raw in path.read_text(encoding="utf-8").splitlines():
                  try:
                      row = json.loads(raw)
                      if row.get("channel") != "dioshablahoyia":
                          continue
                      if row.get("status") != "uploaded" and not row.get("video_id"):
                          continue
                      stamp = str(row.get("created_at") or "")
                      dt = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
                      if dt.tzinfo is None:
                          dt = dt.replace(tzinfo=timezone.utc)
                      if dt.astimezone(tz).date() == today:
                          count += 1
                  except Exception:
                      continue
          slots = max(0, min(2, 10 - count))
          print(f"Shorts ya publicados hoy: {count}/10; slots disponibles para animales: {slots}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"count={count}\n")
              fh.write(f"slots={slots}\n")
          PY

      - name: Install runtime
        if: steps.slots.outputs.slots != '0'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1 fonts-dejavu-core git >/dev/null
          python -m pip install -q --upgrade pip
          pip install -q \
            "google-genai>=2.3.0" \
            "google-api-python-client>=2.170.0" \
            "google-auth>=2.40.0" \
            "google-auth-oauthlib>=1.2.2" \
            "Pillow>=11.0.0" \
            "requests>=2.32.0" \
            "numpy<3,>=1.26" \
            "soundfile>=0.13.1" \
            "huggingface_hub<2,>=0.34.4" \
            "gradio_client<3,>=1.11.0"

      - name: Verify HF and permanent voice
        if: steps.slots.outputs.slots != '0'
        run: |
          test -n "$YOUTUBE_TOKEN_DIOSHABLAHOYIA"
          test -n "$HF_ZERO_TOKEN"
          test -n "$GEMINI_API_KEY"
          test "$GEMINI_TTS_VOICE" = "Algenib"
          test "$SPIRITUAL_VOICE_LOCKED" = "true"
          test "$SPIRITUAL_REQUIRE_PRIMARY_VOICE" = "true"
          test "$TTS_FALLBACK_KOKORO" = "false"
          python -m py_compile scripts/publish_dios_animal_short.py scripts/publish_dios_fast.py app/spiritual_tts.py app/pipeline.py

      - name: Publish animal Bible Short 1
        if: steps.slots.outputs.slots == '1' || steps.slots.outputs.slots == '2'
        env:
          DIOS_ANIMAL_SHORT_INDEX: "1"
        run: python scripts/publish_dios_animal_short.py

      - name: Preserve record 1
        if: steps.slots.outputs.slots == '1' || steps.slots.outputs.slots == '2'
        shell: bash
        run: |
          mkdir -p /tmp/animal-bible
          tail -n 1 state/history.jsonl > /tmp/animal-bible/record1.jsonl

      - name: Publish animal Bible Short 2
        if: steps.slots.outputs.slots == '2'
        env:
          DIOS_ANIMAL_SHORT_INDEX: "2"
        run: python scripts/publish_dios_animal_short.py

      - name: Preserve record 2
        if: steps.slots.outputs.slots == '2'
        shell: bash
        run: |
          tail -n 1 state/history.jsonl > /tmp/animal-bible/record2.jsonl

      - name: Persist published records
        if: success() && steps.slots.outputs.slots != '0'
        shell: bash
        run: |
          cat /tmp/animal-bible/record1.jsonl > /tmp/animal-bible/all.jsonl
          if [ -s /tmp/animal-bible/record2.jsonl ]; then cat /tmp/animal-bible/record2.jsonl >> /tmp/animal-bible/all.jsonl; fi
          git config user.name "youtube-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p state
            touch state/history.jsonl
            while IFS= read -r record; do
              test -n "$record" || continue
              grep -Fqx "$record" state/history.jsonl || printf '%s\n' "$record" >> state/history.jsonl
            done < /tmp/animal-bible/all.jsonl
            git add state/history.jsonl
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore: record animal Bible Shorts"
            git push origin HEAD:main && exit 0
          done
          exit 1

      - name: Upload diagnostics
        if: always() && steps.slots.outputs.slots != '0'
        uses: actions/upload-artifact@v4
        with:
          name: dioshablahoyia-animal-bible-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 2

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Dios Habla Hoy - fallo Shorts Animales y Biblia" --body "Falló el pack de 2 Shorts sobre animales sin habilitar otra voz. Revisar Actions run $GITHUB_RUN_ID."
