name: Dios Habla Hoy IA - Recuperar 3 Shorts faltantes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "triggers/dioshablahoyia-recover-missing.txt"

permissions:
  contents: write

concurrency:
  group: dioshablahoyia-recover-missing
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: .
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Algenib
      SPIRITUAL_MALE_GEMINI_VOICE: Algenib
      SPIRITUAL_VOICE_PROFILE: voz_de_luz_serena_original_v1
      SPIRITUAL_VOICE_BRAND: Voz de Luz
      SPIRITUAL_VOICEOVER_MODE: "true"
      SPIRITUAL_LIPSYNC_ENABLED: "false"
      SPIRITUAL_REQUIRE_PRIMARY_VOICE: "true"
      TTS_PROVIDER: gemini_tts
      TTS_FALLBACK_KOKORO: "false"
      KOKORO_VOICE: em_alex
      KOKORO_SPEED: "0.91"
      SPIRITUAL_SHORT_SECONDS: "60"
      SPIRITUAL_SHORT_SCENE_SECONDS: "10"
      SPIRITUAL_SHORT_AI_CLIPS: "0"
      SPIRITUAL_ALLOW_STILL_FALLBACK: "true"
      SPIRITUAL_FAST_RENDER: "true"
      SPIRITUAL_CTA_OVERLAY: "false"
      SPIRITUAL_REQUIRE_FRESH_VISUAL: "true"
      SPIRITUAL_VISUAL_VARIETY_LEVEL: maximum
      SPIRITUAL_EDITORIAL_VARIETY_LEVEL: high
      HF_REFERENCE_IMAGE_ENABLED: "true"
      HF_REFERENCE_EDITOR_ENABLED: "true"
      HF_REFERENCE_ZERO_SPACE: black-forest-labs/FLUX.1-Kontext-Dev
      HF_TEXT_ZERO_ENABLED: "true"
      HF_TEXT_ZERO_SPACE: black-forest-labs/FLUX.1-schnell
      HF_REFERENCE_ZERO_SPACE_FIRST: "true"
      HF_ZERO_AUTH_RETRY: "true"
      HF_REMOTE_CIRCUIT_BREAKER: "true"
      HF_INFERENCE_PROVIDER_ENABLED: "false"
      HF_ZERO_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_TOKEN: ""
      SPIRITUAL_REFERENCE_AVOID_RECENT: "100"
      DIOS_FAST_LOCAL_VISUAL_MODE: "false"
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      MUSIC_PROVIDER: local
      YOUTUBE_TOKEN_DIOSHABLAHOYIA: ${{ secrets.YOUTUBE_TOKEN_DIOSHABLAHOYIA }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install recovery runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1 fonts-dejavu-core >/dev/null
          python -m pip install -q --upgrade pip
          pip install -q \
            "google-genai>=2.3.0" \
            "google-api-python-client>=2.170.0" \
            "google-auth>=2.40.0" \
            "google-auth-oauthlib>=1.2.2" \
            "Pillow>=11.0.0" \
            "requests>=2.32.0" \
            "numpy<3,>=1.26" \
            "soundfile>=0.13.1" \
            "huggingface_hub<2,>=0.34.4" \
            "gradio_client<3,>=1.11.0"

      - name: Compile and validate recovery guardrails
        run: |
          test -n "$YOUTUBE_TOKEN_DIOSHABLAHOYIA"
          python -m py_compile scripts/recover_missing_dios_shorts.py scripts/publish_dios_fast.py
          python - <<'PY'
          from pathlib import Path
          from scripts.recover_missing_dios_shorts import TARGETS
          assert len(TARGETS) == 3
          assert len({x['old_id'] for x in TARGETS}) == 3
          assert all(len(x['lines']) == 6 for x in TARGETS)
          print('RECOVERY_GUARDS_OK')
          PY

      - name: Recover only IDs still missing from owner API
        id: recovery
        continue-on-error: true
        run: python scripts/recover_missing_dios_shorts.py

      - name: Persist successful recovery records
        if: always()
        shell: bash
        run: |
          test -f state/recovery_new_records.jsonl || exit 0
          cp state/recovery_new_records.jsonl /tmp/recovery_new_records.jsonl
          git config user.name "youtube-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p state
            touch state/history.jsonl
            while IFS= read -r RECORD; do
              [ -n "$RECORD" ] || continue
              if ! grep -Fqx "$RECORD" state/history.jsonl; then
                printf '%s\n' "$RECORD" >> state/history.jsonl
              fi
            done < /tmp/recovery_new_records.jsonl
            git add state/history.jsonl
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore: record recovered missing Dios Shorts"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

      - name: Upload recovery report and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dios-missing-short-recovery-${{ github.run_id }}
          path: |
            output/
            state/recovery_new_records.jsonl
          if-no-files-found: warn
          retention-days: 3

      - name: Fail if any requested recovery failed
        if: steps.recovery.outcome != 'success'
        run: exit 1
