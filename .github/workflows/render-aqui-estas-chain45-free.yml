name: Render Aqui Estas 4m30 FREE chained and publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar en @DemianVelo
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - .github/workflows/render-aqui-estas-chain45-free.yml

env:
  PYTHONPATH: .
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

permissions:
  contents: read
  actions: read

concurrency:
  group: aqui-estas-chain45-free
  cancel-in-progress: false

jobs:
  s1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -U gradio_client
      - run: python scripts/aqui_estas_chain45.py --section 1 --out audio/aqui_estas_045.wav
      - uses: actions/upload-artifact@v4
        with:
          name: aqui-estas-045
          path: audio/aqui_estas_045.wav
          retention-days: 5

  s2:
    needs: s1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: aqui-estas-045, path: input}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -U gradio_client
      - run: python scripts/aqui_estas_chain45.py --section 2 --seed-audio input/aqui_estas_045.wav --out audio/aqui_estas_090.wav
      - uses: actions/upload-artifact@v4
        with:
          name: aqui-estas-090
          path: audio/aqui_estas_090.wav
          retention-days: 5

  s3:
    needs: s2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: aqui-estas-090, path: input}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -U gradio_client
      - run: python scripts/aqui_estas_chain45.py --section 3 --seed-audio input/aqui_estas_090.wav --out audio/aqui_estas_135.wav
      - uses: actions/upload-artifact@v4
        with:
          name: aqui-estas-135
          path: audio/aqui_estas_135.wav
          retention-days: 5

  s4:
    needs: s3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: aqui-estas-135, path: input}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -U gradio_client
      - run: python scripts/aqui_estas_chain45.py --section 4 --seed-audio input/aqui_estas_135.wav --out audio/aqui_estas_180.wav
      - uses: actions/upload-artifact@v4
        with:
          name: aqui-estas-180-chain45
          path: audio/aqui_estas_180.wav
          retention-days: 5

  s5:
    needs: s4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: aqui-estas-180-chain45, path: input}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -U gradio_client
      - run: python scripts/aqui_estas_chain45.py --section 5 --seed-audio input/aqui_estas_180.wav --out audio/aqui_estas_225.wav
      - uses: actions/upload-artifact@v4
        with:
          name: aqui-estas-225
          path: audio/aqui_estas_225.wav
          retention-days: 5

  s6:
    needs: s5
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: aqui-estas-225, path: input}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -U gradio_client
      - run: python scripts/aqui_estas_chain45.py --section 6 --seed-audio input/aqui_estas_225.wav --out audio/Aqui_Estas_x_DemianVelo.wav
      - uses: actions/upload-artifact@v4
        with:
          name: aqui-estas-270-master
          path: audio/Aqui_Estas_x_DemianVelo.wav
          retention-days: 5

  produce:
    needs: s6
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      YOUTUBE_TOKEN_DEMIANVELO: ${{ secrets.YOUTUBE_TOKEN_DEMIANVELO }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PUBLISH_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: aqui-estas-270-master, path: input}
      - name: Install final production tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation2
          pip install requests google-api-python-client google-auth pillow gradio_client
      - name: Render 1080p cinematic video, CTR thumbnail and publish
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.render_aqui_estas_demianvelo import build_video, make_thumbnail, upload, media_duration
          audio=Path('input/Aqui_Estas_x_DemianVelo.wav')
          d=media_duration(audio)
          print('MASTER_DURATION',d)
          if not 180 <= d <= 300:
              raise RuntimeError(f'final song must be 3-5 minutes; got {d}')
          video,credits=build_video(audio,[])
          thumb=make_thumbnail(video)
          print('VIDEO_READY',video,media_duration(video),video.stat().st_size)
          print('THUMB_READY',thumb,thumb.stat().st_size)
          if os.environ.get('PUBLISH_INPUT','true').lower()=='true':
              vid=upload(video,thumb,credits)
              print('YOUTUBE_VIDEO_ID',vid)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aqui-estas-final-${{ github.run_id }}
          path: output/aqui_estas_demianvelo/
          if-no-files-found: warn
          retention-days: 5
