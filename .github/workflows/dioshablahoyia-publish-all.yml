name: Dios Habla Hoy IA - Completar 4 videos largos diarios

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "triggers/dioshablahoyia-publish-all.txt"

permissions:
  contents: write
  issues: write

concurrency:
  group: dioshablahoyia-long-publisher
  cancel-in-progress: false

jobs:
  publish-all:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: .
      TZ: America/Argentina/Buenos_Aires
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.6-flash
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Algenib
      SPIRITUAL_MALE_GEMINI_VOICE: Algenib
      SPIRITUAL_VOICE_PROFILE: voz_de_luz_serena_original_v1
      SPIRITUAL_VOICE_BRAND: Voz de Luz
      SPIRITUAL_VOICE_REFERENCE_MODE: fresh_github_reference_bank_no_speaker_clone
      SPIRITUAL_VOICEOVER_MODE: "true"
      SPIRITUAL_REQUIRE_PRIMARY_VOICE: "true"
      SPIRITUAL_LIPSYNC_ENABLED: "false"
      SPIRITUAL_LONG_LIPSYNC_ENABLED: "false"
      SPIRITUAL_REQUIRE_FRESH_VISUAL: "true"
      SPIRITUAL_ALLOW_STILL_FALLBACK: "true"
      SPIRITUAL_LONG_AI_CLIPS: "0"
      SPIRITUAL_VISUAL_VARIETY_LEVEL: maximum
      SPIRITUAL_EDITORIAL_VARIETY_LEVEL: high
      TTS_PROVIDER: gemini_tts
      TTS_FALLBACK_KOKORO: "false"
      KOKORO_VOICE: em_alex
      KOKORO_SPEED: "0.91"
      GEMINI_VIDEO_ENABLED: "false"
      HF_VIDEO_ENABLED: "false"
      HF_REFERENCE_IMAGE_ENABLED: "true"
      HF_REFERENCE_EDITOR_ENABLED: "true"
      HF_REFERENCE_ZERO_SPACE: black-forest-labs/FLUX.1-Kontext-Dev
      HF_TEXT_ZERO_ENABLED: "true"
      HF_TEXT_ZERO_SPACE: black-forest-labs/FLUX.1-schnell
      HF_REFERENCE_ZERO_SPACE_FIRST: "true"
      HF_ZERO_AUTH_RETRY: "true"
      HF_REMOTE_CIRCUIT_BREAKER: "true"
      HF_INFERENCE_PROVIDER_ENABLED: "false"
      HF_ZERO_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_TOKEN: ""
      SPIRITUAL_REFERENCE_AVOID_RECENT: "100"
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_TOKEN_DIOSHABLAHOYIA: ${{ secrets.YOUTUBE_TOKEN_DIOSHABLAHOYIA }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight long runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1 fonts-dejavu-core git >/dev/null
          python -m pip install -q --upgrade pip
          pip install -q "google-genai>=2.3.0" "google-api-python-client>=2.170.0" "google-auth>=2.40.0" "google-auth-oauthlib>=1.2.2" "Pillow>=11.0.0" "requests>=2.32.0" "numpy<3,>=1.26" "soundfile>=0.13.1" "huggingface_hub<2,>=0.34.4" "gradio_client<3,>=1.11.0"
      - name: Validate strict long publisher
        run: |
          test -n "$YOUTUBE_TOKEN_DIOSHABLAHOYIA"
          test -n "$HF_ZERO_TOKEN"
          test -f assets/dioshablahoyia/reference/jesus_reference_user_new_01.jpg
          test -f assets/dioshablahoyia/reference/jesus_reference_user_new_02.jpg
          test -f assets/dioshablahoyia/reference/jesus_reference_user_new_03.jpg
          test -f assets/dioshablahoyia/visual_reference/noah_ark_user_new_01.jpg
          python -m py_compile scripts/dioshablahoyia_catchup_longs.py scripts/publish_dios_long_fresh.py app/spiritual_long_fresh_visual.py
      - name: Generate and upload only missing long videos
        run: python scripts/dioshablahoyia_catchup_longs.py
      - name: Persist recovered long history
        if: success()
        shell: bash
        run: |
          RECORDS="/tmp/dios-catchup/new-long-records.jsonl"
          test -f "$RECORDS" || exit 0
          git config user.name "youtube-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p state
            touch state/dioshablahoyia_long_history.jsonl
            while IFS= read -r record; do
              test -n "$record" || continue
              grep -Fqx "$record" state/dioshablahoyia_long_history.jsonl || printf '%s\n' "$record" >> state/dioshablahoyia_long_history.jsonl
            done < "$RECORDS"
            git add state/dioshablahoyia_long_history.jsonl
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore: catch up Dios Habla Hoy long videos"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Upload batch artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dioshablahoyia-publish-all-${{ github.run_id }}
          path: output/
          retention-days: 3
      - name: Report strict long catch-up failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Dios Habla Hoy - faltan videos largos del objetivo 4 por dia" --body "No se sustituyo Voz de Luz ni se reutilizaron visuales antiguos. Revisar Actions run $GITHUB_RUN_ID."
