name: Render and publish Aleluya Pop 2026 FREE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/render_hallelujah_pop_2026.py
      - .github/workflows/render-aleluya-zero-v4.yml

permissions:
  contents: read

concurrency:
  group: render-aleluya-pop-2026-free
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: .
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_TOKEN_DEMIANVELO: ${{ secrets.YOUTUBE_TOKEN_DEMIANVELO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FREE production dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install requests gradio_client google-api-python-client google-auth

      - name: Render song, cinematic video and publish to DemianVelo
        run: python scripts/render_hallelujah_pop_2026.py --publish

      - name: Upload production artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demianvelo-hallelujah-pop-2026-${{ github.run_id }}
          path: output/hallelujah_pop_2026/
          if-no-files-found: warn
          retention-days: 5
