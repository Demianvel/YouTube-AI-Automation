name: Dios Habla Hoy IA - 2 videos largos por semana

on:
  workflow_dispatch:
    inputs:
      minutes:
        required: true
        default: "10"
        type: choice
        options: ["10", "15", "25", "30"]
      publish:
        required: true
        default: true
        type: boolean
  push:
    paths: ["triggers/dioshablahoyia-long.txt"]
  schedule:
    # GitHub cron usa UTC. 18:00 UTC = 15:00 en Argentina (UTC-3).
    # Normalmente publica sabado y domingo. El limite semanal impide superar 2 largos.
    - cron: "0 18 * * 6"
    - cron: "0 18 * * 0"

permissions:
  contents: write
  issues: write

concurrency:
  group: dioshablahoyia-long-publisher
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: .
      TZ: America/Argentina/Buenos_Aires
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.6-flash
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Algenib
      SPIRITUAL_MALE_GEMINI_VOICE: Algenib
      SPIRITUAL_VOICE_PROFILE: voz_de_luz_serena_original_v1
      SPIRITUAL_VOICE_BRAND: Voz de Luz
      SPIRITUAL_VOICE_REFERENCE_MODE: fresh_github_reference_bank_no_speaker_clone
      SPIRITUAL_VOICE_LOCKED: "true"
      SPIRITUAL_VOICEOVER_MODE: "true"
      SPIRITUAL_REQUIRE_PRIMARY_VOICE: "true"
      SPIRITUAL_LIPSYNC_ENABLED: "false"
      SPIRITUAL_LONG_LIPSYNC_ENABLED: "false"
      SPIRITUAL_REQUIRE_FRESH_VISUAL: "true"
      SPIRITUAL_VISUAL_PHASH_MAX_DISTANCE: "7"
      SPIRITUAL_ALLOW_FREE_FRESH_FALLBACK: "true"
      SPIRITUAL_ALLOW_STILL_FALLBACK: "true"
      SPIRITUAL_VISUAL_VARIETY_LEVEL: maximum
      SPIRITUAL_EDITORIAL_VARIETY_LEVEL: high
      TTS_PROVIDER: gemini_tts
      TTS_FALLBACK_KOKORO: "false"
      KOKORO_VOICE: em_alex
      KOKORO_SPEED: "0.91"
      GEMINI_VIDEO_ENABLED: "false"
      HF_VIDEO_ENABLED: "false"
      HF_REFERENCE_IMAGE_ENABLED: "true"
      HF_REFERENCE_EDITOR_ENABLED: "true"
      HF_REFERENCE_ZERO_SPACE: black-forest-labs/FLUX.1-Kontext-Dev
      HF_TEXT_ZERO_ENABLED: "true"
      HF_TEXT_ZERO_SPACE: black-forest-labs/FLUX.1-schnell
      HF_REFERENCE_ZERO_SPACE_FIRST: "true"
      HF_ZERO_AUTH_RETRY: "true"
      HF_REMOTE_CIRCUIT_BREAKER: "true"
      HF_INFERENCE_PROVIDER_ENABLED: "false"
      HF_ZERO_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_TOKEN: ""
      SPIRITUAL_REFERENCE_AVOID_RECENT: "100"
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_TOKEN_DIOSHABLAHOYIA: ${{ secrets.YOUTUBE_TOKEN_DIOSHABLAHOYIA }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enforce weekly maximum of two long videos
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("America/Argentina/Buenos_Aires")
          now = datetime.now(tz)
          current = now.isocalendar()
          count = 0
          path = Path("state/dioshablahoyia_long_history.jsonl")
          if path.exists():
              for raw in path.read_text(encoding="utf-8").splitlines():
                  try:
                      row = json.loads(raw)
                      if row.get("channel") != "dioshablahoyia" or row.get("content_type") != "long":
                          continue
                      if row.get("status") != "uploaded" and not row.get("video_id"):
                          continue
                      stamp = row.get("created_at")
                      if not stamp:
                          continue
                      dt = datetime.fromisoformat(stamp.replace("Z", "+00:00")).astimezone(tz)
                      iso = dt.isocalendar()
                      if (iso.year, iso.week) == (current.year, current.week):
                          count += 1
                  except Exception:
                      continue
          skip = count >= 2
          print(f"Videos largos ya publicados esta semana: {count}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"SKIP_LONG={'true' if skip else 'false'}\n")
          PY

      - name: Resolve weekend duration
        if: env.SKIP_LONG != 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MINUTES="${{ inputs.minutes }}"
            PUBLISH="${{ inputs.publish }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            WEEK="$(date -u +%V)"
            PARITY=$((10#$WEEK % 2))
            DOW="$(date -u +%u)"
            if [ "$DOW" = "6" ]; then
              if [ "$PARITY" = "0" ]; then MINUTES=10; else MINUTES=25; fi
            elif [ "$DOW" = "7" ]; then
              if [ "$PARITY" = "0" ]; then MINUTES=15; else MINUTES=30; fi
            else
              echo "Este workflow programado solo debe publicar sabados o domingos."
              exit 0
            fi
            PUBLISH=true
          else
            MINUTES=10
            PUBLISH=true
          fi

          case "$MINUTES" in
            10) STYLE=biblical_story ;;
            15) STYLE=prayer ;;
            25) STYLE=biblical_reflection ;;
            30) STYLE=night_prayer ;;
            *) echo "Duracion no permitida: $MINUTES"; exit 1 ;;
          esac

          echo "MINUTES=$MINUTES" >> "$GITHUB_ENV"
          echo "PUBLISH=$PUBLISH" >> "$GITHUB_ENV"
          echo "SPIRITUAL_NARRATION_STYLE=$STYLE" >> "$GITHUB_ENV"
          echo "Video largo: ${MINUTES} minutos"

      - name: Install runtime
        if: env.SKIP_LONG != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1 fonts-dejavu-core git >/dev/null
          python -m pip install -q --upgrade pip
          pip install -q "google-genai>=2.3.0" "google-api-python-client>=2.170.0" "google-auth>=2.40.0" "google-auth-oauthlib>=1.2.2" "Pillow>=11.0.0" "requests>=2.32.0" "numpy<3,>=1.26" "soundfile>=0.13.1" "huggingface_hub<2,>=0.34.4" "gradio_client<3,>=1.11.0"
          test "$GEMINI_TTS_VOICE" = "Algenib"
          test "$SPIRITUAL_REQUIRE_PRIMARY_VOICE" = "true"
          test "$SPIRITUAL_VOICE_LOCKED" = "true"
          python -m py_compile app/spiritual_long_fresh_visual.py app/spiritual_long_resilience.py app/spiritual_tts.py app/dios_visual_integrity.py scripts/publish_dios_long_fresh.py

      - name: Publish fresh long video
        if: env.SKIP_LONG != 'true'
        shell: bash
        run: |
          test -n "$YOUTUBE_TOKEN_DIOSHABLAHOYIA"
          test -n "$HF_ZERO_TOKEN"
          EXTRA=""; if [ "$PUBLISH" = "true" ]; then EXTRA="--publish"; fi
          python scripts/publish_dios_long_fresh.py --minutes "$MINUTES" $EXTRA

      - name: Persist history
        if: success() && env.SKIP_LONG != 'true'
        shell: bash
        run: |
          H=state/dioshablahoyia_long_history.jsonl; test -f "$H" || exit 0; R="$(tail -n 1 "$H")"
          git config user.name youtube-ai-bot; git config user.email actions@users.noreply.github.com
          for a in 1 2 3 4 5; do git fetch origin main; git reset --hard origin/main; mkdir -p state; touch "$H"; grep -Fqx "$R" "$H" || printf '%s\n' "$R" >> "$H"; git add "$H"; if git diff --cached --quiet; then exit 0; fi; git commit -m "chore: update Dios long history"; git push origin HEAD:main && exit 0; done; exit 1

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dioshablahoyia-long-${{ github.run_id }}
          path: output/dioshablahoyia-long/
          retention-days: 3
