name: Dios Habla Hoy IA long-form

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Duracion objetivo del video
        required: true
        default: "10"
        type: choice
        options:
          - "10"
          - "15"
          - "20"
          - "30"
      publish:
        description: Publicar en YouTube al terminar
        required: true
        default: false
        type: boolean
  push:
    paths:
      - "triggers/dioshablahoyia-long.txt"
  schedule:
    # Argentina UTC-3: 12:00, 15:00, 18:00 y 21:00.
    - cron: "0 15 * * *"
    - cron: "0 18 * * *"
    - cron: "0 21 * * *"
    - cron: "0 0 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: dioshablahoyia-long-publisher
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: .
      RENDER_WORKER: Motor Celestial Cinema
      MOTION_DIRECTOR_WORKER: Director Paz Viva
      PUBLISHER_WORKER: Publicador Reino 4x10
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.6-flash
      GEMINI_VIDEO_ENABLED: "false"
      GEMINI_VIDEO_MODEL: gemini-omni-flash-preview
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Algenib
      SPIRITUAL_MALE_GEMINI_VOICE: Algenib
      SPIRITUAL_VOICE_PROFILE: voz_de_luz_serena_original_v1
      SPIRITUAL_VOICE_BRAND: Voz de Luz
      SPIRITUAL_VOICE_REFERENCE_MODE: two_reference_style_blend_no_speaker_clone
      SPIRITUAL_VOICEOVER_MODE: "true"
      SPIRITUAL_REQUIRE_PRIMARY_VOICE: "false"
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      POLLINATIONS_IMAGE_MODEL: flux
      HF_VIDEO_ENABLED: "false"
      HF_ZERO_VIDEO_SPACE: Lightricks/LTX-2-3
      HF_ZERO_RETRIES: "0"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_VIDEO_PROVIDER: auto
      HF_VIDEO_MODEL: Wan-AI/Wan2.2-TI2V-5B
      HF_IMAGE_PROVIDER: auto
      HF_IMAGE_MODEL: black-forest-labs/FLUX.1-schnell
      SPIRITUAL_REQUIRE_LIVE_ACTION: "false"
      SPIRITUAL_ALLOW_STILL_FALLBACK: "true"
      SPIRITUAL_LONG_AI_CLIPS: "0"
      SPIRITUAL_LONG_LIPSYNC_ENABLED: "false"
      SPIRITUAL_LIPSYNC_ENABLED: "false"
      SPIRITUAL_CTA_OVERLAY: "true"
      SPIRITUAL_VISUAL_VARIETY_LEVEL: high
      SPIRITUAL_EDITORIAL_VARIETY_LEVEL: high
      TTS_PROVIDER: gemini_tts
      TTS_FALLBACK_KOKORO: "true"
      KOKORO_VOICE: em_alex
      SPIRITUAL_MALE_KOKORO_VOICE: em_alex
      KOKORO_SPEED: "0.93"
      YOUTUBE_TOKEN_DIOSHABLAHOYIA: ${{ secrets.YOUTUBE_TOKEN_DIOSHABLAHOYIA }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Resolve manual or daily settings
        shell: bash
        run: |
          STYLE="auto"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MINUTES="${{ inputs.minutes }}"
            PUBLISH="${{ inputs.publish }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "0 15 * * *") MINUTES="10"; STYLE="biblical_story" ;;
              "0 18 * * *") MINUTES="15"; STYLE="prayer" ;;
              "0 21 * * *") MINUTES="20"; STYLE="biblical_reflection" ;;
              "0 0 * * *") MINUTES="30"; STYLE="night_prayer" ;;
              *) MINUTES="10"; STYLE="auto" ;;
            esac
            PUBLISH="true"
          else
            MINUTES="10"
            PUBLISH="true"
            STYLE="auto"
          fi
          echo "MINUTES=$MINUTES" >> "$GITHUB_ENV"
          echo "PUBLISH=$PUBLISH" >> "$GITHUB_ENV"
          echo "SPIRITUAL_NARRATION_STYLE=$STYLE" >> "$GITHUB_ENV"
          echo "Long-form settings: ${MINUTES}min, style=${STYLE}, publish=${PUBLISH}"

      - name: Skip a duration already published today
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("America/Argentina/Buenos_Aires")
          today = datetime.now(tz).date()
          minutes = int(os.environ["MINUTES"])
          history = Path("state/dioshablahoyia_long_history.jsonl")
          exists = False
          if history.exists():
              for raw in history.read_text(encoding="utf-8").splitlines():
                  try:
                      row = json.loads(raw)
                      created = datetime.fromisoformat(str(row.get("created_at", "")).replace("Z", "+00:00"))
                      created = created.astimezone(tz).date()
                  except Exception:
                      continue
                  if created == today and int(row.get("minutes", 0)) == minutes and row.get("status") == "uploaded":
                      exists = True
                      break
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"SKIP_LONG={'true' if exists else 'false'}\n")
          print(f"Already uploaded today for {minutes} minutes: {exists}")
          PY

      - name: Install media and Python dependencies
        if: env.SKIP_LONG != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 fonts-dejavu-core git
          python -m pip install --upgrade pip
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Verify required configuration
        if: env.SKIP_LONG != 'true'
        shell: bash
        run: |
          if [ "$PUBLISH" = "true" ]; then
            test -n "$YOUTUBE_TOKEN_DIOSHABLAHOYIA" || { echo "Falta YOUTUBE_TOKEN_DIOSHABLAHOYIA"; exit 1; }
          fi

      - name: Generate and optionally publish long video
        if: env.SKIP_LONG != 'true'
        shell: bash
        run: |
          EXTRA=""
          if [ "$PUBLISH" = "true" ]; then
            EXTRA="--publish"
          fi
          python -m app.spiritual_long_resilient_runner --minutes "$MINUTES" $EXTRA

      - name: Persist spiritual anti-repeat history
        if: env.SKIP_LONG != 'true' && success()
        shell: bash
        run: |
          HISTORY="state/dioshablahoyia_long_history.jsonl"
          if [ ! -f "$HISTORY" ]; then
            exit 0
          fi
          NEW_RECORD="$(tail -n 1 "$HISTORY")"
          git config user.name "youtube-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p state
            touch "$HISTORY"
            if ! grep -Fqx "$NEW_RECORD" "$HISTORY"; then
              printf '%s\n' "$NEW_RECORD" >> "$HISTORY"
            fi
            git add "$HISTORY"
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "chore: update Dios Habla Hoy long history"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1

      - name: Confirm daily duplicate skip
        if: env.SKIP_LONG == 'true'
        run: echo "Esta duracion ya fue publicada hoy; se omite para evitar duplicados."

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dioshablahoyia-${{ github.run_id }}
          path: output/dioshablahoyia-long/
          retention-days: 3

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Automation failure: Dios Habla Hoy IA long-form" --body "El workflow long-form fallo. Revisar Actions run $GITHUB_RUN_ID."
