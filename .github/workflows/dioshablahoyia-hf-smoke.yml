name: Dios Habla Hoy IA - HF reference smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dioshablahoyia-hf-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REFERENCE_IMAGE_ENABLED: "true"
      HF_REFERENCE_IMAGE_PROVIDER: auto
      HF_REFERENCE_IMAGE_MODEL: black-forest-labs/FLUX.1-Kontext-dev
      HF_REFERENCE_ZERO_SPACE: Qwen/Qwen-Image-Edit
      SPIRITUAL_REFERENCE_AVOID_RECENT: "8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal Hugging Face image dependencies
        run: pip install "huggingface_hub>=0.34.4,<2" "Pillow>=11" "gradio_client>=1.11,<3"

      - name: Verify HF token is configured
        shell: bash
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN_MISSING"
            exit 2
          fi
          echo "HF_TOKEN_PRESENT"

      - name: Inspect ZeroGPU image-edit API
        shell: bash
        run: |
          python - <<'PY'
          from gradio_client import Client
          client = Client("Qwen/Qwen-Image-Edit", verbose=False)
          print(client.view_api(return_format="dict"))
          PY
