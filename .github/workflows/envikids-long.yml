name: EnViKids 5 and 10 minute videos

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Duracion
        required: true
        default: "5"
        type: choice
        options:
          - "5"
          - "10"
      publish:
        description: Publicar si el OAuth de EnViKids esta conectado
        required: true
        default: false
        type: boolean
  schedule:
    # Argentina UTC-3: 13:30 todos los dias. Alterna 5 y 10 minutos.
    - cron: "30 16 * * *"

permissions:
  contents: read

concurrency:
  group: envikids-long
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: .
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.6-flash
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      POLLINATIONS_IMAGE_MODEL: flux
      KOKORO_KIDS_VOICE: ef_dora
      KOKORO_KIDS_SPEED: "1.03"
      YOUTUBE_TOKEN_ENVIKIDS: ${{ secrets.YOUTUBE_TOKEN_ENVIKIDS }}
    steps:
      - uses: actions/checkout@v4

      - name: Select duration and publish mode
        id: select
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MINUTES="${{ inputs.minutes }}"
            WANT_PUBLISH="${{ inputs.publish }}"
          else
            DAY="$(date -u +%j)"
            SLOT=$((10#$DAY % 2))
            if [ "$SLOT" -eq 0 ]; then
              MINUTES="5"
            else
              MINUTES="10"
            fi
            WANT_PUBLISH="true"
          fi

          SHOULD_RUN=true
          PUBLISH=false
          if [ "${{ github.event_name }}" = "schedule" ] && [ -z "$YOUTUBE_TOKEN_ENVIKIDS" ]; then
            SHOULD_RUN=false
            echo "OAuth EnViKids ausente: ejecucion programada omitida para no gastar generacion."
          elif [ "$WANT_PUBLISH" = "true" ] && [ -n "$YOUTUBE_TOKEN_ENVIKIDS" ]; then
            PUBLISH=true
          fi

          echo "minutes=$MINUTES" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "EnViKids ${MINUTES}min / run=${SHOULD_RUN} / publish=${PUBLISH}"

      - uses: actions/setup-python@v5
        if: steps.select.outputs.should_run == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install EnViKids generation dependencies
        if: steps.select.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate EnViKids long video
        if: steps.select.outputs.should_run == 'true'
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ steps.select.outputs.publish }}" = "true" ]; then EXTRA="--publish"; fi
          python -m app.kids_long_pipeline --minutes "${{ steps.select.outputs.minutes }}" $EXTRA

      - name: Upload compact artifact
        if: steps.select.outputs.should_run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: envikids-${{ steps.select.outputs.minutes }}min-${{ github.run_id }}
          path: |
            output/envikids-long/**/envikids_*min.mp4
            output/envikids-long/**/metadata.json
            output/envikids-long/**/result.json
            output/envikids-long/**/thumbnail_1.jpg
          if-no-files-found: warn
          retention-days: 3
