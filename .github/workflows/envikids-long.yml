name: EnViKids 5 and 10 minute videos

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Duracion
        required: true
        default: "5"
        type: choice
        options:
          - "5"
          - "10"
      publish:
        description: Publicar si el OAuth de EnViKids esta conectado
        required: true
        default: false
        type: boolean
  schedule:
    # Argentina UTC-3: miercoles 15:30 -> 5 min, domingo 15:30 -> 10 min.
    - cron: "30 18 * * 3"
    - cron: "30 18 * * 0"

permissions:
  contents: read

concurrency:
  group: envikids-long
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: .
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.6-flash
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      POLLINATIONS_IMAGE_MODEL: flux
      KOKORO_KIDS_VOICE: ef_dora
      KOKORO_KIDS_SPEED: "1.03"
      YOUTUBE_TOKEN_ENVIKIDS: ${{ secrets.YOUTUBE_TOKEN_ENVIKIDS }}
    steps:
      - uses: actions/checkout@v4

      - name: Select duration and publish mode
        id: select
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MINUTES="${{ inputs.minutes }}"
            WANT_PUBLISH="${{ inputs.publish }}"
          elif [ "${{ github.event.schedule }}" = "30 18 * * 3" ]; then
            MINUTES="5"
            WANT_PUBLISH="true"
          else
            MINUTES="10"
            WANT_PUBLISH="true"
          fi
          PUBLISH=false
          if [ "$WANT_PUBLISH" = "true" ] && [ -n "$YOUTUBE_TOKEN_ENVIKIDS" ]; then PUBLISH=true; fi
          echo "minutes=$MINUTES" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "EnViKids ${MINUTES}min / publish=${PUBLISH}"
          if [ -z "$YOUTUBE_TOKEN_ENVIKIDS" ]; then
            echo "OAuth EnViKids ausente: se puede generar, pero no publicar."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install EnViKids generation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate EnViKids long video
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ steps.select.outputs.publish }}" = "true" ]; then EXTRA="--publish"; fi
          python -m app.kids_long_pipeline --minutes "${{ steps.select.outputs.minutes }}" $EXTRA

      - name: Upload compact artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: envikids-${{ steps.select.outputs.minutes }}min-${{ github.run_id }}
          path: |
            output/envikids-long/**/envikids_*min.mp4
            output/envikids-long/**/metadata.json
            output/envikids-long/**/result.json
            output/envikids-long/**/thumbnail_1.jpg
          if-no-files-found: warn
          retention-days: 3
