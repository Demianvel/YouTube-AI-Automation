name: Validate spiritual quality

on:
  workflow_dispatch:
  push:
    paths:
      - "app/spiritual_tts.py"
      - "app/spiritual_quality.py"
      - "app/spiritual_source_growth_engine.py"
      - "app/spiritual_content_guard.py"
      - "app/spiritual_image.py"
      - "app/spiritual_hf_video.py"
      - "app/spiritual_long_resilient_runner.py"
      - "app/spiritual_engagement.py"
      - "scripts/dioshablahoyia_comment_responder.py"
      - "config/topic_families.json"
      - ".github/workflows/shorts.yml"
      - ".github/workflows/dioshablahoyia-long.yml"
      - ".github/workflows/validate-spiritual-quality.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            app/spiritual_tts.py \
            app/spiritual_quality.py \
            app/spiritual_source_growth_engine.py \
            app/spiritual_content_guard.py \
            app/spiritual_image.py \
            app/spiritual_hf_video.py \
            app/spiritual_long_resilient_runner.py \
            app/spiritual_engagement.py \
            scripts/dioshablahoyia_comment_responder.py

      - name: Test dynamic metadata and anti-repeat behavior
        env:
          GITHUB_RUN_ID: "987654321"
          GITHUB_RUN_NUMBER: "321"
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from app.spiritual_content_guard import (
              enforce_spiritual_topic_guard,
              validate_spiritual_upload_guard,
              _youtube_tag_cost,
          )
          from app.spiritual_engagement import engagement_comment
          from app.spiritual_quality import enforce_spiritual_metadata
          from app.spiritual_source_growth_engine import ground_and_optimize_spiritual_metadata

          sample = {
              "topic": "Jesús calma la tormenta y enseña a confiar en medio del miedo",
              "content_family": "Jesus calma la tormenta",
              "title": "Cuando necesitás paz: Marcos 4:35-41",
              "description": "Reflexión sobre Jesús, Dios y la Biblia.",
              "scenes": [
                  {
                      "narration": f"Escena {i + 1}: Jesús y la Biblia nos enseñan a confiar en Dios.",
                      "visual_prompt": "Jesus in a biblical reflection about God",
                  }
                  for i in range(6)
              ],
          }
          previous = [
              {"title": "Cuando necesitás paz: Marcos 4:35-41"},
              {"title": "Una luz para el momento que estás atravesando"},
              {"title": "La paz de Dios en medio de la incertidumbre"},
          ]

          quality = enforce_spiritual_metadata(sample, previous)
          optimized = ground_and_optimize_spiritual_metadata(
              quality, previous, content_type="short"
          )
          guarded = enforce_spiritual_topic_guard(optimized)

          signatures = guarded.get("visual_variety_signatures") or []
          recent_titles = {item["title"] for item in previous}
          assert len(signatures) == 6, signatures
          assert len(set(signatures)) == 6, signatures
          assert guarded["title"] not in recent_titles, guarded["title"]
          assert len(guarded.get("title_variants") or []) == 3
          assert all(title not in recent_titles for title in guarded["title_variants"])
          assert len(set(guarded["title_variants"])) == len(guarded["title_variants"])
          assert len(guarded.get("hook_variants") or []) == 3
          assert len(set(guarded["hook_variants"])) == 3
          assert guarded.get("seo_title_history_guard_passed") is True
          assert guarded.get("voice_profile") == "voz_de_luz_serena_original_v1"
          assert guarded.get("voice_brand") == "Voz de Luz"
          assert 3 <= len(guarded.get("hashtags") or []) <= 5
          assert "#Dios" in guarded["hashtags"]
          assert "#Shorts" in guarded["hashtags"]
          assert "#VideoCristiano" not in guarded["hashtags"]
          assert _youtube_tag_cost(guarded["tags"]) <= 500
          assert guarded.get("youtube_tag_family") in {"peace", "prayer", "jesus", "bible", "strength", "love"}

          long_sample = {
              "topic": "La paz de Jesús en medio de la ansiedad",
              "content_family": "reflexion biblica profunda",
              "title": "Jesús y la paz que permanece",
              "description": "Video cristiano original sobre Dios, Jesús y la Biblia.",
              "bible_reference": "Juan 14:27",
              "target_minutes": 10,
              "sections": [
                  {
                      "narration": "Jesús nos enseña en la Biblia a confiar en la paz de Dios.",
                      "visual_prompt": "Jesus walking beside living water in a biblical reflection about God",
                  },
                  {
                      "narration": "La Palabra de Dios ofrece esperanza para la vida cotidiana.",
                      "visual_prompt": "Open Bible in natural light as a symbol of God's guidance",
                  },
              ],
              "source_credits": [],
              "external_media_allowed": False,
              "generated_visual_provider": ["local_project_original", "local_project_original"],
          }
          validate_spiritual_upload_guard(long_sample)
          assert long_sample.get("voice_profile") == "voz_de_luz_serena_original_v1"
          assert long_sample.get("voice_brand") == "Voz de Luz"
          assert "#VideoCristiano" in long_sample["hashtags"]
          assert "#Shorts" not in long_sample["hashtags"]
          assert _youtube_tag_cost(long_sample["tags"]) <= 500
          assert not any(tag.startswith("Shorts") for tag in long_sample["tags"])
          assert "creaciones artísticas digitales" in long_sample["description"]
          assert long_sample.get("youtube_safety_guard_format") == "long"

          comments = {
              engagement_comment(f"Marcos 4 esperanza prueba {i}")
              for i in range(40)
          }
          assert len(comments) >= 20, len(comments)
          assert all("milagro garantizado" not in comment.lower() for comment in comments)

          families = json.loads(Path("config/topic_families.json").read_text(encoding="utf-8"))
          spiritual_topics = families.get("dioshablahoyia") or []
          assert len(spiritual_topics) >= 80, len(spiritual_topics)
          normalized_topics = {" ".join(topic.lower().split()) for topic in spiritual_topics}
          assert len(normalized_topics) == len(spiritual_topics), "Hay temas espirituales duplicados"
          forbidden = (
              "casino", "apuestas", "bitcoin", "criptomoneda", "futbol", "formula 1",
              "celebridad", "chisme", "pornografia", "suicidio", "narcotrafico",
              "partido politico", "elecciones", "review de producto",
          )
          assert all(not any(term in topic.lower() for term in forbidden) for topic in spiritual_topics), "Tema fuera del alcance seguro del canal"

          print({
              "short_title": guarded["title"],
              "title_variants": guarded["title_variants"],
              "short_hashtags": guarded["hashtags"],
              "long_hashtags": long_sample["hashtags"],
              "short_tag_cost": _youtube_tag_cost(guarded["tags"]),
              "long_tag_cost": _youtube_tag_cost(long_sample["tags"]),
              "unique_visuals": len(set(signatures)),
              "unique_engagement_samples": len(comments),
              "spiritual_topics": len(spiritual_topics),
          })
          PY
