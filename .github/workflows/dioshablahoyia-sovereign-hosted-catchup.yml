name: Dios Habla Hoy - Catch-up soberano sin cuotas

on:
  workflow_dispatch:
  schedule:
    # 09:17, 15:17 y 21:17 de Argentina (UTC-3). Si ya hay 10/10,
    # el job corta antes de instalar el runtime pesado.
    - cron: "17 0,12,18 * * *"
  push:
    branches: [main]
    paths:
      - "triggers/dioshablahoyia-sovereign-catchup-now.txt"

permissions:
  contents: write
  issues: write

concurrency:
  group: dioshablahoyia-short-publisher
  cancel-in-progress: false

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: .
      TZ: America/Argentina/Buenos_Aires
      CHANNEL: dioshablahoyia
      CONTENT_MODE: voice
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      DIFFUSERS_OFFLINE: "1"
      DIOS_SOVEREIGN_OFFLINE: "true"
      DIOS_FORCE_ONE_PREMIUM_V5: ${{ github.event_name == 'push' && 'true' || 'false' }}
      # Visual/video generation remains local. Only the established Voz de Luz /
      # Algenib TTS may use Gemini; if unavailable the publisher falls back to the
      # local Piper model instead of changing to an unrelated voice.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Algenib
      SPIRITUAL_MALE_GEMINI_VOICE: Algenib
      HF_TOKEN: ""
      HF_ZERO_TOKEN: ""
      PEXELS_API_KEY: ""
      POLLINATIONS_API_KEY: ""
      GEMINI_VIDEO_ENABLED: "false"
      HF_VIDEO_ENABLED: "false"
      HF_REFERENCE_IMAGE_ENABLED: "false"
      HF_REFERENCE_EDITOR_ENABLED: "false"
      HF_TEXT_ZERO_ENABLED: "false"
      HF_INFERENCE_PROVIDER_ENABLED: "false"
      TTS_PROVIDER: gemini_tts
      TTS_FALLBACK_KOKORO: "false"
      SPIRITUAL_VOICE_LOCKED: "true"
      SPIRITUAL_REQUIRE_PRIMARY_VOICE: "true"
      SPIRITUAL_VOICE_BRAND: Voz de Luz
      SPIRITUAL_VOICE_PROFILE: voz_de_luz_serena_original_v1
      SPIRITUAL_VISUAL_REFERENCE_PROFILE: dios-photoreal-human-v5
      SPIRITUAL_ALLOW_LOCAL_PROCEDURAL_VISUAL: "false"
      SPIRITUAL_ALLOW_STILL_FALLBACK: "true"
      SPIRITUAL_REQUIRE_FRESH_VISUAL: "true"
      SPIRITUAL_VISUAL_PHASH_MAX_DISTANCE: "18"
      SPIRITUAL_CTA_OVERLAY: "false"
      SPIRITUAL_SHORT_SECONDS: "60"
      SPIRITUAL_SHORT_SCENE_SECONDS: "10"
      DIOS_PIPER_TARGET_WPM: "132"
      DIOS_PIPER_LENGTH_SCALE: "1.12"
      DIOS_PIPER_SENTENCE_SILENCE: "0.04"
      DIOS_SOVEREIGN_SLOT_ATTEMPTS: "3"
      MUSIC_PROVIDER: local
      YOUTUBE_TOKEN_DIOSHABLAHOYIA: ${{ secrets.YOUTUBE_TOKEN_DIOSHABLAHOYIA }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check today's persisted Short target before heavy setup
        id: quota
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          history = Path('state/history.jsonl')
          tz = ZoneInfo('America/Argentina/Buenos_Aires')
          today = datetime.now(tz).date()
          count = 0
          if history.exists():
              for raw in history.read_text(encoding='utf-8').splitlines():
                  try:
                      row = json.loads(raw)
                      dt = datetime.fromisoformat(str(row.get('created_at', '')).replace('Z', '+00:00'))
                      if dt.tzinfo is None:
                          dt = dt.replace(tzinfo=ZoneInfo('UTC'))
                  except Exception:
                      continue
                  if (
                      row.get('channel') == 'dioshablahoyia'
                      and dt.astimezone(tz).date() == today
                      and (str(row.get('status') or '').lower() == 'uploaded' or bool(row.get('video_id')))
                  ):
                      count += 1
          force_one = os.getenv('DIOS_FORCE_ONE_PREMIUM_V5', '').strip().lower() == 'true'
          normal_missing = max(0, 10 - count)
          missing = max(1 if force_one else 0, normal_missing)
          print(f"count={count}")
          print(f"missing={missing}")
          print(f"force_one={'true' if force_one else 'false'}")
          PY
          echo "Persistidos hoy: ${{ steps.quota.outputs.count || 'calculando' }}/10"
          echo "Forzar pieza v5 manual: ${{ steps.quota.outputs.force_one || 'false' }}"

      - name: Daily target already complete
        if: steps.quota.outputs.missing == '0'
        run: echo "Dios Habla Hoy ya tiene 10/10 Shorts persistidos hoy; no se inicia generación programada."

      - name: Install premium hosted runtime
        if: steps.quota.outputs.missing != '0'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1 fonts-dejavu-core git >/dev/null
          python -m pip install -q --upgrade pip
          pip install -q \
            "google-genai>=2.3.0" \
            "google-api-python-client>=2.170.0" \
            "google-auth>=2.40.0" \
            "google-auth-oauthlib>=1.2.2" \
            "Pillow>=11.0.0" \
            "numpy<3,>=1.26" \
            "soundfile>=0.13.1" \
            "huggingface_hub<2,>=0.34.4" \
            "gradio-client>=1.8.0" \
            "piper-tts>=1.2.0"

      - name: Bootstrap local voice fallback weights
        if: steps.quota.outputs.missing != '0'
        env:
          HF_HUB_OFFLINE: "0"
        run: |
          mkdir -p models/dios_sovereign
          python scripts/dios_sovereign_bootstrap_voice.py --model-root models/dios_sovereign
          test -s models/dios_sovereign/voice/voz_de_luz_local.onnx
          test -s models/dios_sovereign/voice/voz_de_luz_local.onnx.json
          command -v piper

      - name: Validate photoreal v5 media stack
        if: steps.quota.outputs.missing != '0'
        run: |
          python -m py_compile \
            app/dios_photoreal_v5.py \
            app/dios_sovereign_ai.py \
            app/dios_sovereign_voice.py \
            app/dios_sovereign_packaging.py \
            app/dios_sovereign_scene.py \
            app/dios_sovereign_visual_v3.py \
            app/hf_primary_router.py \
            scripts/publish_dios_sovereign.py \
            scripts/publish_dios_premium_v5.py \
            scripts/dioshablahoyia_sovereign_catchup_shorts.py
          test -n "$YOUTUBE_TOKEN_DIOSHABLAHOYIA"
          for ref in \
            assets/dioshablahoyia/reference/jesus_reference_a.jpg \
            assets/dioshablahoyia/reference/jesus_reference_b.jpg \
            assets/dioshablahoyia/reference/jesus_reference_c.jpg \
            assets/dioshablahoyia/reference/jesus_divine_reference_v5.jpg.b64; do
            test -s "$ref"
          done
          python - <<'PY'
          import json
          from PIL import Image
          import app.hf_primary_router as router
          from app.dios_photoreal_v5 import MODEL_VERSION, materialize_approved_reference
          from app.dios_sovereign_scene import ENGINE_VERSION

          ref = materialize_approved_reference()
          with Image.open(ref) as image:
              assert image.width >= 300 and image.height >= 500
          config = json.load(open('config/dios_sovereign_ai.json', encoding='utf-8'))
          negative = str(config['image']['negative_prompt']).lower()
          assert '3d render' in negative and 'cgi' in negative and 'animation' in negative
          assert config['image']['require_photoreal_human'] is True
          assert router._hf_video_available() is False
          assert router._gemini_video_available() is False
          assert ENGINE_VERSION == 'dhh-sovereign-visual-diversity-v3'
          print('Premium v5 preflight OK:', MODEL_VERSION, ref, 'visual inference stays local/offline.')
          PY
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "Voz principal disponible: Voz de Luz / Algenib. Fallback local listo."
          else
            echo "GEMINI_API_KEY no disponible: se usará Voz de Luz Local / Piper."
          fi

      - name: Generate and upload only today's missing Shorts
        if: steps.quota.outputs.missing != '0'
        run: python scripts/dioshablahoyia_sovereign_catchup_shorts.py

      - name: Persist every successful sovereign upload
        if: always() && steps.quota.outputs.missing != '0'
        shell: bash
        run: |
          RECORDS="/tmp/dios-sovereign-catchup/new-short-records.jsonl"
          test -f "$RECORDS" || exit 0
          git config user.name "youtube-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p state
            touch state/history.jsonl
            while IFS= read -r record; do
              test -n "$record" || continue
              VIDEO_ID="$(printf '%s' "$record" | python -c 'import json,sys; print(json.load(sys.stdin).get("video_id", ""))' 2>/dev/null || true)"
              if [ -n "$VIDEO_ID" ] && grep -Fq "\"video_id\": \"$VIDEO_ID\"" state/history.jsonl; then
                continue
              fi
              printf '%s\n' "$record" >> state/history.jsonl
            done < "$RECORDS"
            git add state/history.jsonl
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore: persist sovereign hosted Dios Shorts"
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1

      - name: Open issue if sovereign catch-up fails
        if: failure() && steps.quota.outputs.missing != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Dios Habla Hoy - fallo catch-up soberano hosted" \
            --body "El catch-up premium/local se detuvo para no duplicar ni degradar calidad. Revisar Actions run $GITHUB_RUN_ID."
