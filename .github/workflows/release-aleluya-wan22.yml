name: Release Aleluya - ACE-Step + Wan2.2

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar en @DemianVelo si el render completo pasa QA
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - .github/workflows/release-aleluya-wan22.yml

permissions:
  contents: read

concurrency:
  group: release-aleluya-wan22
  cancel-in-progress: false

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -U gradio_client
      - name: Generate full 3-4 minute ACE-Step song
        shell: bash
        run: |
          mkdir -p output/music
          python - <<'PY'
          import base64, os, wave, json
          from pathlib import Path
          from gradio_client import Client

          prompt = (
              "original Christian electronic worship, cinematic pop and progressive house, 122 BPM, "
              "warm deep ORIGINAL male lead singer, Argentine Spanish pronunciation, emotionally magnetic and intimate verses, "
              "large uplifting memorable chorus, luminous electronic build and drop, polished professional modern mix, "
              "hopeful spiritual atmosphere about God and Jesus Christ, no imitation of any real singer, "
              "no copyrighted melody, no commercial samples, complete song structure with intro verses prechorus chorus drop bridge final chorus outro"
          )
          lyrics = '''[INTRO]
          Cuando la noche parece no terminar,
          Tu luz me encuentra y me vuelve a levantar.

          [VERSO 1]
          Caminé entre preguntas buscando una señal,
          y en medio del silencio escuché Tu verdad.
          No fue el ruido del mundo ni una explicación,
          fue Tu paz encendiendo de nuevo el corazón.

          [PRE-CORO]
          Y aunque tiemble el suelo bajo mis pies,
          si Tu mano me sostiene, vuelvo a creer.

          [CORO]
          Aleluya, Hallelujah,
          mi esperanza vive en Vos.
          Aleluya, Hallelujah,
          late fuerte el corazón.
          Cuando todo se oscurece,
          Tu presencia trae la luz.
          Aleluya, Hallelujah,
          mi camino es con Jesús.

          [POST-CORO / DROP]
          Oh-oh, Aleluya,
          oh-oh, Hallelujah,
          Tu amor no se termina,
          Tu luz siempre estará.

          [VERSO 2]
          Si el miedo me visita y me quiere detener,
          Tu palabra me recuerda que puedo renacer.
          No necesito verlo para saber que estás,
          porque incluso en la tormenta me enseñás a confiar.

          [PRE-CORO]
          Y aunque el mundo cambie alrededor,
          Tu promesa sigue hablando al corazón.

          [CORO]
          Aleluya, Hallelujah,
          mi esperanza vive en Vos.
          Aleluya, Hallelujah,
          late fuerte el corazón.
          Cuando todo se oscurece,
          Tu presencia trae la luz.
          Aleluya, Hallelujah,
          mi camino es con Jesús.

          [PUENTE]
          Dios de vida, Dios eterno,
          cuando caigo, estás de nuevo.
          En la cima, en el desierto,
          Tu amor sigue siendo cierto.
          Y si un día pierdo el rumbo,
          Tu voz me vuelve a llamar.
          No hay distancia, no hay silencio,
          que me aparte de Tu paz.

          [BUILD]
          Aleluya…
          Hallelujah…
          Que lo escuche el cielo entero,
          que lo cante el corazón.

          [CORO FINAL]
          Aleluya, Hallelujah,
          mi esperanza vive en Vos.
          Aleluya, Hallelujah,
          para siempre sos mi Dios.
          Cuando todo se oscurece,
          Tu presencia trae la luz.
          Aleluya, Hallelujah,
          mi camino es con Jesús.

          [OUTRO]
          Aleluya… Hallelujah…
          Tu luz siempre estará.'''
          lyrics = '\n'.join(line.strip() for line in lyrics.splitlines())
          token = os.getenv('HF_TOKEN') or None
          client = Client('victor/ace-step-jam', token=token, verbose=False)
          errors = []
          for requested in (240.0, 180.0):
              try:
                  print('ACE_ATTEMPT_SECONDS=', requested)
                  result = client.predict(prompt, lyrics, requested, 8, 7.0, -1, '', 0.8, api_name='/generate')
                  if not isinstance(result, str) or not result.startswith('data:audio/') or ';base64,' not in result:
                      raise RuntimeError('ACE-Step did not return base64 audio')
                  header, b64 = result.split(';base64,', 1)
                  data = base64.b64decode(b64)
                  out = Path('output/music/Aleluya_Hallelujah_DemianVelo.wav')
                  out.write_bytes(data)
                  with wave.open(str(out), 'rb') as wf:
                      duration = wf.getnframes() / float(wf.getframerate())
                  print('ACE_ACTUAL_SECONDS=', duration, 'BYTES=', out.stat().st_size)
                  if duration < 170 or duration > 260:
                      raise RuntimeError(f'ACE-Step duration outside requested 3-5 min range: {duration:.2f}s')
                  Path('output/music/info.json').write_text(json.dumps({'duration_seconds': duration, 'requested_seconds': requested}), encoding='utf-8')
                  break
              except Exception as exc:
                  errors.append(f'{requested}s: {type(exc).__name__}: {exc}')
                  print('ACE_FAIL', errors[-1])
                  Path('output/music/Aleluya_Hallelujah_DemianVelo.wav').unlink(missing_ok=True)
          else:
              raise RuntimeError('No FREE 3-4 minute ACE-Step generation succeeded:\n' + '\n'.join(errors))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aleluya-full-music
          path: output/music/
          retention-days: 5

  video:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - scene: 1
            space: OpenKing/wan2-video-generation
            prompt: "Respectful cinematic depiction of Jesus as an original fictional biblical figure standing on a mountain at sunrise, white robe moving naturally in the wind, golden heavenly rays through dramatic clouds, compassionate expression, slow dolly in, photorealistic premium Christian electronic music video, no celebrity likeness, no text, no logo, 16:9"
          - scene: 2
            space: BYTFITY/wan2-video-generation262515414142
            prompt: "Original fictional depiction of Jesus walking beside a calm sea at golden hour, white robe, luminous horizon, warm compassionate atmosphere, cinematic anamorphic lens, smooth tracking camera, realistic natural movement, no celebrity resemblance, no text, no logos, 16:9"
          - scene: 3
            space: OpenKing/wan2-video-generation
            prompt: "A cross silhouette on a mountain ridge while deep blue storm clouds open into intense golden heavenly light, volumetric rays, epic spiritual worship music video, cinematic drone movement, realistic atmosphere, no text, no logos, 16:9"
          - scene: 4
            space: BYTFITY/wan2-video-generation262515414142
            prompt: "Original fictional Jesus figure extending a hand toward camera in a peaceful mountain valley, warm compassionate expression, white robe, golden backlight, realistic cinematic depth of field, slow push in, respectful biblical visual, no celebrity likeness, no text, no logos, 16:9"
          - scene: 5
            space: OpenKing/wan2-video-generation
            prompt: "Heavenly golden clouds above immense mountains with shafts of sunlight and a distant cross, premium cinematic Christian electronic music video, smooth aerial motion, deep blue and gold color grading, photorealistic atmosphere, no text, no logos, 16:9"
          - scene: 6
            space: BYTFITY/wan2-video-generation262515414142
            prompt: "Original fictional Jesus figure standing beside a glowing path at dawn, white robe, gentle wind, wide epic landscape, hopeful spiritual tone, cinematic slow camera movement, realistic lighting, no celebrity resemblance, no text, no logos, 16:9"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -U gradio_client
      - name: Generate Wan2.2 cinematic scene
        shell: bash
        env:
          WAN_SPACE: ${{ matrix.space }}
          WAN_SCENE: ${{ matrix.scene }}
          WAN_PROMPT: ${{ matrix.prompt }}
        run: |
          mkdir -p output/video
          python - <<'PY'
          import os, random, shutil
          from pathlib import Path
          from gradio_client import Client

          space = os.environ['WAN_SPACE']
          scene = int(os.environ['WAN_SCENE'])
          prompt = os.environ['WAN_PROMPT']
          token = os.getenv('HF_TOKEN') or None
          c = Client(space, token=token, verbose=False)
          api = c.view_api(return_format='dict')
          named = api.get('named_endpoints', api)
          candidates = []
          for endpoint, spec in named.items():
              if not isinstance(spec, dict):
                  continue
              params = spec.get('parameters') or []
              returns = spec.get('returns') or []
              ret_blob = ' '.join(str(r) for r in returns).lower()
              ep = endpoint.lower()
              if len(params) >= 7 and ('video' in ret_blob or 'video' in ep or 'generate' in ep):
                  candidates.append((endpoint, spec))
          if not candidates:
              print('API=', api)
              raise RuntimeError(f'No Wan2.2 generation endpoint found in {space}')
          candidates.sort(key=lambda x: (0 if 'generate' in x[0].lower() else 1, len(x[1].get('parameters') or [])))
          errors = []
          for endpoint, spec in candidates[:4]:
              params = spec.get('parameters') or []
              args = []
              generic = all(str(p.get('parameter_name') or '').lower().startswith('param_') for p in params)
              for idx, p in enumerate(params):
                  name = str(p.get('parameter_name') or '').lower().replace('-', '_')
                  default = p.get('default', None)
                  if generic:
                      # Common Wan2.2 Gradio order: prompt, image, width, height, frames, steps, guidance, seed.
                      mapping = {0: prompt, 1: None, 2: 1280, 3: 704, 4: 73, 5: 28, 6: 5.0, 7: 1000 + scene}
                      value = mapping.get(idx, default)
                  elif 'prompt' in name or 'description' in name:
                      value = prompt
                  elif 'image' in name:
                      value = None
                  elif name == 'width' or name.endswith('_width'):
                      value = 1280
                  elif name == 'height' or name.endswith('_height'):
                      value = 704
                  elif 'frame' in name:
                      value = 73
                  elif 'step' in name:
                      value = 28
                  elif 'guidance' in name:
                      value = 5.0
                  elif 'seed' in name:
                      value = 1000 + scene
                  elif 'duration' in name or 'seconds' in name:
                      value = 3.0
                  else:
                      value = default
                  args.append(value)
              try:
                  print('WAN_CALL', space, endpoint, 'ARGS=', [str(x)[:50] for x in args])
                  result = c.predict(*args, api_name=endpoint)
                  files = []
                  def walk(v):
                      if isinstance(v, str):
                          p = Path(v)
                          if p.exists() and p.suffix.lower() in {'.mp4','.webm','.mov'}:
                              files.append(p)
                      elif isinstance(v, dict):
                          for x in v.values(): walk(x)
                      elif isinstance(v, (list, tuple)):
                          for x in v: walk(x)
                  walk(result)
                  if not files:
                      raise RuntimeError('No downloadable video in result: ' + repr(result)[:1000])
                  src = files[0]
                  dst = Path(f'output/video/scene_{scene:02d}.mp4')
                  shutil.copy2(src, dst)
                  if dst.stat().st_size < 100000:
                      raise RuntimeError('Wan scene too small')
                  print('WAN_SUCCESS', space, endpoint, dst, dst.stat().st_size)
                  break
              except Exception as exc:
                  errors.append(f'{endpoint}: {type(exc).__name__}: {exc}')
                  print('WAN_ENDPOINT_FAIL', errors[-1])
          else:
              raise RuntimeError(f'All Wan2.2 endpoints failed for {space}: ' + ' | '.join(errors))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wan-scene-${{ matrix.scene }}
          path: output/video/
          if-no-files-found: warn
          retention-days: 5

  assemble_publish:
    needs: [music, video]
    if: ${{ always() && needs.music.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      YOUTUBE_TOKEN_DEMIANVELO: ${{ secrets.YOUTUBE_TOKEN_DEMIANVELO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aleluya-full-music
          path: build/music
      - name: Download every successful Wan scene
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: wan-scene-*
          path: build/video
          merge-multiple: true
      - name: Install FFmpeg, Pillow and YouTube dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install pillow google-api-python-client google-auth
      - name: QA assets and build 3-4 minute cinematic master
        shell: bash
        run: |
          mkdir -p release
          python - <<'PY'
          import json, math, subprocess
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageEnhance, ImageFilter, ImageFont

          music = next(Path('build/music').glob('*.wav'))
          info = json.loads(Path('build/music/info.json').read_text())
          duration = float(info['duration_seconds'])
          scenes = sorted(Path('build/video').glob('scene_*.mp4'))
          print('QA_MUSIC_SECONDS=', duration, 'WAN_SCENES=', len(scenes))
          if not 170 <= duration <= 260:
              raise RuntimeError(f'Music duration outside 3-5 minute window: {duration}')
          if len(scenes) < 2:
              raise RuntimeError('BLOQUEADO: menos de 2 escenas Wan2.2 validas; no se publicara un videoclip defectuoso.')

          normalized = []
          for i, src in enumerate(scenes, 1):
              out = Path(f'release/norm_{i:02d}.mp4')
              subprocess.run([
                  'ffmpeg','-y','-loglevel','error','-stream_loop','1','-i',str(src),'-t','6',
                  '-vf','scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=24,eq=contrast=1.06:saturation=1.08:brightness=0.005,unsharp=5:5:0.15:5:5:0',
                  '-an','-c:v','libx264','-preset','medium','-crf','18','-pix_fmt','yuv420p',str(out)
              ], check=True)
              normalized.append(out)

          # Reorder scenes across the song so repeated motifs feel intentional rather than a single loop.
          pattern = []
          base_orders = [
              list(range(len(normalized))),
              list(reversed(range(len(normalized)))),
              list(range(0,len(normalized),2)) + list(range(1,len(normalized),2)),
          ]
          needed = int(math.ceil(duration / 6.0)) + 2
          cycle = 0
          while len(pattern) < needed:
              pattern.extend(base_orders[cycle % len(base_orders)])
              cycle += 1
          pattern = pattern[:needed]
          manifest = Path('release/concat.txt')
          manifest.write_text('\n'.join(f"file '{normalized[idx].resolve()}'" for idx in pattern), encoding='utf-8')

          visual = Path('release/visual.mp4')
          subprocess.run([
              'ffmpeg','-y','-loglevel','error','-f','concat','-safe','0','-i',str(manifest),'-t',f'{duration:.3f}',
              '-vf','vignette=PI/8,noise=alls=1.2:allf=t','-an','-c:v','libx264','-preset','medium','-crf','18','-pix_fmt','yuv420p','-movflags','+faststart',str(visual)
          ], check=True)
          final = Path('release/Aleluya_Hallelujah_x_DemianVelo.mp4')
          subprocess.run([
              'ffmpeg','-y','-loglevel','error','-i',str(visual),'-i',str(music),'-t',f'{duration:.3f}',
              '-map','0:v:0','-map','1:a:0','-c:v','copy','-c:a','aac','-b:a','320k','-movflags','+faststart',str(final)
          ], check=True)

          # Professional graphic-design thumbnail using a Jesus-focused Wan scene.
          frame = Path('release/thumb_base.jpg')
          subprocess.run(['ffmpeg','-y','-loglevel','error','-ss','1','-i',str(scenes[0]),'-frames:v','1','-vf','scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720',str(frame)], check=True)
          img = Image.open(frame).convert('RGB')
          img = ImageEnhance.Contrast(img).enhance(1.14)
          img = ImageEnhance.Color(img).enhance(1.10)
          img = ImageEnhance.Sharpness(img).enhance(1.10)
          overlay = Image.new('RGBA', img.size, (0,0,0,0))
          px = overlay.load()
          for x in range(1280):
              alpha = int(205 * max(0.0, 1.0 - x/820.0))
              for y in range(720):
                  px[x,y] = (3,8,18,alpha)
          img = Image.alpha_composite(img.convert('RGBA'), overlay)
          draw = ImageDraw.Draw(img)
          font_paths = ['/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf']
          font_path = next(p for p in font_paths if Path(p).exists())
          title_font = ImageFont.truetype(font_path, 112)
          sub_font = ImageFont.truetype(font_path, 38)
          small_font = ImageFont.truetype(font_path, 30)
          # Gold accent bar and strong readable title.
          draw.rounded_rectangle((65,150,82,520), radius=8, fill=(238,190,72,255))
          draw.text((112,175),'ALELUYA',font=title_font,fill=(255,255,255,255),stroke_width=5,stroke_fill=(8,11,18,255))
          draw.text((116,315),'HALLELUJAH',font=sub_font,fill=(238,190,72,255),stroke_width=2,stroke_fill=(8,11,18,255))
          draw.text((116,385),'DEMIANVELO',font=sub_font,fill=(255,255,255,235),stroke_width=2,stroke_fill=(8,11,18,255))
          draw.text((116,455),'MÚSICA CRISTIANA ELECTRÓNICA',font=small_font,fill=(225,230,238,235),stroke_width=1,stroke_fill=(8,11,18,255))
          thumb = Path('release/thumbnail_aleluya.jpg')
          img.convert('RGB').save(thumb,'JPEG',quality=92,optimize=True)
          if thumb.stat().st_size > 1_900_000:
              img.convert('RGB').save(thumb,'JPEG',quality=84,optimize=True)

          lyrics = '''Cuando la noche parece no terminar,
          Tu luz me encuentra y me vuelve a levantar.

          Caminé entre preguntas buscando una señal,
          y en medio del silencio escuché Tu verdad.
          No fue el ruido del mundo ni una explicación,
          fue Tu paz encendiendo de nuevo el corazón.

          Aleluya, Hallelujah,
          mi esperanza vive en Vos.
          Aleluya, Hallelujah,
          late fuerte el corazón.
          Cuando todo se oscurece,
          Tu presencia trae la luz.
          Aleluya, Hallelujah,
          mi camino es con Jesús.

          Oh-oh, Aleluya,
          oh-oh, Hallelujah,
          Tu amor no se termina,
          Tu luz siempre estará.

          Si el miedo me visita y me quiere detener,
          Tu palabra me recuerda que puedo renacer.
          No necesito verlo para saber que estás,
          porque incluso en la tormenta me enseñás a confiar.

          Dios de vida, Dios eterno,
          cuando caigo, estás de nuevo.
          En la cima, en el desierto,
          Tu amor sigue siendo cierto.
          Y si un día pierdo el rumbo,
          Tu voz me vuelve a llamar.
          No hay distancia, no hay silencio,
          que me aparte de Tu paz.

          Aleluya, Hallelujah,
          mi esperanza vive en Vos.
          Aleluya, Hallelujah,
          para siempre sos mi Dios.
          Cuando todo se oscurece,
          Tu presencia trae la luz.
          Aleluya, Hallelujah,
          mi camino es con Jesús.'''
          lyrics = '\n'.join(line.strip() for line in lyrics.splitlines())
          metadata = {
              'title': 'Aleluya (Hallelujah) x DemianVelo | Música Cristiana Electrónica',
              'description': 'Una canción cristiana original de DemianVelo sobre fe, esperanza, Dios y Jesucristo. Una historia musical sobre encontrar luz, paz y fuerza aun cuando el camino se vuelve difícil.\n\nLETRA:\n' + lyrics,
              'hashtags': ['#DemianVelo','#Aleluya','#Hallelujah','#MusicaCristiana','#Jesus'],
              'tags': ['DemianVelo','Aleluya','Hallelujah','música cristiana','musica cristiana electronica','Jesus','Jesucristo','Dios','worship','electronic worship','Christian EDM','cancion cristiana','faith music'],
              'duration_seconds': duration,
              'duration_minutes': round(duration/60),
              'thumbnail_text': 'ALELUYA',
              'visual_engine_used': 'Wan2.2 TI2V-5B',
              'music_engine_used': 'ACE-Step',
          }
          Path('release/metadata.json').write_text(json.dumps(metadata, ensure_ascii=False, indent=2), encoding='utf-8')
          Path('release/qa.json').write_text(json.dumps({'duration_seconds':duration,'wan_scenes':len(scenes),'thumbnail_bytes':thumb.stat().st_size},indent=2),encoding='utf-8')
          print('MASTER_OK', final, final.stat().st_size, 'THUMB=', thumb.stat().st_size)
          PY
      - name: Publish to DemianVelo with professional thumbnail
        if: ${{ (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        shell: bash
        run: |
          test -n "$YOUTUBE_TOKEN_DEMIANVELO" || { echo "Falta YOUTUBE_TOKEN_DEMIANVELO"; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path
          from app.config import load_channel
          from app.youtube import upload_long_video
          channel = load_channel('demianvelo')
          metadata = json.loads(Path('release/metadata.json').read_text(encoding='utf-8'))
          video = Path('release/Aleluya_Hallelujah_x_DemianVelo.mp4')
          thumb = Path('release/thumbnail_aleluya.jpg')
          expected = int(metadata['duration_minutes'])
          video_id = upload_long_video(channel, metadata, video, thumbnail_path=thumb, expected_minutes=expected)
          result = {'status':'uploaded','video_id':video_id,'title':metadata['title'],'thumbnail_upload_status':metadata.get('thumbnail_upload_status')}
          Path('release/result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          print('UPLOAD_SUCCESS', json.dumps(result, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aleluya-release-package
          path: release/
          if-no-files-found: warn
          retention-days: 7
